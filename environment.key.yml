name: iclpose-key
channels:
  - pytorch
  - nvidia/label/cuda-11.6.1
  - conda-forge
  - defaults
dependencies:
  # Base runtime
  - python=3.9
  - pip

  # Core DL stack (aligned with current working environment)
  - pytorch=1.13.1
  - torchvision=0.14.1
  - pytorch-cuda=11.6

  # Common scientific stack
  - numpy=1.23.5
  - scipy=1.13.1
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - pillow=9.5.0
  - matplotlib=3.9.4
  - tensorboard=2.20.0
  - scikit-learn=1.6.1

  - pip:
      # Vision / geometry
      - opencv-python==4.8.1.78
      - open3d==0.17.0
      - trimesh==4.11.0
      - plyfile==1.1.3

      # Project utility deps
      - munch==4.0.0
      - einops==0.3.0

      # Gaussian splatting related
      - gsplat==1.0.0
      - tinycudann==2.0
      - simple-knn==0.0.0
      - diff-gauss==0.0.0

      # Optional but commonly used in current training workflow
      - wandb==0.23.1
