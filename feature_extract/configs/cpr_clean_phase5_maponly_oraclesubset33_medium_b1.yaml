# Phase 5B: coverage-preserving map-side localization-gradient probe.
# Generate the full medium K169 pose lattice, then render only a K33 subset:
# GT-nearest candidate + uniform negatives. Query/scorer stay frozen.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase4_v13_coarse_lattice_probe_medium_combo_rankhard_batch32_b6.yaml
exp_name: cpr_clean_phase5_maponly_oraclesubset33_medium_b1

dataset:
  max_train_samples: 32
  max_val_samples: 16

training:
  batch_size: 1
  max_steps: 64
  log_every: 2
  lr: 0.0001
  best_metric: map_candidate_score_fusion_pred_trans_mm
  best_metric_mode: min
  freeze_model_except_prefixes:
    - "__no_model_params__"

map_supervision:
  trainable: true
  train_geometry: false
  train_color: false
  train_fine_decoder: true
  train_coarse_fusion: true
  train_feat_sharp: false
  train_fsm: false
  train_hash_mlp: true
  train_latent: true
  map_lr_scale: 0.02
  hash_mlp_lr_scale: 0.01
  latent_lr_scale: 0.003
  detach_query_features: true

  coarse_pose_lattice_trans_cm: [0.0, 25.0, 50.0]
  coarse_pose_lattice_rot_deg: [0.0, 5.0, 10.0]
  coarse_pose_lattice_combine_trans_rot: true
  coarse_pose_lattice_max_candidates: 0
  coarse_pose_lattice_limit_strategy: head
  coarse_pose_lattice_oracle_subset_size: 33
  coarse_pose_lattice_oracle_subset_extras_strategy: uniform
  candidate_render_score_train_map: true
  candidate_render_include_aux: false
  candidate_render_batch_size: 1
  candidate_render_score_weight: 0.0
  candidate_score_fusion_weight: 0.5
  candidate_refined_pose_weight: 0.0

  query_fine_weight: 0.02
  query_coarse_weight: 0.02
  rendered_teacher_fine_weight: 0.0005
  rendered_teacher_coarse_weight: 0.0005
