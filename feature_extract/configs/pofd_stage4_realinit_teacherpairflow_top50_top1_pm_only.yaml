# POFD Stage4: distill render-at-init LoFTR teacher offsets into the
# query-centered pair matcher used by single-render CPR.
#
# The teacher correspondences are generated on the first NetVLAD+render-LoFTR
# top50 pose, which is also candidate 0 in the real-init cache.  This isolates
# whether external single-render LoFTR corrections can train a POFD-owned
# offset proposal without changing the frozen localization adapter.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage4_realinit_pairflow_top50_top1_pm_only.yaml
exp_name: pofd_stage4_realinit_teacherpairflow_top50_top1_pm_only

dataset:
  teacher_correspondence_train_path: /root/ICLPose/result/result/feature_extract/teacher_corr/oldhospital_train_renderatinit_loftr_top50qf_full895_conf03_r4_20260517
  teacher_correspondence_val_path: /root/ICLPose/result/result/feature_extract/teacher_corr/oldhospital_test_renderatinit_loftr_top50qf_full182_conf03_r4_20260517
  teacher_correspondence_max_points: 512
  teacher_correspondence_coordinate_space: auto

nvs_pose_feature_adapter:
  best_metric: nvs_teacher_pair_flow_acc
  best_metric_mode: max

  teacher_corr_weight: 0.0
  teacher_corr_local_patch_weight: 0.0
  pair_matcher_weight: 0.0
  stage4_pair_match_flow_weight: 0.0

  teacher_pair_flow_weight: 1.0
  teacher_pair_flow_radius: 12
  teacher_pair_flow_temperature: 0.05
  teacher_pair_flow_min_confidence: 0.3
  teacher_pair_flow_min_points: 16
  teacher_pair_flow_margin_weight: 0.5
  teacher_pair_flow_margin: 0.2
  teacher_pair_flow_candidate_index: 0
  teacher_pair_flow_chunk_points: 128
