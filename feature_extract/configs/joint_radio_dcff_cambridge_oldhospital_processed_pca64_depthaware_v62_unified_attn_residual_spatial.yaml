base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v61_stageb_map_query_flowhead_obs.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v62_unified_attn_residual_spatial

model:
  fine_loc_head: false
  fine_loc_highres_source: null
  export_fine_key: fine

  global_context_enabled: true
  global_context_zero_init: true
  window_attention_layers: 2
  window_attention_heads: 8
  window_attention_size: 16
  window_attention_mlp_ratio: 2.0
  window_attention_shift: true
  window_attention_zero_init: true

  query_channel_gate_enabled: true
  query_channel_gate_zero_init: true
  apply_query_channel_gate: true

  local_flow_head_enabled: false
  warmstart_strict: false
  warmstart_skip_prefixes:
    - fine_loc_head.
    - fine_loc_highres_fuse.
    - fine_loc_scale
    - fine_loc_highres_scale
    - local_flow_head.
    - global_context.
    - window_attention.
    - query_channel_gate.

training:
  seed: 162
  lr: 5.0e-5
  max_steps: 1200
  freeze_model_except_prefixes:
    - global_context.
    - window_attention.
    - query_channel_gate.
    - local_corr_projector.
    - stage3.
    - stage4.
    - fine_fuse.
    - fine_low_fuse.
    - fine_low_scale
    - fine_highres_fuse.
    - fine_highres_scale
    - fine_head.
    - coarse_refine.
    - coarse_head.
  model_lr_scales:
    global_context.: 0.25
    window_attention.: 0.25
    query_channel_gate.: 1.0
    local_corr_projector.: 8.0
    stage3.: 0.03
    stage4.: 0.08
    fine_head.: 0.35
    coarse_head.: 0.35
    coarse_refine.: 0.25

loss:
  fine_l1_weight: 0.3
  fine_cos_weight: 0.3
  coarse_l1_weight: 0.3
  coarse_cos_weight: 0.3

map_supervision:
  config_path: feature_field/configs/reconstruction_cambridge_oldhospital_processed_cached64_v11_residual_spatial.yaml
  query_fine_key: fine
  query_local_fine_key: fine

  trainable: true
  train_fine_decoder: true
  train_coarse_fusion: false
  train_feat_sharp: true
  train_fsm: true
  train_hash_mlp: true
  train_latent: true
  train_geometry: false
  map_lr_scale: 0.02
  hash_mlp_lr_scale: 0.02
  latent_lr_scale: 0.01

  local_flow_head_enabled: false
  query_fine_weight: 0.10
  query_coarse_weight: 0.08
  query_fine_infonce_weight: 0.01
  query_local_fine_weight: 0.0
  query_local_fine_infonce_weight: 0.0
  query_local_fine_grad_weight: 0.0

  query_corr_radius: 8
  query_corr_ce_weight: 0.5
  query_corr_subpixel_weight: 0.8
  query_corr_peak_margin_weight: 5.0
  query_corr_flow_weight: 0.0
  query_corr_flow_cosine_weight: 0.0
  query_corr_flow_head_conf_weight: 0.0
  query_corr_min_flow_px: 0.75
  query_corr_max_flow_px: 8.0
  query_corr_wls_pose_weight: 0.10
  query_corr_wls_pose_damping: 0.02
  query_corr_wls_pose_update_scale: 0.25
  query_corr_wls_pose_rot_weight: 0.2
  query_corr_wls_pose_trans_weight: 40.0

  feature_metric_pose_weight: 0.05
  feature_metric_pose_damping: 0.05
  feature_metric_pose_update_scale: 0.25
  feature_metric_pose_rot_weight: 0.1
  feature_metric_pose_trans_weight: 30.0
  feature_metric_pose_normalize: true

  perturb_render_negatives: true
  perturb_trans_cm_choices: [2.0, 5.0, 10.0, 20.0]
  perturb_rot_deg: 0.5

  rendered_teacher_fine_weight: 0.01
  rendered_teacher_fine_weight_end: 0.002
  rendered_teacher_fine_weight_anneal_epochs: 4
  map_self_feature_metric_pose_weight: 0.0
  map_self_flow_warp_weight: 0.0
  map_self_flow_warp_contrastive_weight: 0.0

export:
  fine_key: fine
