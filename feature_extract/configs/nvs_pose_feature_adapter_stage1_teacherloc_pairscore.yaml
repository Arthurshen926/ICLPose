# Stage 1C: use the pair-conditioned heatmap decoder as the candidate scorer.
#
# This is the main implementation of the expert recommendation to avoid
# collapsing query-map evidence into hand-written cosine statistics.  The score
# for each pose hypothesis is produced by local heatmaps from the trained
# matcher over a sparse grid.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_teacherloc_direction_rank.yaml
exp_name: nvs_pose_feature_adapter_stage1_teacherloc_pairscore

training:
  batch_size: 16
  validation_batch_size: 16
  max_steps: 120
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: selected_correction_cos
  best_metric_mode: max

  pair_matcher_enabled: true
  pair_matcher_weight: 2.0
  pair_matcher_hidden_dim: 96
  pair_matcher_radius: 3
  pair_matcher_temperature: 0.04
  pair_matcher_min_confidence: 0.3
  pair_matcher_min_points: 8
  pair_matcher_positive_weight: 0.5
  pair_matcher_margin_weight: 0.5
  pair_matcher_margin: 0.05
  pair_matcher_base_dot_weight: 1.0
  pair_matcher_zero_init_residual: true
  pair_matcher_score_stride: 8
  pair_matcher_score_chunk_points: 32768

  score_mode: pair_matcher_local
  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  score_correction_cosine_weight: 0.5
  score_pose_improvement_weight: 0.5
  score_anti_identity_weight: 0.5

  teacher_corr_weight: 1.0
  teacher_corr_local_patch_weight: 2.0
