base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_locaware_flowhead_v58_corrproj_mapself_pretrain_concat_logself.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_coarseinit_fineloc_mapjoint_v1

model:
  pose_init_head: true
  pose_init_mode: feature_bank
  pose_init_anchor_sampling: train_all
  pose_init_num_anchors: 895
  pose_init_hypotheses: 10
  pose_init_hidden_dim: 512
  pose_init_residual_scale: 0.25
  pose_init_temperature: 0.03
  pose_init_feature_bank_projector: identity
  pose_init_feature_source: coarse
  pose_init_feature_bank_source: map
  warmstart_strict: false
  warmstart_skip_prefixes: []

pose_init:
  enabled: true
  trans_weight: 1.0
  rot_weight: 0.25
  score_weight: 0.5
  uncertainty_weight: 0.01
  rot_cost_weight: 0.1
  anchor_weight: 1.0

training:
  seed: 811
  lr: 0.00002
  batch_size: 1
  num_workers: 0
  max_steps: 700
  freeze_model_except_prefixes:
    - "coarse_refine."
    - "coarse_head."
    - "fine_fuse."
    - "fine_low_fuse."
    - "fine_low_scale"
    - "fine_highres_fuse."
    - "fine_highres_scale"
    - "fine_head."
    - "fine_loc_head."
    - "fine_loc_highres_fuse."
    - "fine_loc_scale"
    - "fine_loc_highres_scale"
    - "local_corr_projector."
    - "pose_init_head."
  model_lr_scales:
    pose_init_head.: 3.0
    local_corr_projector.: 4.0
    fine_loc_head.: 2.0
    fine_loc_highres_fuse.: 2.0
    coarse_head.: 1.5
    coarse_refine.: 1.0

map_supervision:
  trainable: true
  map_lr_scale: 0.10
  hash_mlp_lr_scale: 0.05
  latent_lr_scale: 0.025
  train_fine_decoder: true
  train_coarse_fusion: true
  train_feat_sharp: false
  train_fsm: true
  train_hash_mlp: true
  train_latent: true
  train_geometry: false

  query_fine_key: fine_loc
  query_fine_weight: 0.08
  query_fine_raw_weight: 0.001
  query_coarse_weight: 0.05
  coarse_pose_rank_weight: 1.0
  coarse_pose_rank_temperature: 0.05
  query_fine_infonce_weight: 0.010
  query_coarse_infonce_weight: 0.020
  query_fine_grad_weight: 0.010
  query_coarse_grad_weight: 0.002
  query_variance_weight: 0.015
  query_covariance_weight: 0.003
  map_variance_weight: 0.005
  map_covariance_weight: 0.001

  rendered_teacher_fine_weight: 0.010
  rendered_teacher_coarse_weight: 0.005
  rendered_teacher_fine_infonce_weight: 0.002
  rendered_teacher_coarse_infonce_weight: 0.002
  rendered_teacher_fine_grad_weight: 0.002

  query_corr_feature_preprocess: concat_highpass
  query_corr_highpass_kernel: 5
  query_corr_highpass_scale: 1.0
  query_corr_radius: 8
  query_corr_temperature: 0.008
  query_corr_ce_temperature: 0.04
  query_corr_huber_delta: 0.06
  query_corr_flow_decode_mode: argmax_st
  query_corr_min_flow_px: 0.75
  query_corr_max_flow_px: 6.0
  query_corr_ce_weight: 0.8
  query_corr_subpixel_weight: 1.2
  query_corr_flow_weight: 0.25
  query_corr_peak_margin_weight: 10.0
  query_corr_peak_margin: 0.04
  query_corr_wls_pose_weight: 0.10
  query_corr_wls_pose_damping: 0.02
  query_corr_wls_pose_update_scale: 0.35
  query_corr_wls_pose_rot_weight: 0.2
  query_corr_wls_pose_trans_weight: 40.0
  query_corr_wls_conf_threshold: 0.05
  query_corr_wls_conf_power: 2.0
  query_corr_pose_gain_weight: 0.20
  query_corr_pose_gain_trans_weight: 1.0

  query_flow_warp_weight: 0.05
  query_flow_warp_contrastive_weight: 2.0
  query_flow_warp_contrastive_margin: 0.15

  map_self_corr_ce_weight: 0.25
  map_self_corr_subpixel_weight: 0.40
  map_self_corr_flow_weight: 0.08
  map_self_corr_peak_margin_weight: 0.8
  feature_metric_pose_weight: 0.03
