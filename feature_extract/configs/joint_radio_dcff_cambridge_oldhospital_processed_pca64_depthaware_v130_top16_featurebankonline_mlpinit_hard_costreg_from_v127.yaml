base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v128_top16_featurebankonline_hard_costreg_scoreonly_from_v127.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v130_top16_featurebankonline_mlpinit_hard_costreg_from_v127

model:
  pose_init_feature_bank_projector: mlp
  pose_init_hidden_dim: 256
  pose_init_feature_bank_refresh_on_start: false

pose_init:
  enabled: true
  trans_weight: 0.0
  rot_weight: 0.0
  score_weight: 0.0
  uncertainty_weight: 0.0
  rot_cost_weight: 0.08
  anchor_weight: 12.0
  anchor_soft_sigma_m: 1.5
  anchor_soft_rot_sigma_deg: 20.0
  use_all_anchor_pose_loss: true

training:
  seed: 230
  max_steps: 640
  freeze_model_except_prefixes:
    - pose_init_head.
    - candidate_score_fusion_head.
  model_lr_scales:
    pose_init_head.: 8.0
    candidate_score_fusion_head.: 1.0
