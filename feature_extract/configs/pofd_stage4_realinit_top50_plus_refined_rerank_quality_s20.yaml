# Pivot probe: same top50+refined candidate bank as the rank probe, but with a
# stronger render-LoFTR/PnP quality distillation term. This tests whether the
# external correspondence quality fields can teach the old POFD scorer to
# identify the appended refined proposal.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage4_realinit_top50_plus_refined_rerank_rank_s20.yaml
exp_name: pofd_stage4_realinit_top50_plus_refined_rerank_quality_s20

nvs_pose_feature_adapter:
  rank_ce_weight: 0.5
  rank_pairwise_weight: 0.25
  candidate_teacher_quality_weight: 3.0
  candidate_teacher_quality_pairwise_weight: 0.25
  candidate_observability_weight: 0.25
  score_pose_improvement_weight: 0.25
