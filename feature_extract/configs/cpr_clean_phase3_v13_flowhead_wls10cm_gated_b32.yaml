# Clean CPR Phase 3: explicit local flow/confidence head for fine refinement.
# Raw map/query features remain frozen.  The flow head learns residual local
# flow from the clean correlation volume, then WLS is protected by the same
# confidence-gated fallback used in the softargmax baseline.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase3_v13_corrproj_wls10cm_gated_lenient_b32.yaml
exp_name: cpr_clean_phase3_v13_flowhead_wls10cm_gated_b32

model:
  local_flow_head_enabled: true
  local_flow_head_radius: 4
  local_flow_head_hidden_dim: 96
  local_flow_head_zero_init: true
  local_flow_head_max_flow: 4.0
  local_flow_head_base_flow_mode: softargmax
  local_flow_head_base_temperature: 0.05
  local_flow_head_context_mode: basic

training:
  batch_size: 32
  max_steps: 1600
  lr: 0.00008
  best_metric: map_corr_wls_gated_trans_gain_mm
  best_metric_mode: max
  freeze_model_except_prefixes:
    - "local_corr_projector."
    - "local_flow_head."
  model_lr_scales:
    local_corr_projector.: 0.3
    local_flow_head.: 1.0

map_supervision:
  local_flow_head_enabled: true
  query_corr_flow_weight: 0.50
  query_corr_flow_cosine_weight: 0.25
  query_corr_flow_head_conf_weight: 0.10
  query_corr_wls_pose_weight: 0.015
  query_corr_wls_accept_min_conf_mean: 0.40
  query_corr_wls_accept_min_conf_cov: 0.40
  query_corr_wls_accept_max_delta_mm: 150.0
