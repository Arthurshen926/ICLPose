# POFD Stage4 PMED probe: selected oracle + online hard-negative pair-flow.
#
# This keeps the main all-candidate pair-flow config as the safer default and
# isolates the recommendation-file PMED hard-negative variant for controlled
# follow-up experiments.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage4_pairflow_mixed_10_25_50_shuf.yaml
exp_name: pofd_stage4_pmed_mixed_10_25_50_shuf

nvs_pose_feature_adapter:
  stage4_pair_match_flow_candidate_mode: best_and_hard_negative
  stage4_pair_match_flow_positive_only_ce: true
  stage4_pair_match_flow_cross_candidate_margin_weight: 0.25
  stage4_pair_match_flow_cross_candidate_margin: 0.2
  stage4_pair_match_flow_hard_negative_min_cost_gap_m: 0.12
