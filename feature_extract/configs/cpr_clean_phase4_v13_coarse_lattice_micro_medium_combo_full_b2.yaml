# Micro diagnostic for the full 169-candidate medium combined lattice.
# This is the coverage baseline after uniform64/96 proved unstable on real poses.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase4_v13_coarse_lattice_probe_medium_linear_fixedrot_b16.yaml
exp_name: cpr_clean_phase4_v13_coarse_lattice_micro_medium_combo_full_b2

dataset:
  max_train_samples: 8
  max_val_samples: 4

training:
  batch_size: 2
  max_steps: 40
  log_every: 1

map_supervision:
  coarse_pose_lattice_trans_cm: [0.0, 25.0, 50.0]
  coarse_pose_lattice_rot_deg: [0.0, 5.0, 10.0]
  coarse_pose_lattice_combine_trans_rot: true
  coarse_pose_lattice_max_candidates: 0
  coarse_pose_lattice_limit_strategy: head
