base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_decoupled_corrdirect_v19.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_decoupled_corrmatcher_v20

model:
  local_matcher_enabled: true
  local_matcher_radius: 10
  local_matcher_hidden_dim: 128
  local_matcher_zero_init: true
  local_matcher_residual_scale: 0.5
  local_flow_head_enabled: false
  warmstart_skip_prefixes: ["local_matcher."]

training:
  seed: 937
  lr: 0.00006
  batch_size: 2
  max_steps: 500
  freeze_model_except_prefixes:
    - "local_matcher."
    - "stage3."
    - "stage4."
    - "fine_fuse."
    - "fine_low_fuse."
    - "fine_low_scale"
    - "fine_highres_fuse."
    - "fine_highres_scale"
    - "fine_head."
    - "fine_loc_head."
    - "fine_loc_highres_fuse."
    - "fine_loc_scale"
    - "fine_loc_highres_scale"
    - "local_corr_projector."
  model_lr_scales:
    local_matcher.: 4.0
    stage3.: 0.03
    stage4.: 0.08
    fine_head.: 0.35
    fine_loc_head.: 4.0
    fine_loc_highres_fuse.: 4.0
    local_corr_projector.: 4.0

map_supervision:
  local_matcher_enabled: true
  local_flow_head_enabled: false
  query_corr_ce_weight: 4.0
  query_corr_subpixel_weight: 2.0
  query_corr_flow_weight: 0.20
  query_corr_flow_cosine_weight: 1.0
  query_corr_peak_margin_weight: 12.0
  query_corr_temperature: 0.015
  query_corr_ce_temperature: 0.050
