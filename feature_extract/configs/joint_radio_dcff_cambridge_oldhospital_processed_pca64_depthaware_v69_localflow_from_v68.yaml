base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v68_unified_attn_residual_spatial_alignfirst_stop640.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v69_localflow_from_v68

model:
  warmstart_strict: false
  warmstart_skip_prefixes:
    - local_flow_head.

  local_matcher_enabled: false
  local_flow_head_enabled: true
  local_flow_head_radius: 8
  local_flow_head_hidden_dim: 128
  local_flow_head_zero_init: true
  local_flow_head_max_flow: 8.0
  local_flow_head_base_flow_mode: softargmax
  local_flow_head_base_temperature: 0.01
  local_flow_head_context_mode: basic

training:
  seed: 169
  lr: 1.0e-4
  max_steps: 384
  freeze_model_except_prefixes:
    - local_flow_head.
  model_lr_scales:
    local_flow_head.: 1.0

map_supervision:
  config_path: feature_field/configs/reconstruction_cambridge_oldhospital_processed_cached64_v11_residual_spatial_v68_joint.yaml
  trainable: false
  train_fine_decoder: false
  train_coarse_fusion: false
  train_feat_sharp: false
  train_fsm: false
  train_hash_mlp: false
  train_latent: false
  train_geometry: false

  query_fine_weight: 0.0
  query_coarse_weight: 0.0
  query_fine_infonce_weight: 0.0
  rendered_teacher_fine_weight: 0.0
  rendered_teacher_fine_weight_end: 0.0
  rendered_teacher_fine_infonce_weight: 0.0

  local_matcher_enabled: false
  local_flow_head_enabled: true
  query_corr_radius: 8
  query_corr_temperature: 0.01
  query_corr_flow_decode_mode: softargmax
  query_corr_ce_weight: 0.0
  query_corr_subpixel_weight: 0.0
  query_corr_peak_margin_weight: 0.0
  query_corr_flow_weight: 20.0
  query_corr_flow_cosine_weight: 1.0
  query_corr_flow_head_conf_weight: 0.2
  query_corr_min_flow_px: 0.25
  query_corr_max_flow_px: 8.0
  query_corr_huber_delta: 0.05
  query_corr_wls_pose_weight: 0.5
  query_corr_pose_gain_weight: 0.2
  query_corr_pose_gain_trans_margin_mm: 1.0
  query_corr_pose_gain_rot_margin_deg: 0.02
  query_corr_wls_pose_damping: 0.02
  query_corr_wls_pose_update_scale: 0.25
  query_corr_wls_pose_rot_weight: 0.2
  query_corr_wls_pose_trans_weight: 40.0
