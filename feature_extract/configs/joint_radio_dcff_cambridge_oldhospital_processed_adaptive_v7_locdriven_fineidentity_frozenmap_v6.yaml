base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_fineidentity_strong_v5.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_fineidentity_frozenmap_v6

training:
  seed: 859
  lr: 0.00004
  max_steps: 300
  freeze_model_except_prefixes:
    - "stage3."
    - "stage4."
    - "fine_fuse."
    - "fine_low_fuse."
    - "fine_low_scale"
    - "fine_highres_fuse."
    - "fine_highres_scale"
    - "fine_head."
    - "fine_loc_head."
    - "fine_loc_highres_fuse."
    - "fine_loc_scale"
    - "fine_loc_highres_scale"
    - "local_corr_projector."
  model_lr_scales:
    stage3.: 0.15
    stage4.: 0.25
    fine_loc_head.: 3.0
    fine_loc_highres_fuse.: 3.0
    local_corr_projector.: 5.0

map_supervision:
  trainable: false
  map_lr_scale: 0.0
  hash_mlp_lr_scale: 0.0
  latent_lr_scale: 0.0
  train_fine_decoder: false
  train_coarse_fusion: false
  train_feat_sharp: false
  train_fsm: false
  train_hash_mlp: false
  train_latent: false
  train_geometry: false
