# POFD Stage 2 medium-basin probe.
#
# This is not a retrieval/coarse experiment.  It tests whether the single
# localization feature plus observability contrast can close the q50 topK
# rerank gap on shuffled local-NVS candidates.  PNP teacher-quality is disabled
# because prior runs plateaued at the PNP-composite teacher level.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_matchingloc_teacherquality_q50_paircorr_shuf.yaml
exp_name: pofd_stage2_poseobs_q50_shuf

training:
  batch_size: 8
  validation_batch_size: 8
  pin_memory: false
  max_steps: 100
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: pred_cost_m
  best_metric_mode: min

  candidate_teacher_quality_weight: 0.0
  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  score_correction_cosine_weight: 0.5
  score_pose_improvement_weight: 0.5
  score_anti_identity_weight: 0.5

  observability_contrast_weight: 0.5
  observability_contrast_margin: 0.05
  observability_negative_min_cost_m: 0.12
  observability_contrast_score_source: selection_score
  pose_energy_enabled: false
