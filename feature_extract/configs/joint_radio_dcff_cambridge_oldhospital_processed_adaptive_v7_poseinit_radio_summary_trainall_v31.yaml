base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_poseinit_radio_summary_rank_v30.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_poseinit_radio_summary_trainall_v31
output_dir: /root/ICLPose/result/feature_extract

model:
  warmstart_strict: false
  warmstart_skip_prefixes:
    - pose_init_head.
  pose_init_head: true
  pose_init_mode: anchor
  pose_init_token_source: retrieval
  pose_init_anchor_sampling: train_all
  pose_init_num_anchors: 4096
  pose_init_hypotheses: 64
  pose_init_residual_scale: 1.0
  pose_init_hidden_dim: 768

pose_init:
  enabled: true
  trans_weight: 10.0
  rot_weight: 1.5
  score_weight: 1.0
  uncertainty_weight: 0.01
  rot_cost_weight: 0.08
  anchor_weight: 24.0
  anchor_soft_sigma_m: 1.5
  anchor_soft_rot_sigma_deg: 20.0
  use_all_anchor_pose_loss: true

training:
  seed: 1021
  batch_size: 16
  num_workers: 0
  allow_highres_num_workers: false
  lr: 0.00006
  max_steps: 3000
  log_every: 10
  freeze_model_except_prefixes:
    - retrieval_head.
    - pose_init_head.
  model_lr_scales:
    retrieval_head.: 8.0
    pose_init_head: 20.0

loss:
  fine_l1_weight: 0.0
  fine_cos_weight: 0.0
  fine_grad_weight: 0.0
  fine_channel_std_weight: 0.0
  coarse_l1_weight: 0.0
  coarse_cos_weight: 0.0
  coarse_grad_weight: 0.0
  coarse_channel_std_weight: 0.0
  query_teacher_infonce_weight: 0.0
