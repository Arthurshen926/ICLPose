base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stage1_posebank_poseinit.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stage1_featurebank_poseinit
output_dir: /root/ICLPose/result/feature_extract

model:
  pose_init_head: true
  pose_init_mode: feature_bank
  pose_init_anchor_sampling: train_all
  pose_init_hypotheses: 10
  pose_init_num_anchors: 895
  pose_init_residual_scale: 0.25
  pose_init_temperature: 0.03
  pose_init_feature_bank_projector: identity
  pose_init_hidden_dim: 512
  apply_query_channel_gate: false
  warmstart_strict: false
  warmstart_skip_prefixes:
    - "local_matcher."
    - "local_flow_head."
    - "pose_init_head."
    - "query_channel_gate."

pose_init:
  enabled: true
  trans_weight: 2.0
  rot_weight: 0.5
  score_weight: 0.0
  uncertainty_weight: 0.0
  rot_cost_weight: 0.05
  anchor_weight: 1.0

training:
  epochs: 8
  batch_size: 1
  num_workers: 0
  lr: 0.00002
  max_steps: 1200
  log_every: 10
  model_lr_scales:
    pose_init_head: 4.0
    query_channel_gate: 1.0
