# Clean CPR Phase 2 continuation focused on WLS-useful flow direction.
# Starts from the best projector checkpoint and adds a direction loss on the
# local-correlation soft flow while raw map/query features stay frozen.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase2_v13_corrproj_b32.yaml
exp_name: cpr_clean_phase2_v13_corrproj_flowcos_b32

training:
  batch_size: 32
  num_workers: 0
  max_steps: 2500
  lr: 0.0001
  best_metric: map_query_corr_subpx_flow_epe
  best_metric_mode: min
  freeze_model_except_prefixes:
    - "local_corr_projector."

map_supervision:
  query_corr_ce_weight: 0.35
  query_corr_subpixel_weight: 0.35
  query_corr_flow_cosine_weight: 0.30
  query_corr_peak_margin_weight: 1.0
  query_corr_wls_pose_weight: 0.0

