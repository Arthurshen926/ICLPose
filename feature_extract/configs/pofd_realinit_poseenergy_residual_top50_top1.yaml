# Single-render residual-pose pivot on the real NetVLAD+render-LoFTR top50
# initializer.  This tests whether POFD features can learn a direct pose update
# from one rendered candidate after PMED/flow-style proposal sources failed.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage4_realinit_pairflow_top50_top1_pm_only.yaml
exp_name: pofd_realinit_poseenergy_residual_top50_top1

dataset:
  max_val_samples: 182

training:
  batch_size: 2
  validation_batch_size: 2
  max_steps: 80
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: pose_energy_residual_pred_cost_m
  best_metric_mode: min

  train_pose_feature_adapter_domains: none
  train_pair_matcher: false
  train_pose_energy_net: true

  pair_matcher_enabled: false
  pair_matcher_weight: 0.0
  stage4_pair_match_flow_weight: 0.0
  teacher_corr_weight: 0.0
  teacher_corr_local_patch_weight: 0.0
  teacher_pair_flow_weight: 0.0
  denseflow_enabled: false
  denseflow_weight: 0.0

  align_weight: 0.0
  warp_align_weight: 0.0
  rank_ce_weight: 0.0
  rank_pairwise_weight: 0.0
  drift_weight: 0.0
  variance_weight: 0.0
  score_mode: local_zero_offset
  local_zero_peak_gap_weight: 0.0
  local_zero_offset_weight: 0.0
  local_flow_nce_weight: 0.0

  pose_energy_enabled: true
  pose_energy_weight: 1.0
  pose_energy_score_source: local_corr
  pose_energy_score_map_mode: peak_offset
  pose_energy_score_preprocess: spatial_center
  pose_energy_score_highpass_kernel: 5
  pose_energy_hidden_dim: 128
  pose_energy_map_channels: 16
  pose_energy_grid_size: 4
  pose_energy_factorized_heads: false
  pose_energy_zero_init_residual_head: false
  pose_energy_use_candidate_delta: true
  pose_energy_use_delta_vector: true
  pose_energy_use_center_delta_vector: true
  pose_energy_use_uncertainty: false
  pose_energy_use_rgb: true
  pose_energy_hard_ce_weight: 0.0
  pose_energy_translation_weight: 0.0
  pose_energy_rotation_weight: 0.0
  pose_energy_joint_weight: 0.0
  pose_energy_confidence_weight: 0.0
  pose_energy_anti_identity_weight: 0.0
  pose_energy_pairwise_rank_weight: 0.0
  pose_energy_direction_weight: 0.0
  pose_energy_correction_cosine_weight: 0.0
  pose_energy_residual_weight: 1.0
  pose_energy_residual_target_mode: all
  pose_energy_improve_weight: 0.2
  pose_energy_improve_margin_m: 0.0
  pose_energy_update_scale: 1.0
  pose_energy_residual_trans_scale_m: 0.25
  pose_energy_residual_rot_scale_deg: 5.0
  pose_energy_select_for_metric: true
