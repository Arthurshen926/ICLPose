base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_coarseinit_fineloc_mapjoint_v2_coarseglobal.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_coarseinit_fineloc_mapjoint_v3_fps128

model:
  pose_init_anchor_sampling: fps
  pose_init_num_anchors: 128
  pose_init_hypotheses: 8
  pose_init_feature_bank_source: map
  pose_init_feature_source: coarse
  pose_init_feature_bank_projector: mlp
  pose_init_temperature: 0.05
  pose_init_residual_scale: 1.0

pose_init:
  enabled: true
  trans_weight: 0.8
  rot_weight: 0.15
  score_weight: 1.0
  uncertainty_weight: 0.01
  rot_cost_weight: 0.1
  anchor_weight: 3.0

training:
  seed: 829
  lr: 0.000025
  max_steps: 700

map_supervision:
  coarse_pose_rank_weight: 2.0
  query_coarse_weight: 0.10
  query_coarse_infonce_weight: 0.030
  query_corr_wls_pose_weight: 0.05
  query_corr_pose_gain_weight: 0.10
