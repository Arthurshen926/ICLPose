protocol_id: stmaryschurch_2dgs_surface_map_only_v2
dataset_family: CambridgeLandmarks
scene: StMarysChurch
role: development_scene_full_training_and_530_query_non_regression

disclosure:
  query_ground_truth_already_consumed: true
  untouched_test_claim: false
  purpose: restore_and_validate_the_map_only_vfm_mainline

offline_map_build:
  gaussian_ply: /root/StMaryChurch2dgs.ply
  mapping_rgb_root: /hy-tmp/Cambridge_stdloc/StMarysChurch
  mapping_pose_file: /hy-tmp/Cambridge_stdloc/StMarysChurch/dataset_train.txt
  camera_intrinsics_model: /hy-tmp/Cambridge_stdloc/CambridgeLandmarks_Colmap_Retriangulated_1024px/StMarysChurch/model_train
  mapping_rgb_use: offline_feature_extraction_only
  mapping_rgb_persisted_in_deployment_map: false
  use_sfm_points: false
  use_sfm_tracks: false

deployment_map:
  representation: feature_conditioned_2dgs_surface_map
  geometry:
    - surface_maplet_geometry
    - stable_surface_anchor_xyz_normal_covariance_quality
  features:
    - radio_final_2dgs_surface_observation_features
    - radio_final_maplet_descriptors
    - radio_final_view_conditioned_maplet_prototypes
    - alike_anchor_descriptor_prototypes
    - anchor_prototype_view_ids_and_quality
  identities:
    coarse: surface_maplet_id
    fine: stable_surface_anchor_id
  excluded:
    - mapping_rgb
    - mapping_image_path_for_runtime_access
    - mapping_view_depth
    - sfm_point_id
    - sfm_track_id
    - radio_intermediate

coarse_match:
  query_feature: radio_final
  full_map_mapper_before_sampling: true
  mapper_supervision: cross_view_2dgs_surface_maplet_identity
  fit_validation_split: mapping_image_disjoint
  region_pool_sizes: [1, 3, 5, 9]
  region_pool_weights: [0.40, 0.30, 0.20, 0.10]
  retrieval_top_k: 8
  surface_feature_modes:
    source: stored_radio_final_2dgs_surface_observations
    mapping_image_access: false
    identity_semantics: appearance_visibility_mode_label
    maximum_global_modes: 64
    maximum_modes: 8
    affine_layout_ransac: true

fine_match:
  query_feature: alike_fpn_detector_descriptors
  target: stable_2dgs_anchor_feature_sets_inside_retrieved_maplets
  matcher:
    type: cross_attention_partial_optimal_transport
    support_aggregation: query_conditioned_view_prototype_attention
    global_constraint: one_to_one_anchor_capacity
    explicit_query_dustbin: true
    explicit_anchor_dustbin: true
    retained_anchor_candidates: 20
    maximum_scene_maplets_for_full_matcher: 12
  training:
    split: sha256_mapping_image_disjoint_mod5
    validation_view_features_excluded_from_anchor_prototypes: true
    hard_negatives: nearest_radio_maplet
    selection_metrics:
      - positive_anchor_recall_at_1
      - dustbin_auprc
      - mean_loss

pose:
  solver: grouped_multi_hypothesis_pnp
  hypothesis_count: 128
  identity_uncertainty: retained_until_pose_scoring
  fit_and_verification_groups_disjoint: true
  mode_selection:
    evidence: fixed_maplet_conditioned_alike_candidate_pool
    retained_anchor_candidates: 10
    same_pool_for_every_pose: true
  duplicate_anchor_capacity: one
  refinement:
    type: pose_guided_alike_feature_em
    scope: radio_retrieved_maplet_anchors_only
    mapping_rgb_access: false
  strict_failure_fallback:
    trigger: no_successful_maplet_scoped_pose_mode
    coarse_condition: selected_radio_final_surface_feature_modes
    expanded_scope: all_stable_2dgs_anchor_features
    mapping_rgb_access: false
    final_surface_observation_fallback:
      trigger: no_successful_stable_anchor_pose_mode
      query_feature: radio_final
      map_entries: cached_2dgs_surface_feature_and_xyz
      mapping_rgb_access: false
      view_depth_access: false
      sfm_access: false

runtime_inputs:
  - query_rgb
  - query_radio_final_tokens
  - surface_maplet_mapper_checkpoint
  - surface_maplets
  - stable_surface_anchors
  - anchor_alike_feature_bank
  - radio_final_2dgs_surface_feature_bank
  - surface_anchor_set_matcher_checkpoint
  - camera_intrinsics

forbidden_runtime_inputs:
  - mapping_rgb
  - mapping_image_retrieval
  - pairwise_query_mapping_image_matching
  - mapping_view_depth
  - sfm_points
  - sfm_tracks
  - radio_intermediate
  - query_ground_truth_pose

validation:
  stages:
    - artifact_and_runtime_contract
    - image_disjoint_maplet_retrieval
    - image_disjoint_anchor_set_assignment_vs_cosine
    - grouped_pnp_oracle_and_selected_pose
    - full_530_query_localization
    - paired_non_regression
  query_count: 530
  non_regression:
    baseline: prior_feature_only_2dgs_v1
    compare_on_identical_query_ids: true
    required:
      - no_lower_success_rate
      - no_worse_median_translation
      - no_worse_p90_translation
      - no_worse_median_rotation
  completed_result:
    pose_success: 530
    query_count: 530
    translation_m:
      median: 0.30233081888640406
      p90: 2.0403209835261404
      p95: 3.738983746817791
      mean: 0.9318542296640316
      max: 25.06805998493601
    rotation_deg:
      median: 0.9481643183860636
      p90: 6.108991025658846
      p95: 13.46239267417613
      mean: 2.869508825546496
      max: 53.53718611891354
    previous_feature_only_baseline:
      translation_median: 1.177776866371203
      translation_p90: 6.0587381573817005
      rotation_median: 3.519068719830618
      rotation_p90: 20.210261693426652
      pose_success: 530
    paired_wins:
      translation: 423
      rotation: 428
      both: 396
    known_regression:
      recall_5cm_5deg:
        new: 0.011320754716981131
        baseline: 0.018867924528301886
    reports:
      results: output/vfm/2dgs_surface/StMarysChurch/full_train/mainline_v2/full_h128/full_results.jsonl
      merge: output/vfm/2dgs_surface/StMarysChurch/full_train/mainline_v2/full_h128/merge_summary.json
      evaluation: output/vfm/2dgs_surface/StMarysChurch/full_train/mainline_v2/full_h128/evaluation.json
