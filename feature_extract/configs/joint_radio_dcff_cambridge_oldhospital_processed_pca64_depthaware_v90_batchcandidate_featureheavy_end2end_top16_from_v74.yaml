base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v89_batchcandidate_linear_fusion_end2end_top16_from_v74.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v90_batchcandidate_featureheavy_end2end_top16_from_v74

model:
  candidate_score_fusion_head: true
  candidate_score_fusion_input_dim: 12
  candidate_score_fusion_hidden_dim: 0
  candidate_score_fusion_zero_init: false
  # Put more initial mass on the current query-map render score so the
  # localization objective has a stronger path into the learned features.
  candidate_score_fusion_initial_weights:
    - 1.0
    - 1.0
    - 0.0
    - 0.05
    - 0.4
    - 0.0
    - -0.02
    - 0.02
    - 1.0
    - 1.5
    - 0.1
    - 0.0
  candidate_score_fusion_initial_bias: 0.0

training:
  seed: 190
  max_steps: 640
  lr: 3.0e-5
  model_lr_scales:
    candidate_score_fusion_head.: 1.0

map_supervision:
  candidate_render_score_weight: 0.20
  candidate_score_fusion_weight: 3.0
