    - "stage4."
    - "fine_fuse."
    - "fine_head."
    - "fine_loc_head."
    - "fine_loc_highres_fuse."
    - "fine_loc_scale"
    - "fine_loc_highres_scale"
  model_lr_scales:
    stage3.: 0.20
    stage4.: 0.40
    fine_fuse.: 0.80
    fine_head.: 0.80
    fine_loc_head.: 2.0
    fine_loc_highres_fuse.: 2.0

map_supervision:
  query_projected_fine_weight: 4.0
  query_fine_weight: 0.20
  query_fine_infonce_weight: 0.008
  query_fine_grad_weight: 0.010

  query_corr_ce_weight: 0.25
  query_corr_subpixel_weight: 0.25
  query_corr_flow_weight: 0.05
  query_corr_peak_margin_weight: 1.5
  query_corr_distill_weight: 0.8

  query_identity_corr_ce_weight: 0.6
  query_identity_corr_subpixel_weight: 0.8
  query_identity_corr_flow_weight: 0.0
  query_identity_corr_peak_margin_weight: 8.0
  query_identity_corr_distill_weight: 3.0
