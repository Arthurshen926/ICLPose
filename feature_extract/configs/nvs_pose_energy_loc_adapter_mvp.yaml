# NVS-supervised pose-conditioned feature adaptation MVP.
# Frozen base query/map features remain the anchor; query/render loc adapters and
# PoseEnergyNet learn pose-conditioned evidence from synthetic NVS + real mixed queries.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6a2_metric_align_candidate_poseaware_sharedproj_w005_quick_b4.yaml
exp_name: nvs_pose_energy_loc_adapter_mvp

training:
  batch_size: 6
  validation_batch_size: 6
  num_workers: 0
  amp: true

map_supervision:
  trainable: false
  train_geometry: false
  candidate_render_batch_size: 24
  candidate_render_score_projector_chunk_size: 64
  query_fine_key: fine
  local_corr_projector_enabled: false
  local_corr_projector_apply_to_query: false

pose_energy:
  train_projector: false
  require_projector: false
  pose_feature_adapter_enabled: true
  pose_feature_adapter_hidden_dim: 64
  pose_feature_adapter_residual_scale: 0.1
  pose_feature_adapter_zero_init: true
  pose_feature_adapter_l2_normalize: true
  pose_feature_adapter_uncertainty_enabled: true
  pose_feature_adapter_after_projector: false

  topk: 64
  lattice_trans_cm: [0, 2, 5, 10, 25, 50]
  lattice_rot_deg: [0, 0.5, 1, 2, 5, 10]
  lattice_direction_mode: cube
  combine_trans_rot: false
  candidate_bank_mode: balanced
  limit_strategy: uniform

  candidate_center_mode: noisy_init
  candidate_center_noise_mode: fixed
  candidate_center_trans_cm: 25.0
  candidate_center_rot_deg: 5.0

  target_temperature_m: 0.05
  rot_cost_weight: 0.1
  use_candidate_delta: true
  use_delta_vector: true
  use_uncertainty: true
  factorized_heads: true
  translation_energy_weight: 0.25
  rotation_energy_weight: 0.25
  joint_energy_weight: 0.25
  residual_weight: 0.5
  residual_trans_scale_m: 0.25
  residual_rot_scale_deg: 5.0
  improve_weight: 0.0

  anti_identity_weight: 0.5
  anti_identity_margin: 0.5
  anti_identity_min_gap_m: 0.03
  identity_index: 0
  pairwise_rank_weight: 0.0
  pairwise_rank_min_gap_m: 0.03
  pairwise_rank_logit_margin: 0.5
  render_score_ce_weight: 0.0
  render_score_pairwise_weight: 0.0
  render_score_temperature_m: 0.05
  render_score_pairwise_min_gap_m: 0.03
  render_score_pairwise_logit_margin: 0.5

  auc_good_m: 0.05
  auc_bad_m: 0.25
  synthetic_ratio: 0.5
  synthetic_trans_cm: 25.0
  synthetic_rot_deg: 5.0
