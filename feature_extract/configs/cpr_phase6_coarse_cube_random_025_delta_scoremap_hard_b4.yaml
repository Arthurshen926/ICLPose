# Scale-specific coarse scorer for 0.25m/5deg random-direction CPR.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_coarse_cube_random_025050_delta_scoremap_peak_hard_b1.yaml
exp_name: cpr_phase6_coarse_cube_random_025_delta_scoremap_hard_b4

dataset:
  max_train_samples: 64
  max_val_samples: 32

training:
  batch_size: 4
  max_steps: 80
