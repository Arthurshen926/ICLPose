# Vector-only fine selector config with richer candidate context.
# Used for cached topK training when K is large enough that local-corr-only
# statistics are underdetermined.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_fine_topk_selector_cached_vector_corronly_small.yaml
exp_name: cpr_phase6_fine_topk_selector_cached_vector_rich

model:
  warmstart_strict: false
  fine_candidate_selector_enabled: true
  fine_candidate_selector_use_score_map_head: false
  fine_candidate_selector_hidden_dim: 128
  fine_candidate_selector_zero_init: true

training:
  batch_size: 64
  lr: 0.001
  freeze_model_except_prefixes:
    - "fine_candidate_selector_head."

map_supervision:
  fine_topk_selector_topk: 64
  fine_topk_selector_use_coarse_logits: true
  fine_topk_selector_use_candidate_delta: true
  fine_topk_selector_use_depth: true
  fine_topk_selector_use_mask: true
  fine_topk_selector_target_mode: gt_pose_error_soft
  fine_topk_selector_target_temperature_m: 0.05
  fine_topk_selector_temperature: 0.25
  fine_topk_selector_pairwise_rank_weight: 0.1
  fine_topk_selector_pairwise_rank_min_gap_m: 0.03
  fine_topk_selector_pairwise_rank_temperature: 0.25
