# Phase 4 medium-basin probe with a larger uniform sample from the combined
# translation x rotation lattice. Geometry diagnostic gives full oracle coverage
# for this budget on the fixed-axis 25-50cm / 5-10deg protocol.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase4_v13_coarse_lattice_probe_medium_linear_fixedrot_b16.yaml
exp_name: cpr_clean_phase4_v13_coarse_lattice_probe_medium_combo_uniform96_b8

dataset:
  max_train_samples: 128
  max_val_samples: 64

training:
  batch_size: 8
  max_steps: 600

map_supervision:
  coarse_pose_lattice_trans_cm: [0.0, 25.0, 50.0]
  coarse_pose_lattice_rot_deg: [0.0, 5.0, 10.0]
  coarse_pose_lattice_combine_trans_rot: true
  coarse_pose_lattice_max_candidates: 96
  coarse_pose_lattice_limit_strategy: uniform
