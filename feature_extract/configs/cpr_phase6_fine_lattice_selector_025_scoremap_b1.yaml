# Train fine selector directly over the full scale-specific K=729 local lattice.
# This bypasses the weak coarse scorer for random continuous T0 diagnostics.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_fine_topk_selector_scoremap_corronly_small_hard_lr1e3_b6.yaml
exp_name: cpr_phase6_fine_lattice_selector_025_scoremap_b1

dataset:
  max_train_samples: 32
  max_val_samples: 16

training:
  batch_size: 1
  max_steps: 64
  log_every: 1
  lr: 0.001
  best_metric: map_fine_topk_selector_pred_trans_mm
  best_metric_mode: min

map_supervision:
  perturb_render_negatives: true
  perturb_pose_mode: se3_delta
  perturb_direction_mode: random
  perturb_trans_cm_choices: [25.0]
  perturb_rot_deg: 0.0
  perturb_rot_deg_choices: [5.0]

  candidate_render_pose_source: coarse_pose_lattice
  coarse_pose_lattice_base_source: rendered_map_pose_neg
  coarse_pose_lattice_direction_mode: cube
  coarse_pose_lattice_trans_cm: [0.0, 25.0]
  coarse_pose_lattice_rot_deg: [0.0, 5.0]
  coarse_pose_lattice_combine_trans_rot: true
  coarse_pose_lattice_max_candidates: 0
  coarse_pose_lattice_limit_strategy: head
  candidate_render_batch_size: 32

  candidate_score_fusion_weight: 0.0
  fine_topk_selector_topk: 729
  fine_topk_selector_use_candidate_delta: true
  fine_topk_selector_use_depth: false
  fine_topk_selector_use_mask: false
  fine_topk_selector_use_coarse_logits: false
