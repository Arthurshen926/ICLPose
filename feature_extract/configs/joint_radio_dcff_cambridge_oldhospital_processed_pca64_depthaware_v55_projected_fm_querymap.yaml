base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v50_varwls_inwindow_domainadapter_hardpatch.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v55_projected_fm_querymap

map_supervision:
  # Keep every localization loss in the same query-map localization space.
  feature_metric_use_projector: true
  map_self_corr_target_uses_query_projector: true

  # The v50 variance confidence was not calibrated at inference; train the
  # projection space toward sharper local peaks before relying on WLS weights.
  query_corr_wls_conf_mode: max
  query_corr_wls_conf_power: 0.5
  query_corr_peak_margin_weight: 0.25
  query_corr_peak_margin: 0.03
  feature_metric_pose_weight: 0.08
