# Phase 6 diagnostic: frozen map/coarse, but let query fine-side heads adapt for
# topK selection. This tests whether frozen query features are the selector bottleneck.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_fine_lattice_selector_025_k128_projector_peak_fullctx_hard_lr2e3_b2_fast.yaml
exp_name: cpr_phase6_fine_lattice_selector_025_k128_queryfine_fullctx_hard_lr5e4_b2_fast

training:
  lr: 0.0005
  max_steps: 96
  freeze_model_except_prefixes:
    - "fine_candidate_selector_head."
    - "local_corr_projector."
    - "fine_head."
    - "fine_fuse."
    - "window_attention."
    - "global_context."
  model_lr_scales:
    fine_candidate_selector_head.: 1.0
    local_corr_projector.: 0.2
    fine_head.: 0.2
    fine_fuse.: 0.1
    window_attention.: 0.05
    global_context.: 0.05

loss:
  fine_l1_weight: 0.0
  fine_cos_weight: 0.01
  coarse_l1_weight: 0.0
  coarse_cos_weight: 0.0
