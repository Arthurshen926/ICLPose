base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_locaware_flowhead_v53_corrproj_concat_mapselfsharp.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_locaware_flowhead_v59_query_to_pretrained_corrproj_concat

model:
  warmstart_strict: false
  warmstart_skip_prefixes: []

training:
  seed: 673
  batch_size: 1
  max_steps: 500
  lr: 0.00002
  freeze_model_except_prefixes:
    - "fine_loc_head."
    - "fine_loc_highres_fuse."
    - "fine_loc_scale"
    - "fine_loc_highres_scale"
  model_lr_scales:
    fine_loc_head.: 2.0
    fine_loc_highres_fuse.: 2.0

map_supervision:
  local_corr_projector_enabled: true
  query_corr_feature_preprocess: concat_highpass
  query_corr_highpass_kernel: 5
  query_corr_highpass_scale: 1.0
  query_identity_corr_feature_preprocess: concat_highpass
  query_identity_corr_highpass_kernel: 5
  query_identity_corr_highpass_scale: 1.0
  query_corr_radius: 6
  query_identity_corr_radius: 6

  query_fine_weight: 0.18
  query_fine_infonce_weight: 0.010
  query_fine_grad_weight: 0.010
  query_corr_ce_weight: 0.8
  query_corr_subpixel_weight: 0.8
  query_corr_flow_weight: 0.25
  query_corr_peak_margin_weight: 6.0
  query_corr_distill_weight: 2.5
  query_corr_distill_temperature: 0.04
  query_corr_distill_target_temperature: 0.025

  query_identity_corr_ce_weight: 0.20
  query_identity_corr_subpixel_weight: 0.25
  query_identity_corr_flow_weight: 0.0
  query_identity_corr_peak_margin_weight: 2.0
  query_identity_corr_distill_weight: 1.0

  map_self_corr_ce_weight: 0.0
  map_self_corr_subpixel_weight: 0.0
  map_self_corr_flow_weight: 0.0
  map_self_corr_peak_margin_weight: 0.0
