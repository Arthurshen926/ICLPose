base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v50_varwls_inwindow_domainadapter_hardpatch.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v57_stagea_projector_only

training:
  seed: 157
  max_steps: 256
  lr: 5.0e-5
  freeze_model_except_prefixes:
    - local_corr_projector.
  model_lr_scales:
    local_corr_projector.: 8.0
  save_every_epochs: 1
  val_every_epochs: 1

map_supervision:
  trainable: false
  train_fine_decoder: false
  train_feat_sharp: false
  train_fsm: false
  local_corr_projector_enabled: true
  local_corr_projector_apply_to_query: true
  teacher_corr_use_projector: true

  # Stage A gate: prove query-map local correspondence before pose claims.
  query_corr_ce_weight: 8.0
  query_corr_subpixel_weight: 4.0
  query_corr_flow_weight: 0.05
  query_corr_flow_cosine_weight: 0.2
  query_corr_peak_margin_weight: 20.0
  query_corr_peak_margin: 0.03
  query_corr_low_peak_gap_threshold: 0.02
  query_corr_wls_pose_weight: 0.0
  feature_metric_pose_weight: 0.0

  map_self_corr_ce_weight: 0.0
  map_self_corr_subpixel_weight: 0.0
  map_self_corr_flow_weight: 0.0
  map_self_corr_peak_margin_weight: 0.0
