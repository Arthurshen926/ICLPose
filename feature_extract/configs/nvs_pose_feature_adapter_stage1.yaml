# NVS-supervised pose-conditioned feature adaptation, Stage 1.
# The base query student and map field stay frozen.  Only query/render loc
# adapters are trained with dense GT-pose alignment, NVS geometric warp
# correspondence, and smooth pose ranking.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6a2_metric_align_candidate_poseaware_sharedproj_w005_quick_b4.yaml
exp_name: nvs_pose_feature_adapter_stage1

training:
  batch_size: 10
  validation_batch_size: 10
  num_workers: 0
  amp: false

map_supervision:
  trainable: false
  train_geometry: false
  candidate_render_batch_size: 32
  candidate_render_score_projector_chunk_size: 64
  query_fine_key: fine
  local_corr_projector_enabled: false
  local_corr_projector_apply_to_query: false

pose_energy:
  train_projector: false
  require_projector: false
  pose_feature_adapter_enabled: true
  pose_feature_adapter_hidden_dim: 96
  pose_feature_adapter_residual_scale: 0.2
  pose_feature_adapter_zero_init: true
  pose_feature_adapter_l2_normalize: true
  pose_feature_adapter_uncertainty_enabled: true

  topk: 64
  lattice_trans_cm: [0, 2, 5, 10, 25, 50]
  lattice_rot_deg: [0, 0.5, 1, 2, 5, 10]
  lattice_direction_mode: cube
  combine_trans_rot: false
  candidate_bank_mode: balanced
  limit_strategy: uniform
  candidate_center_mode: noisy_init
  candidate_center_noise_mode: fixed
  candidate_center_trans_cm: 10.0
  candidate_center_rot_deg: 2.0
  candidate_center_buckets: "10:2:0.5,25:5:0.5"
  include_identity_candidate: true
  train_append_gt_candidate: false
  eval_append_gt_candidate: false
  rot_cost_weight: 0.1
  score_radius: 3
  score_preprocess: spatial_center
  score_highpass_kernel: 5
  score_map_mode: peak_offset
  use_delta_vector: true
  use_center_delta_vector: true
  use_uncertainty: true
  factorized_heads: true
  translation_energy_weight: 0.25
  rotation_energy_weight: 0.25
  joint_energy_weight: 0.25
  confidence_weight: 0.1
  confidence_temperature_m: 0.10
  synthetic_ratio: 0.5
  synthetic_trans_cm: 50.0
  synthetic_rot_deg: 10.0
  auc_good_m: 0.05
  auc_bad_m: 0.25

nvs_pose_feature_adapter:
  best_metric: pose_energy_pred_cost_m
  best_metric_mode: min
  train_projector: false
  pose_feature_adapter_enabled: true
  pose_feature_adapter_hidden_dim: 96
  pose_feature_adapter_residual_scale: 0.2
  pose_feature_adapter_zero_init: true
  pose_feature_adapter_l2_normalize: true
  pose_feature_adapter_uncertainty_enabled: true
  candidate_bank_mode: balanced
  candidate_center_buckets: "10:2:0.5,25:5:0.5"
  align_weight: 2.0
  align_margin: 0.0
  warp_align_weight: 1.0
  warp_depth_tolerance_m: 0.08
  warp_depth_tolerance_rel: 0.08
  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  rank_temperature_m: 0.05
  rank_pairwise_min_gap_m: 0.03
  rank_pairwise_logit_margin: 0.1
  include_identity_candidate: true
  train_append_gt_candidate: false
  eval_append_gt_candidate: false
  drift_weight: 0.05
  variance_weight: 0.02
  variance_min_std: 0.03
  score_temperature: 0.1
  score_mode: local_zero_offset
  local_corr_radius: 3
  local_corr_temperature: 0.07
  local_zero_peak_gap_weight: 0.5
  local_zero_offset_weight: 0.05
  local_flow_nce_weight: 0.5
  pose_energy_enabled: true
  pose_energy_weight: 1.0
  pose_energy_factorized_heads: true
  pose_energy_translation_weight: 0.25
  pose_energy_rotation_weight: 0.25
  pose_energy_joint_weight: 0.25
  pose_energy_confidence_weight: 0.1
  pose_energy_confidence_temperature_m: 0.10
  pose_energy_use_delta_vector: true
  pose_energy_use_center_delta_vector: true
  pose_energy_use_uncertainty: true
  pose_energy_residual_weight: 0.5
  pose_energy_residual_target_mode: soft_topk
  pose_energy_improve_weight: 0.2
  pose_energy_monotonicity_weight: 0.0
  pose_energy_monotonicity_margin: 0.02
  pose_energy_anti_identity_weight: 0.5
  pose_energy_pairwise_rank_weight: 0.2
  pose_energy_direction_weight: 0.5
  pose_energy_direction_min_cos_gap: 0.25
  pose_energy_direction_logit_margin: 0.5
  pose_energy_select_for_metric: true
  synthetic_ratio: 0.5
  synthetic_trans_cm: 50.0
  synthetic_rot_deg: 10.0
