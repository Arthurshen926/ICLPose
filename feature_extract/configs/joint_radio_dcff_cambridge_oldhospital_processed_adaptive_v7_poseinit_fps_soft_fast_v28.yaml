base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_poseinit_fps_soft_v27.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_poseinit_fps_soft_fast_v28
output_dir: /root/ICLPose/result/feature_extract

dataset:
  input_hw: [544, 960]
  student_feature_hw: [136, 240]
  student_coarse_feature_hw: [34, 60]
  max_val_samples: 96

model:
  pose_init_head: true
  pose_init_mode: anchor
  pose_init_anchor_sampling: fps
  pose_init_num_anchors: 256
  pose_init_hypotheses: 24
  pose_init_residual_scale: 3.0
  pose_init_hidden_dim: 768

pose_init:
  enabled: true
  trans_weight: 8.0
  rot_weight: 1.5
  score_weight: 0.25
  uncertainty_weight: 0.02
  rot_cost_weight: 0.08
  anchor_weight: 4.0
  anchor_soft_sigma_m: 3.0
  anchor_soft_rot_sigma_deg: 35.0
  use_all_anchor_pose_loss: true

training:
  seed: 1009
  batch_size: 8
  num_workers: 0
  allow_highres_num_workers: false
  lr: 0.00006
  max_steps: 2500
  log_every: 10
  model_lr_scales:
    pose_init_head: 14.0
    stage3.: 0.08
    stage4.: 0.12
    fine_head.: 0.2
    coarse_head.: 0.2

loss:
  fine_l1_weight: 0.01
  fine_cos_weight: 0.02
  fine_grad_weight: 0.001
  fine_channel_std_weight: 0.002
  coarse_l1_weight: 0.005
  coarse_cos_weight: 0.01
  coarse_grad_weight: 0.0
  coarse_channel_std_weight: 0.001
  query_teacher_infonce_weight: 0.001

map_supervision:
  enabled: false
