exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_lowlevelskip_full1ep
output_dir: /root/ICLPose/result/feature_extract

dataset:
  source_dir: /hy-tmp/Cambridge_stdloc/OldHospital/processed
  colmap_dir: /hy-tmp/Cambridge_stdloc/OldHospital/sparse/0
  feature_id_space: da3
  feature_dir: /root/ICLPose/result/feature_extract/features_radio_adaptive_v7/cambridge_oldhospital_processed
  train_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_train.txt
  val_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_test.txt
  image_patterns:
    - seq*/*.png
    - seq*/*.jpg
    - images/*.png
    - images/*.jpg
    - "*.png"
    - "*.jpg"
  patch_size: 16
  input_hw: [1088, 1920]
  feature_hw: [68, 120]
  coarse_feature_hw: [34, 60]
  cache_teacher: false
  fallback_val_ratio: 0.1
  max_train_samples: null
  max_val_samples: 182
  synthetic_if_missing: false
  prior_mask_path: /hy-tmp/Cambridge_stdloc/OldHospital/processed/masks.pkl
  prior_mask_channels: [0, 1, 2]

model:
  feature_dim: 96
  fine_feature_dim: 96
  coarse_feature_dim: 32
  base_channels: 48
  stage_dims: [48, 96, 144, 192]
  dropout: 0.0
  l2_normalize: true
  predict_magnitude: false
  fine_low_level_skip: true
  fine_low_level_init: 0.05
  warmstart_strict: false

training:
  device: cuda
  seed: 65
  epochs: 1
  batch_size: 12
  num_workers: 0
  lr: 0.00004
  weight_decay: 0.00001
  grad_clip: 1.0
  amp: true
  log_every: 10
  save_every_epochs: 1
  val_every_epochs: 1
  max_steps: 90

loss:
  fine_l1_weight: 0.15
  fine_cos_weight: 0.25
  fine_channel_std_weight: 0.05
  fine_grad_weight: 0.00
  coarse_l1_weight: 0.08
  coarse_cos_weight: 0.15
  coarse_channel_std_weight: 0.02
  coarse_grad_weight: 0.00
  fine_coarse_ortho_weight: 0.0
  teacher_norm_weight: 0.0
  query_teacher_infonce_weight: 0.02
  infonce_temperature: 0.07
  infonce_samples: 512
  infonce_cross_batch: true

retrieval:
  enabled: false

map_supervision:
  enabled: true
  config_path: feature_field/configs/reconstruction_cambridge_oldhospital_processed_adaptive_v7.yaml
  colmap_dir: /hy-tmp/Cambridge_stdloc/OldHospital/sparse/0
  cache_rendered: true
  trainable: false
  train_fine_decoder: false
  train_coarse_fusion: false
  train_feat_sharp: false
  train_hash_mlp: false
  train_latent: false
  train_geometry: false
  detach_query_features: false
  alpha_threshold: 0.5
  coarse_start_epoch: 0
  query_fine_weight: 0.30
  query_fine_raw_weight: 0.05
  query_coarse_weight: 0.15
  query_fine_infonce_weight: 0.40
  query_coarse_infonce_weight: 0.20
  query_fine_grad_weight: 0.00
  query_coarse_grad_weight: 0.00
  rendered_teacher_fine_weight: 0.0
  rendered_teacher_fine_raw_weight: 0.0
  rendered_teacher_coarse_weight: 0.0
  rendered_teacher_fine_infonce_weight: 0.0
  rendered_teacher_coarse_infonce_weight: 0.0
  infonce_temperature: 0.07
  infonce_samples: 768
  infonce_cross_batch: true
  variance_target_std: 0.05
  query_variance_weight: 0.02
  map_variance_weight: 0.0
  query_covariance_weight: 0.005
  map_covariance_weight: 0.0
  perturb_rank_weight: 0.02
  perturb_render_negatives: true
  perturb_rot_deg: 1.0
  perturb_trans_m: 0.05

visualization:
  num_val_vis: 4
  save_root: /root/ICLPose/result/feature_extract/visualizations/feature_track
