# CPR baseline v15: Gradient direction aware training
# Strategy: feature_metric_gradient_direction_weight directly trains
# J^T r to point toward GT, avoiding the noisy matrix inverse in single-step
# GN training. Separates rotation/translation cosine for balanced signal.
# Key changes from V14:
#   - feature_metric_pose_weight: 0.15 → 0.0 (REMOVED)
#   - NEW: feature_metric_gradient_direction_weight: 0.5
#   - Separates rot/trans in cosine for balanced optimization
#   - Lower perturbation range (focus on nearby poses where gradient matters)
# Rationale: V14 showed single-step GN gradient is too noisy (fm_gain ≈ -2mm avg).
#   Directly optimizing J^T r direction is a necessary condition for FM-GN
#   success without the noisy matrix inverse.

base_config: null
exp_name: cpr_baseline_v15
output_dir: /root/ICLPose/result/feature_extract

model:
  feature_dim: 64
  fine_feature_dim: 64
  coarse_feature_dim: 64
  base_channels: 32
  stage_dims: [32, 64, 96, 128]
  dropout: 0.0
  l2_normalize: true

  global_context_enabled: true
  global_context_zero_init: true
  window_attention_layers: 2
  window_attention_heads: 8
  window_attention_size: 16
  window_attention_mlp_ratio: 2.0
  window_attention_shift: true
  window_attention_zero_init: true

  local_matcher_enabled: true
  local_matcher_radius: 4
  local_matcher_hidden_dim: 64
  local_matcher_zero_init: true
  local_matcher_residual_scale: 1.0
  local_matcher_context_mode: basic

  local_corr_projector_enabled: true
  local_corr_projector_hidden_dim: 128
  local_corr_projector_output_dim: 64
  local_corr_projector_zero_init: false
  local_corr_projector_l2_normalize: true

  warmstart_strict: false

dataset:
  source_dir: /hy-tmp/Cambridge_stdloc/OldHospital/processed
  colmap_dir: /hy-tmp/Cambridge_stdloc/OldHospital/sparse/0
  feature_dir: /root/ICLPose/result/feature_extract/features_radio_dual_v68_align_stop640/cambridge_oldhospital_processed
  train_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_train.txt
  val_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_test.txt
  feature_id_space: colmap
  image_patterns:
    - seq*/*.png
  input_hw: [1088, 1920]
  student_feature_hw: [68, 120]
  student_coarse_feature_hw: [17, 30]
  feature_hw: [272, 480]
  coarse_feature_hw: [68, 120]
  noise_buckets:
    - [0.1, 2.0]
    - [0.25, 5.0]
    - [0.5, 10.0]
    - [1.0, 20.0]
    - [2.0, 30.0]

training:
  seed: 973
  lr: 0.000075
  batch_size: 2
  max_steps: 12000
  log_every: 10
  epochs: 60
  model_lr_scales:
    fine_head.: 1.0
    coarse_head.: 0.5
    stem.: 0.2
    stage1.: 0.2
    stage2.: 0.3
    stage3.: 0.5
    stage4.: 0.5
    global_context.: 0.3
    local_matcher.: 0.5
    local_corr_projector.: 0.5

loss:
  fine_l1_weight: 0.03
  fine_cos_weight: 0.03
  coarse_l1_weight: 0.02
  coarse_cos_weight: 0.02

map_supervision:
  enabled: true
  config_path: /root/ICLPose/feature_field/configs/reconstruction_cambridge_oldhospital_processed_cached64_v11_residual_spatial.yaml

  query_fine_key: fine
  query_local_fine_key: fine
  query_fine_weight: 2.0
  query_coarse_weight: 1.0
  query_fine_infonce_weight: 0.0

  coarse_feature_metric_energy_weight: 0.0
  coarse_feature_metric_energy_radius: 8

  query_corr_radius: 4
  query_corr_ce_weight: 0.0
  query_corr_subpixel_weight: 0.0
  query_corr_peak_margin_weight: 0.0
  query_corr_ce_temperature: 0.050
  query_corr_wls_pose_weight: 0.0
  perturb_render_negatives: true
  perturb_trans_cm_choices: [2.0, 5.0, 10.0, 20.0]
  perturb_rot_deg: 0.5

  # V14 approach DISABLED — too noisy
  feature_metric_pose_weight: 0.0
  feature_metric_pose_damping: 0.1
  feature_metric_pose_update_scale: 0.5
  feature_metric_pose_rot_weight: 0.5
  feature_metric_pose_trans_weight: 30.0
  feature_metric_pose_normalize: true
  feature_metric_pose_rot_damping_multiplier: 5.0

  # V15: Gradient direction loss — directly train J^T r to point toward GT
  feature_metric_gradient_direction_weight: 0.5
  feature_metric_gradient_direction_rot_weight: 1.0
  feature_metric_gradient_direction_trans_weight: 2.0

  rendered_teacher_fine_weight: 0.0
  rendered_teacher_fine_weight_end: 0.0
  rendered_teacher_fine_weight_anneal_epochs: 0

  candidate_render_score_weight: 0.0
  candidate_score_fusion_weight: 0.0
  candidate_refined_pose_weight: 0.0
  candidate_two_stage_enabled: false
  coarse_pose_energy_weight: 0.0

export:
  fine_key: fine
