base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v85_batchcandidate_linear_fusion_init_top16_from_v74.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v89_batchcandidate_linear_fusion_end2end_top16_from_v74

# This run still warmstarts from v74, but it stops using the exported v68
# feature cache as a direct reconstruction target. The query and map features
# are trained by the current query-map/candidate objectives instead.
loss:
  fine_l1_weight: 0.0
  fine_cos_weight: 0.0
  fine_grad_weight: 0.0
  coarse_l1_weight: 0.0
  coarse_cos_weight: 0.0
  coarse_grad_weight: 0.0
  query_teacher_infonce_weight: 0.0

training:
  seed: 189
  max_steps: 640
  lr: 3.0e-5
  freeze_model_except_prefixes: null
  model_lr_scales:
    candidate_score_fusion_head.: 1.0

map_supervision:
  rendered_teacher_fine_weight: 0.0
  rendered_teacher_coarse_weight: 0.0
  rendered_teacher_fine_infonce_weight: 0.0
  rendered_teacher_coarse_infonce_weight: 0.0

  # Let the candidate-ranking objective update map-side features too.
  candidate_render_score_train_map: true
  candidate_render_score_weight: 0.05
  candidate_score_fusion_weight: 2.0
  candidate_score_fusion_target_mode: hard
