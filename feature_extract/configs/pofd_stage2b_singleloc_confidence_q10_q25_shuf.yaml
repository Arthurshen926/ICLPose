# POFD Stage 2b companion: single localization feature + learned confidence on
# q10/q25 shuffled local basins.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage2_poseobs_q10_q25_shuf.yaml
exp_name: pofd_stage2b_singleloc_confidence_q10_q25_shuf

training:
  batch_size: 12
  validation_batch_size: 12
  max_steps: 80
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: pred_cost_m
  best_metric_mode: min
  resume_adapter_strict: false

  pose_feature_adapter_uncertainty_enabled: true
  score_use_uncertainty: true

  align_weight: 1.0
  warp_align_weight: 0.5
  drift_weight: 0.05
  variance_weight: 0.02

  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  score_correction_cosine_weight: 0.5
  score_pose_improvement_weight: 0.5
  score_anti_identity_weight: 0.5

  observability_contrast_weight: 0.5
  observability_contrast_margin: 0.05
  observability_negative_min_cost_m: 0.08
  observability_contrast_score_source: selection_score

  pose_energy_enabled: false
  train_pose_energy_net: false
  train_pair_matcher: true
  train_pose_feature_adapter: true
