base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v74_implicit_joint_pose_energy_from_v68.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v76_refreshbank_poseinit_coarse_from_v74

model:
  warmstart_strict: false
  warmstart_skip_prefixes:
    - fine_loc_head.
    - fine_loc_highres_fuse.
    - fine_loc_scale
    - fine_loc_highres_scale
    - local_flow_head.
    - pose_init_head.
  pose_init_head: true
  pose_init_mode: feature_bank
  pose_init_feature_bank_source: map
  pose_init_feature_bank_refresh_on_start: true
  pose_init_feature_bank_refresh_epochs: 1
  pose_init_feature_source: coarse
  pose_init_feature_bank_projector: identity
  pose_init_anchor_sampling: train_all
  pose_init_num_anchors: 2048
  pose_init_hypotheses: 50
  pose_init_hidden_dim: 256
  pose_init_temperature: 0.05
  pose_init_residual_scale: 0.0

pose_init:
  enabled: true
  trans_weight: 0.0
  rot_weight: 0.0
  score_weight: 0.0
  uncertainty_weight: 0.0
  rot_cost_weight: 0.08
  anchor_weight: 20.0
  anchor_soft_sigma_m: 1.0
  anchor_soft_rot_sigma_deg: 15.0
  use_all_anchor_pose_loss: false

training:
  seed: 176
  max_steps: 640
  lr: 3.0e-5
  model_lr_scales:
    pose_init_head.: 8.0
    global_context.: 0.25
    window_attention.: 0.25
    query_channel_gate.: 1.0
    local_corr_projector.: 8.0
    stage3.: 0.03
    stage4.: 0.08
    fine_head.: 0.35
    coarse_head.: 0.35
    coarse_refine.: 0.25

map_supervision:
  coarse_pose_energy_weight: 0.5
  coarse_pose_rank_weight: 0.25
  query_coarse_weight: 0.10
  query_coarse_infonce_weight: 0.01
