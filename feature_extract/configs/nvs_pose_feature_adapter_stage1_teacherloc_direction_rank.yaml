# Stage 1B: localization-feature training with matching-teacher anchors and
# hard-direction candidate ranking.  This keeps PoseEnergy disabled: the scalar
# score still comes from adapted localization features, so success/failure
# directly tests whether Q_loc/M_loc became pose-sortable.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_teacherloc_adapteronly.yaml
exp_name: nvs_pose_feature_adapter_stage1_teacherloc_direction_rank

training:
  batch_size: 22
  validation_batch_size: 22
  max_steps: 120
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: selected_correction_cos
  best_metric_mode: max

  pair_matcher_enabled: false
  pair_matcher_weight: 0.0
  pose_energy_enabled: false
  pose_energy_weight: 0.0

  candidate_bank_mode: adaptive_direction_balanced
  direction_fractions: "0.75,0.5,0.25"
  topk: 8
  include_identity_candidate: true
  train_append_gt_candidate: false
  eval_append_gt_candidate: false

  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  rank_temperature_m: 0.05
  rank_pairwise_min_gap_m: 0.03
  rank_pairwise_logit_margin: 0.1
  score_correction_cosine_weight: 0.5
  score_correction_cosine_temperature: 0.10
  score_correction_cosine_min_cos: 0.0
  score_pose_improvement_weight: 0.5
  score_pose_improvement_temperature_m: 0.05
  score_pose_improvement_min_improvement_m: 0.01
  score_anti_identity_weight: 0.5
  score_anti_identity_min_gap_m: 0.03
  score_anti_identity_logit_margin: 0.5

  teacher_corr_weight: 1.0
  teacher_corr_local_patch_weight: 3.0
  align_weight: 0.2
  drift_weight: 0.005
  variance_weight: 0.02
