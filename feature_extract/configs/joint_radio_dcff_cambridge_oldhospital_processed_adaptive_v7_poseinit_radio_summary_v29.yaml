base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_poseinit_fps_soft_fast_v28.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_poseinit_radio_summary_v29
output_dir: /root/ICLPose/result/feature_extract

model:
  pose_init_head: true
  pose_init_mode: anchor
  pose_init_token_source: retrieval
  pose_init_anchor_sampling: fps
  pose_init_num_anchors: 256
  pose_init_hypotheses: 24
  pose_init_residual_scale: 3.0
  pose_init_hidden_dim: 768
  warmstart_strict: false
  warmstart_skip_prefixes:
    - "pose_init_head."
    - "retrieval_head."
    - "local_matcher."
    - "local_flow_head."
    - "local_corr_projector."

retrieval:
  enabled: true
  feature_dir: /root/ICLPose/result/feature_extract/features_radio_dual/cambridge_oldhospital_processed
  teacher_subdir: summary
  student_dim: 2560
  hidden_dim: 768
  dropout: 0.05
  l2_normalize: true
  cache_teacher: false
  l1_weight: 0.02
  cos_weight: 0.20
  infonce_weight: 0.20
  similarity_weight: 0.05
  temperature: 0.07

pose_init:
  enabled: true
  trans_weight: 8.0
  rot_weight: 1.5
  score_weight: 0.35
  uncertainty_weight: 0.02
  rot_cost_weight: 0.08
  anchor_weight: 6.0
  anchor_soft_sigma_m: 3.0
  anchor_soft_rot_sigma_deg: 35.0
  use_all_anchor_pose_loss: true

training:
  seed: 1013
  batch_size: 8
  num_workers: 0
  lr: 0.00006
  max_steps: 2500
  log_every: 10
  model_lr_scales:
    retrieval_head.: 8.0
    pose_init_head: 14.0
    stage3.: 0.06
    stage4.: 0.10
    fine_head.: 0.15
    coarse_head.: 0.15
