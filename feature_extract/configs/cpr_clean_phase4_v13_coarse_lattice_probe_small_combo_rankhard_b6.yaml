# Clean Phase 4 small-basin probe with a combined trans+rot K169 lattice.
# The scorer is trained for top1 argmin ranking rather than top4 basin coverage.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase4_v13_coarse_lattice_probe_small_linear_fixedrot_b16.yaml
exp_name: cpr_clean_phase4_v13_coarse_lattice_probe_small_combo_rankhard_b6

dataset:
  max_train_samples: 96
  max_val_samples: 48

training:
  batch_size: 6
  max_steps: 240
  log_every: 2
  best_metric: map_candidate_score_fusion_acc
  best_metric_mode: max

map_supervision:
  coarse_pose_lattice_trans_cm: [0.0, 10.0, 25.0]
  coarse_pose_lattice_rot_deg: [0.0, 2.0, 5.0]
  coarse_pose_lattice_combine_trans_rot: true
  coarse_pose_lattice_max_candidates: 0
  coarse_pose_lattice_limit_strategy: head
  candidate_score_fusion_temperature: 0.2
  candidate_score_fusion_target_mode: gt_pose_error_hard
  candidate_score_fusion_target_temperature_m: 0.05
  candidate_score_fusion_cost_regression_weight: 0.25
  candidate_score_fusion_cost_regression_temperature_m: 0.05
  candidate_score_fusion_pairwise_rank_weight: 0.25
  candidate_score_fusion_pairwise_rank_min_gap_m: 0.05
  candidate_score_fusion_pairwise_rank_temperature: 0.25
