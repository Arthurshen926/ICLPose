# Mainline reset after ChatGPT-特征训练与可微检索 (3).md.
#
# RADIO/DCFF are no longer treated as the final localization feature.  They are
# frozen context anchors.  The trainable final representation is a
# matching/localization-oriented RGB+base head supervised by LoFTR/render-PnP
# correspondences and hard-direction candidate ranking.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_teacherloc_pairscore.yaml
exp_name: nvs_pose_feature_adapter_stage1_matchingloc_main

training:
  batch_size: 16
  validation_batch_size: 16
  max_steps: 1200
  eval_every: 50

nvs_pose_feature_adapter:
  best_metric: selected_correction_cos
  best_metric_mode: max

  # Final loc feature is not raw RADIO/DCFF cosine.  The base feature is only
  # a context anchor; RGB/matching branch can dominate.
  pose_feature_adapter_texture_branch_enabled: true
  pose_feature_adapter_texture_branch_hidden_dim: 96
  pose_feature_adapter_texture_branch_scale: 1.0
  pose_feature_adapter_texture_branch_zero_init: false
  pose_feature_adapter_texture_fusion_mode: replace
  pose_feature_adapter_base_anchor_weight: 0.25
  pose_feature_adapter_residual_scale: 0.2
  pose_feature_adapter_rgb_context_enabled: true
  pose_feature_adapter_rgb_context_channels: 16

  pair_matcher_enabled: true
  pair_matcher_weight: 2.0
  pair_matcher_hidden_dim: 128
  pair_matcher_radius: 3
  pair_matcher_temperature: 0.04
  pair_matcher_min_confidence: 0.3
  pair_matcher_min_points: 8
  pair_matcher_positive_weight: 0.5
  pair_matcher_margin_weight: 0.5
  pair_matcher_margin: 0.05
  pair_matcher_base_dot_weight: 1.0
  pair_matcher_zero_init_residual: true
  pair_matcher_score_stride: 8
  pair_matcher_score_chunk_points: 32768
  pair_matcher_candidate_score_mode: center_logprob_margin

  score_mode: pair_matcher_local

  # Stage-1 hard-direction curriculum.  PoseEnergy and map fine-tune stay off.
  pose_energy_enabled: false
  pose_energy_weight: 0.0
  candidate_bank_mode: adaptive_direction_balanced
  direction_fractions: "0.75,0.5,0.25"
  topk: 8
  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  score_correction_cosine_weight: 1.0
  score_correction_cosine_temperature: 0.08
  score_pose_improvement_weight: 0.5
  score_pose_improvement_temperature_m: 0.05
  score_anti_identity_weight: 0.5

  # Teacher distillation remains the feature health signal.
  teacher_corr_weight: 1.0
  teacher_corr_local_patch_weight: 2.0
  align_weight: 0.1
  drift_weight: 0.01
  variance_weight: 0.02

  # Stage-1 go/no-go target for independent 25cm/5deg K candidates:
  # Spearman >= 0.30, AUC >= 0.75, selected_correction_cos >= 0.50,
  # selected_trans <= 150mm.  Do not promote PoseEnergy/map adaptation before
  # this passes.
