# Stage 1: prove localization feature pose-sortability before map fine-tuning.
#
# RADIO/DCFF stay frozen base/context features.  The trainable localization
# feature is shaped by GT pose/correction ranking first; render-LoFTR/PnP
# teacher quality is delayed so it acts as reliability evidence rather than
# dominating the target from step 0.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_matchingloc_teacherquality_local_noexact.yaml
exp_name: nvs_pose_feature_adapter_stage1_locfeature_bucketmix

dataset:
  pose_candidate_topk: 16
  pose_candidate_cache_keep_variants: true
  train_pose_candidate_cache_sampling: random
  val_pose_candidate_cache_sampling: first
  train_pose_candidate_caches:
    - /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_local_lattice_renderloftr_q10cm2deg_top16_noexact_train64.npz
    - /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_local_lattice_renderloftr_q25cm5deg_top16_noexact_train64.npz
  val_pose_candidate_caches:
    - /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_local_lattice_renderloftr_q10cm2deg_top16_noexact_val32.npz
    - /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_local_lattice_renderloftr_q25cm5deg_top16_noexact_val32.npz

training:
  batch_size: 12
  validation_batch_size: 12
  max_steps: 160
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: selected_correction_cos
  best_metric_mode: max

  pose_energy_enabled: false
  pose_energy_weight: 0.0

  candidate_teacher_quality_weight: 1.0
  candidate_teacher_quality_start_step: 40
  candidate_teacher_quality_warmup_steps: 40
  candidate_teacher_quality_target_mode: pnp_composite
  candidate_teacher_quality_temperature: 0.5
  candidate_teacher_quality_pairwise_weight: 0.25
  candidate_teacher_quality_pairwise_min_gap: 0.25

  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.75
  score_correction_cosine_weight: 1.25
  score_pose_improvement_weight: 1.0
  score_anti_identity_weight: 1.0

