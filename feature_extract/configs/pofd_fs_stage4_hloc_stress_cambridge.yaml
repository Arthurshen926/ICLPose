experiment: pofd_fs_stage4_hloc_stress_cambridge

claim_scope:
  main_claim: hypothesis_ranking_and_failure_prediction
  not_claiming_sota_cpr: true

stress_tests:
  init_sources:
    - hloc
    - netvlad
    - loftr_external_baseline
  metrics:
    - topk_basin_recall
    - hard_negative_false_accept
    - risk_coverage_auc
    - catastrophic_rate

constraints:
  external_correspondence_is_not_main_method: true
  no_external_score_labels_for_training: true
