# CPR ablation: Phase 2 query-side alignment without window attention.

base_config: /root/ICLPose/feature_extract/configs/cpr_main_phase2_query_align_frozenmap.yaml
exp_name: cpr_ablation_phase2_no_window_attention

model:
  window_attention_layers: 0
  window_attention_zero_init: true

training:
  best_metric: map_query_corr_subpx_flow_epe
  best_metric_mode: min
  freeze_model_except_prefixes:
    - "global_context."
    - "local_matcher."
    - "local_corr_projector."
    - "stage4."
    - "fine_head."
    - "coarse_head."
  model_lr_scales:
    global_context.: 0.25
    local_matcher.: 1.0
    local_corr_projector.: 2.0
    stage4.: 0.05
    fine_head.: 0.5
    coarse_head.: 0.5
