# Cached score-map fine selector for large topK reranking.
# Requires caches exported with --include-score-maps.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_fine_topk_selector_cached_vector_rich.yaml
exp_name: cpr_phase6_fine_topk_selector_cached_scoremap_rich

model:
  warmstart_strict: false
  fine_candidate_selector_enabled: true
  fine_candidate_selector_use_score_map_head: true
  fine_candidate_selector_score_map_channels: 3
  fine_candidate_selector_map_channels: 8
  fine_candidate_selector_grid_size: 4
  fine_candidate_selector_hidden_dim: 64
  fine_candidate_selector_context_layers: 1
  fine_candidate_selector_context_heads: 1
  fine_candidate_selector_context_residual: true
  fine_candidate_selector_zero_init: true

training:
  batch_size: 4
  lr: 0.0005
  freeze_model_except_prefixes:
    - "fine_candidate_selector_head."

map_supervision:
  fine_topk_selector_topk: 64
  fine_topk_selector_score_map_mode: peak_offset
  fine_topk_selector_temperature: 0.25
  fine_topk_selector_target_mode: gt_pose_error_soft
  fine_topk_selector_target_temperature_m: 0.05
  fine_topk_selector_pairwise_rank_weight: 0.1
  fine_topk_selector_pairwise_rank_min_gap_m: 0.03
  fine_topk_selector_pairwise_rank_temperature: 0.25
