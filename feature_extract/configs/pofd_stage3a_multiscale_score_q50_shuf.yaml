# POFD Stage 3a: keep the single localization feature, but score q50
# candidates on a lower-resolution, larger-radius pair-matcher surface.
#
# Stage3a audit showed q50 was partly search-window limited:
#   68x120/r3 adapter score  ~= 0.285m, top1 0.542, spearman 0.103
#   34x60/r12 adapter score  ~= 0.171m, top1 0.875, spearman 0.506
# This config makes that scoring protocol part of the main NVS/POFD path.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage2d_nvs_quality_pose_margin_q50_shuf.yaml
exp_name: pofd_stage3a_multiscale_score_q50_shuf

training:
  batch_size: 8
  validation_batch_size: 8
  max_steps: 80
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: pred_cost_m
  best_metric_mode: min

  score_mode: pair_matcher_local
  score_feature_hw: [34, 60]
  pair_matcher_radius: 12
  pair_matcher_score_stride: 4
  pair_matcher_score_chunk_points: 1024
  pair_matcher_score_candidate_chunk_size: 4
  # The q50 scorer uses radius12, but dense teacher pair-match at radius12 is
  # too memory-heavy. Candidate rank/quality losses still backprop through the
  # pair matcher score surface.
  pair_matcher_weight: 0.0

  candidate_teacher_quality_weight: 1.0
  candidate_observability_weight: 0.5
  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5

  pose_energy_enabled: false
  train_pose_energy_net: false
  train_pair_matcher: true
  train_pose_feature_adapter: true
