# 10cm/2deg local CPR teacher-quality evaluation/training with GT-render
# correspondence supervision.  This config keeps pair_matcher enabled for
# bucket-specific eval, so paircorr checkpoints are not accidentally evaluated
# with the plain local-correlation scorer.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_matchingloc_teacherquality_local_10cm_noexact.yaml
exp_name: nvs_pose_feature_adapter_stage1_matchingloc_teacherquality_q10_paircorr

dataset:
  pose_candidate_topk: 16
  train_pose_candidate_cache: /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_local_lattice_renderloftr_q10cm2deg_top16_noexact_train256.npz
  val_pose_candidate_cache: /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_local_lattice_renderloftr_q10cm2deg_top16_noexact_val128.npz
  teacher_correspondence_train_path: /root/ICLPose/result/result/feature_extract/teacher_corr/oldhospital_train_gt_render_loftr_128_20260515
  teacher_correspondence_val_path: /root/ICLPose/result/result/feature_extract/teacher_corr/oldhospital_test_gt_render_loftr_32_20260515
  teacher_correspondence_max_points: 512
  teacher_correspondence_coordinate_space: image

training:
  batch_size: 6
  validation_batch_size: 6
  pin_memory: false
  max_steps: 60
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: selected_correction_cos
  best_metric_mode: max

  pair_matcher_enabled: true
  pair_matcher_weight: 1.0
  pair_matcher_hidden_dim: 128
  pair_matcher_radius: 3
  pair_matcher_temperature: 0.04
  pair_matcher_min_confidence: 0.3
  pair_matcher_min_points: 16
  pair_matcher_positive_weight: 0.5
  pair_matcher_margin_weight: 0.5
  pair_matcher_margin: 0.05
  pair_matcher_base_dot_weight: 1.0
  pair_matcher_zero_init_residual: true
  pair_matcher_score_stride: 8
  pair_matcher_score_chunk_points: 32768
  score_mode: pair_matcher_local

  teacher_corr_weight: 0.5
  teacher_corr_local_patch_weight: 1.0
  teacher_corr_min_confidence: 0.3
  teacher_corr_min_points: 16
  teacher_corr_local_patch_min_points: 16
