  # [render_score, render_score_centered, render_valid_fraction,
  #  retrieval_score_log_z, retrieval_original_score, pnp_success,
  #  pnp_num_inliers_log_z, pnp_num_matches_log_z,
  #  pnp_reproj_rmse_quality, pnp_reproj_median_quality,
  #  pnp_inlier_ratio, pnp_inlier_conf_mean]
  candidate_score_fusion_initial_weights:
    - 0.25
    - 0.25
    - 0.0
    - 0.05
    - 1.0
    - 0.0
    - -0.05
    - 0.05
    - 2.0
    - 3.0
    - 0.2
    - 0.0
  candidate_score_fusion_initial_bias: 0.0

training:
  seed: 185
  model_lr_scales:
    candidate_score_fusion_head.: 1.0

map_supervision:
