# Stage-1 local CPR lattice teacher-quality training.
#
# This is the architecture-correct variant after the expert reset:
# RADIO/DCFF remain frozen base/context anchors, while the trainable localization
# feature is supervised by render-LoFTR/PnP quality on local T0-centered CPR
# candidates plus GT pose/correction-direction ranking.  The cache deliberately
# excludes the exact inverse candidate to avoid fixed-lattice 0mm artifacts.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_matchingloc_teacherquality_cache.yaml
exp_name: nvs_pose_feature_adapter_stage1_matchingloc_teacherquality_local_noexact

dataset:
  pose_candidate_topk: 16
  train_pose_candidate_cache: /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_local_lattice_renderloftr_q25cm5deg_top16_noexact_train64.npz
  val_pose_candidate_cache: /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_local_lattice_renderloftr_q25cm5deg_top16_noexact_val32.npz

training:
  batch_size: 10
  validation_batch_size: 10
  max_steps: 120
  eval_every: 20

nvs_pose_feature_adapter:
  candidate_bank_mode: cache
  candidate_center_mode: batch
  topk: 16

  # Candidate-quality cache is now local-lattice teacher evidence, not global
  # retrieval evidence.  Pair/corr teacher losses are kept off for this first
  # check so the candidate teacher and GT pose/correction objectives dominate.
  teacher_corr_weight: 0.0
  teacher_corr_local_patch_weight: 0.0
  pair_matcher_weight: 0.0

  candidate_teacher_quality_weight: 1.0
  candidate_teacher_quality_target_mode: pnp_composite
  candidate_teacher_quality_temperature: 0.5
  candidate_teacher_quality_pairwise_weight: 0.25
  candidate_teacher_quality_pairwise_min_gap: 0.25

  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  score_correction_cosine_weight: 1.0
  score_pose_improvement_weight: 1.0
  score_anti_identity_weight: 1.0

  best_metric: selected_correction_cos
  best_metric_mode: max
