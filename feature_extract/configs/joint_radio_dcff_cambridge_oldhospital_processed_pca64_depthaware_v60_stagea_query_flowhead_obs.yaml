base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v59_stagea_flowhead_obs.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v60_stagea_query_flowhead_obs

training:
  seed: 160
  max_steps: 384
  lr: 5.0e-5
  freeze_model_except_prefixes:
    - local_flow_head.
    - local_corr_projector.
    - fine_loc_head.
    - fine_loc_highres_fuse.
  model_lr_scales:
    local_flow_head.: 2.0
    local_corr_projector.: 6.0
    fine_loc_head.: 3.0
    fine_loc_highres_fuse.: 3.0

map_supervision:
  # Keep RADIO anchors active while localization loss selects the loc subspace.
  query_fine_weight: 0.05
  query_fine_infonce_weight: 0.015
  rendered_teacher_fine_weight: 0.04
  rendered_teacher_fine_infonce_weight: 0.01
  query_variance_weight: 0.02
  query_covariance_weight: 0.006
