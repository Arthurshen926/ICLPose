# Expert-response reset, Stage-1 teacher-quality cache variant.
#
# Purpose:
#   RADIO/DCFF stay as frozen base/context anchors.  The final localization
#   feature is trained with pair-conditioned matching plus offline render-LoFTR
#   / PnP candidate quality, so candidate scores learn "matchable and
#   geometrically consistent" rather than raw feature cosine.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_matchingloc_main.yaml
exp_name: nvs_pose_feature_adapter_stage1_matchingloc_teacherquality_cache

dataset:
  pose_candidate_topk: 16
  train_pose_candidate_caches:
    - /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_netvlad_renderloftr_top50_quality_fields_train_excl_shard000_448.npz
    - /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_netvlad_renderloftr_top50_quality_fields_train_excl_shard448_895.npz
  val_pose_candidate_cache: /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_netvlad_renderloftr_top50_quality_fields_test.npz

training:
  batch_size: 10
  validation_batch_size: 10
  max_steps: 800
  eval_every: 40

nvs_pose_feature_adapter:
  candidate_bank_mode: cache
  candidate_center_mode: batch
  topk: 16

  candidate_teacher_quality_weight: 1.5
  candidate_teacher_quality_target_mode: pnp_composite
  candidate_teacher_quality_temperature: 0.5
  candidate_teacher_quality_pairwise_weight: 0.25
  candidate_teacher_quality_pairwise_min_gap: 0.25
  candidate_teacher_quality_logit_margin: 0.5

  # Keep pose-aware losses on: teacher quality tells what is matchable, GT pose
  # cost tells which matchable hypotheses are useful for CPR.
  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  score_correction_cosine_weight: 0.5
  score_pose_improvement_weight: 0.5
  score_anti_identity_weight: 0.25

  best_metric: selected_correction_cos
  best_metric_mode: max
