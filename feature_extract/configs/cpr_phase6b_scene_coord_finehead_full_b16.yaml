# Phase6-B geometry diagnostic with only the fine output head unlocked.
# This is less invasive than unlocking stage4, while allowing features feeding
# the scene-coordinate head to become slightly more geometry-aware.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6b_scene_coord_head_frozen_full_b32.yaml
exp_name: cpr_phase6b_scene_coord_finehead_full_b16

model:
  scene_coord_detach_base: false

training:
  batch_size: 16
  validation_batch_size: 8
  max_steps: 600
  lr: 0.00001
  freeze_model_except_prefixes:
    - "scene_coord_head."
    - "scene_context_proj."
    - "fine_head."
  model_lr_scales:
    scene_coord_head.: 30.0
    scene_context_proj.: 30.0
    fine_head.: 0.1

map_supervision:
  query_fine_weight: 1.0
  query_coarse_weight: 0.0
