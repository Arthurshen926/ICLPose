base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_pixloc_fm_v25.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_pixloc_fm_v26_window_attn

model:
  window_attention_layers: 2
  window_attention_heads: 8
  window_attention_size: 16
  window_attention_mlp_ratio: 2.0
  window_attention_shift: true
  window_attention_zero_init: true
  warmstart_skip_prefixes:
    - "local_flow_head."
    - "local_corr_projector."
    - "global_context."
    - "window_attention."

training:
  seed: 977
  freeze_model_except_prefixes:
    - "global_context."
    - "window_attention."
    - "local_matcher."
    - "stage3."
    - "stage4."
    - "fine_fuse."
    - "fine_low_fuse."
    - "fine_low_scale"
    - "fine_highres_fuse."
    - "fine_highres_scale"
    - "fine_head."
    - "local_corr_projector."
  model_lr_scales:
    global_context.: 0.25
    window_attention.: 0.25
    local_matcher.: 4.0
    local_corr_projector.: 8.0
    stage3.: 0.03
    stage4.: 0.08
    fine_head.: 0.35
