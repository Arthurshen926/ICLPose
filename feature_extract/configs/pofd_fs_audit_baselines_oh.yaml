    bank: /root/ICLPose/result/result/feature_extract/localizability_banks/oldhospital_q10_val128_standard.npz
  - name: q25
    bank: /root/ICLPose/result/result/feature_extract/localizability_banks/oldhospital_q25_val128_standard.npz
  - name: q50
    bank: /root/ICLPose/result/result/feature_extract/localizability_banks/oldhospital_q50_val128_standard.npz

constraints:
  use_external_pnp_or_loftr_scores_as_labels: false
  report_external_methods_only_as_baselines: true
