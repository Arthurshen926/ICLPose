# Stage A: frozen map/query backbone, train query local-corr projector + PoseEnergyNet.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6a2_metric_align_candidate_poseaware_sharedproj_w005_quick_b4.yaml
exp_name: nvs_pose_energy_stage_a_frozenmap

training:
  batch_size: 2
  validation_batch_size: 2
  num_workers: 0
  amp: true

map_supervision:
  trainable: false
  train_geometry: false
  candidate_render_batch_size: 16
  query_fine_key: fine
  local_corr_projector_enabled: true
  local_corr_projector_apply_to_query: true

pose_energy:
  topk: 64
  lattice_trans_cm: [0, 2, 5, 10, 25, 50]
  lattice_rot_deg: [0, 0.5, 1, 2, 5, 10]
  lattice_direction_mode: cube
  candidate_center_mode: noisy_init
  candidate_center_noise_mode: fixed
  candidate_center_trans_cm: 25.0
  candidate_center_rot_deg: 5.0
  target_temperature_m: 0.05
  rot_cost_weight: 0.1
  use_delta_vector: false
  residual_weight: 0.5
  improve_weight: 0.0
  auc_good_m: 0.05
  auc_bad_m: 0.25
  synthetic_ratio: 0.5
  synthetic_trans_cm: 25.0
  synthetic_rot_deg: 5.0
