# Vector-only fine selector config for offline cached evidence training.
# It matches the corronly small feature flags used by the score-map selector,
# but disables the score-map head so cached [K,D] evidence can train quickly.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_fine_topk_selector_corronly_mixed_lr1e3_b6.yaml
exp_name: cpr_phase6_fine_topk_selector_cached_vector_corronly_small

model:
  warmstart_strict: false
  fine_candidate_selector_enabled: true
  fine_candidate_selector_use_score_map_head: false
  fine_candidate_selector_hidden_dim: 64
  fine_candidate_selector_zero_init: true

dataset:
  max_train_samples: 256
  max_val_samples: 32

training:
  batch_size: 64
  lr: 0.001
  freeze_model_except_prefixes:
    - "fine_candidate_selector_head."

map_supervision:
  perturb_trans_cm_choices: [10.0, 25.0]
  perturb_rot_deg_choices: [2.0, 5.0]
  coarse_pose_lattice_trans_cm: [0.0, 5.0, 10.0, 25.0, 50.0]
  coarse_pose_lattice_rot_deg: [0.0, 1.0, 2.0, 5.0, 10.0]
  candidate_render_batch_size: 16
  fine_topk_selector_topk: 8
  fine_topk_selector_use_coarse_logits: false
  fine_topk_selector_use_candidate_delta: false
  fine_topk_selector_use_depth: false
  fine_topk_selector_use_mask: false
  fine_topk_selector_target_mode: gt_pose_error_hard
  fine_topk_selector_temperature: 0.25
  fine_topk_selector_pairwise_rank_weight: 0.2
  fine_topk_selector_pairwise_rank_min_gap_m: 0.02
  fine_topk_selector_pairwise_rank_temperature: 0.25
  fine_topk_selector_score_map_mode: peak_offset
