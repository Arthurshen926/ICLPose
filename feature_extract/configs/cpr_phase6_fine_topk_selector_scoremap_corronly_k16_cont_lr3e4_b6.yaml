# Train the same fine selector on a wider coarse pool.
# Intended for jittered T0 where top8 coverage is often not enough.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_fine_topk_selector_scoremap_corronly_small_hard_lr1e3_b6.yaml
exp_name: cpr_phase6_fine_topk_selector_scoremap_corronly_k16_cont_lr3e4_b6

dataset:
  max_train_samples: 256
  max_val_samples: 32

training:
  batch_size: 6
  max_steps: 160
  log_every: 2
  lr: 0.0003
  best_metric: map_fine_topk_selector_pred_trans_mm
  best_metric_mode: min
  freeze_model_except_prefixes:
    - "fine_candidate_selector_head."

map_supervision:
  perturb_trans_cm_choices: [10.0, 25.0, 50.0]
  perturb_rot_deg_choices: [2.0, 5.0, 10.0]
  candidate_render_batch_size: 32
  fine_topk_selector_topk: 16
  fine_topk_selector_target_mode: gt_pose_error_hard
  fine_topk_selector_temperature: 0.2
  fine_topk_selector_pairwise_rank_weight: 0.25
  fine_topk_selector_pairwise_rank_min_gap_m: 0.02
  fine_topk_selector_pairwise_rank_temperature: 0.2
