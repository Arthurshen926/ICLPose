# Clean CPR Phase 3: WLS on a meaningful small basin (5-10cm / 1deg).
# This checks whether the WLS update is directionally useful once init error is
# large enough to refine.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase3_v13_corrproj_smallwls_b20.yaml
exp_name: cpr_clean_phase3_v13_corrproj_wls_10cm_b20

training:
  batch_size: 20
  max_steps: 3000
  lr: 0.00005
  best_metric: map_corr_wls_trans_err_mm
  best_metric_mode: min

map_supervision:
  perturb_trans_cm_choices: [5.0, 10.0]
  perturb_rot_deg: 1.0
  query_corr_ce_weight: 0.25
  query_corr_subpixel_weight: 0.25
  query_corr_peak_margin_weight: 1.0
  query_corr_wls_pose_weight: 0.01
  query_corr_wls_pose_damping: 0.005
  query_corr_wls_pose_update_scale: 0.20

