# CPR probe: Phase 2 with stronger dense-correlation supervision.

base_config: /root/ICLPose/feature_extract/configs/cpr_main_phase2_query_align_frozenmap.yaml
exp_name: cpr_probe_phase2_corrheavy

training:
  max_steps: 5000
  best_metric: map_query_corr_subpx_flow_epe
  best_metric_mode: min

loss:
  fine_l1_weight: 0.08
  fine_cos_weight: 0.08
  coarse_l1_weight: 0.06
  coarse_cos_weight: 0.06

map_supervision:
  query_fine_weight: 0.70
  query_coarse_weight: 0.35
  query_fine_infonce_weight: 0.005
  query_corr_ce_weight: 0.80
  query_corr_subpixel_weight: 0.80
  query_corr_peak_margin_weight: 2.0
  perturb_render_negatives: true
  perturb_trans_cm_choices: [1.0, 2.0, 5.0, 10.0]
  perturb_rot_deg: 1.0
