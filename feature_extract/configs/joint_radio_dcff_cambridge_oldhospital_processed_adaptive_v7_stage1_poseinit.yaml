base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_locaware_flowhead_v1.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stage1_poseinit
output_dir: /root/ICLPose/result/feature_extract

model:
  pose_init_head: true
  pose_init_hypotheses: 3
  pose_init_hidden_dim: 384
  query_channel_gate_enabled: true
  query_channel_gate_hidden_dim: 192
  query_channel_gate_zero_init: false
  apply_query_channel_gate: true
  warmstart_strict: false
  warmstart_skip_prefixes:
    - "local_matcher."
    - "local_flow_head."
    - "pose_init_head."
    - "query_channel_gate."

pose_init:
  enabled: true
  trans_weight: 20.0
  rot_weight: 2.0
  score_weight: 0.25
  uncertainty_weight: 0.05
  rot_cost_weight: 0.1

training:
  epochs: 12
  batch_size: 1
  num_workers: 0
  lr: 0.00004
  max_steps: 1800
  log_every: 10
  model_lr_scales:
    pose_init_head: 8.0
    query_channel_gate: 4.0

loss:
  fine_l1_weight: 0.02
  fine_cos_weight: 0.03
  fine_grad_weight: 0.003
  fine_channel_std_weight: 0.005
  coarse_l1_weight: 0.01
  coarse_cos_weight: 0.015
  coarse_channel_std_weight: 0.003
  query_teacher_infonce_weight: 0.002

map_supervision:
  enabled: true
  trainable: false
  query_fine_weight: 0.02
  query_fine_raw_weight: 0.002
  query_fine_infonce_weight: 0.01
  query_fine_grad_weight: 0.006
  query_corr_ce_weight: 0.0
  query_corr_subpixel_weight: 0.0
  query_corr_flow_weight: 0.0
  query_corr_flow_head_conf_weight: 0.0
  query_corr_peak_margin_weight: 0.0
  query_corr_wls_pose_weight: 0.0
  query_corr_pose_gain_weight: 0.0
  query_flow_warp_weight: 0.0
  query_flow_warp_contrastive_weight: 0.0
  perturb_rank_weight: 0.0
