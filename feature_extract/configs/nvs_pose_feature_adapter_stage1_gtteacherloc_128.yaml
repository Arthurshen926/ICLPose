# Stage 1A scaled GT-render LoFTR correspondence supervision.
#
# Same objective as nvs_pose_feature_adapter_stage1_gtteacherloc.yaml, but with
# a larger teacher set exported in the GT render coordinate frame.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_gtteacherloc.yaml
exp_name: nvs_pose_feature_adapter_stage1_gtteacherloc_128

dataset:
  teacher_correspondence_train_path: /root/ICLPose/result/result/feature_extract/teacher_corr/oldhospital_train_gt_render_loftr_128_20260515
  teacher_correspondence_val_path: /root/ICLPose/result/result/feature_extract/teacher_corr/oldhospital_test_gt_render_loftr_32_20260515
  teacher_correspondence_max_points: 512
  teacher_correspondence_coordinate_space: image
  max_train_samples: 128
  max_val_samples: 32

training:
  batch_size: 8
  validation_batch_size: 8
  max_steps: 240
  eval_every: 30

nvs_pose_feature_adapter:
  best_metric: nvs_pair_match_gap
  best_metric_mode: max
