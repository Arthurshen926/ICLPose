# Phase6-B geometry diagnostic with a small query-side unlock.  This tests
# whether frozen fine features are the blocker for scene-coordinate evidence.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6b_scene_coord_head_frozen_full_b32.yaml
exp_name: cpr_phase6b_scene_coord_stage4_full_b16

model:
  scene_coord_detach_base: false

training:
  batch_size: 16
  validation_batch_size: 8
  max_steps: 600
  lr: 0.00001
  freeze_model_except_prefixes:
    - "scene_coord_head."
    - "scene_context_proj."
    - "stage4."
    - "fine_head."
  model_lr_scales:
    scene_coord_head.: 30.0
    scene_context_proj.: 30.0
    fine_head.: 0.3
    stage4.: 0.1

map_supervision:
  query_fine_weight: 0.5
  query_coarse_weight: 0.0
