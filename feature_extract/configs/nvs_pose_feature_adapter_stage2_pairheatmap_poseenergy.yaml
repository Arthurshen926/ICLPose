# Stage 2: freeze the localization feature and train a selector/PoseEnergy head
# over pair-conditioned heatmaps.  GT pose cost is the primary target; teacher
# quality remains a delayed auxiliary reliability target.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_locfeature_bucketmix.yaml
exp_name: nvs_pose_feature_adapter_stage2_pairheatmap_poseenergy

training:
  batch_size: 12
  validation_batch_size: 12
  max_steps: 180
  eval_every: 30

nvs_pose_feature_adapter:
  best_metric: pose_energy_pred_cost_m
  best_metric_mode: min

  train_pose_feature_adapter_domains: none
  train_pair_matcher: false
  train_pose_energy_net: true

  pose_energy_enabled: true
  pose_energy_weight: 1.0
  pose_energy_score_source: pair_matcher_heatmap
  pose_energy_factorized_heads: true
  pose_energy_translation_weight: 0.35
  pose_energy_rotation_weight: 0.25
  pose_energy_joint_weight: 0.40
  pose_energy_hard_ce_weight: 0.5
  pose_energy_component_hard_ce_weight: 0.25
  pose_energy_pairwise_rank_weight: 0.5
  pose_energy_pairwise_rank_min_gap_m: 0.03
  pose_energy_pairwise_rank_logit_margin: 0.5
  pose_energy_direction_weight: 0.75
  pose_energy_correction_cosine_weight: 0.5
  pose_energy_correction_cosine_temperature: 0.08
  pose_energy_anti_identity_weight: 0.75
  pose_energy_residual_weight: 0.0
  pose_energy_improve_weight: 0.0
  pose_energy_select_for_metric: true
  pose_energy_use_delta_vector: true
  pose_energy_use_center_delta_vector: true
  pose_energy_use_uncertainty: true
  pose_energy_use_rgb: true

  candidate_teacher_quality_weight: 0.5
  candidate_teacher_quality_start_step: 60
  candidate_teacher_quality_warmup_steps: 40

