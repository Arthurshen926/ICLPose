# Clean CPR Phase 3: optimize the fine update for init-to-final gain.
# WLS final-error loss alone selected low-error samples but did not reliably
# improve over T0.  This variant adds a direct pose-gain hinge loss.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase3_v13_corrproj_wls10cm_gated_lenient_b32.yaml
exp_name: cpr_clean_phase3_v13_corrproj_wls10cm_posegain_b32

training:
  batch_size: 32
  max_steps: 1400
  lr: 0.00005
  best_metric: map_corr_wls_gated_trans_gain_mm
  best_metric_mode: max

map_supervision:
  query_corr_wls_pose_weight: 0.005
  query_corr_pose_gain_weight: 10.0
  query_corr_pose_gain_trans_margin_mm: 1.0
  query_corr_pose_gain_trans_weight: 1.0
  query_corr_pose_gain_rot_weight: 0.0
