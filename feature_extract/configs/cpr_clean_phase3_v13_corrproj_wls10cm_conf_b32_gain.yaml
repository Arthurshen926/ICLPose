# Clean CPR Phase 3: 10cm-basin confidence-gated WLS, selected by pose gain.
# Starts from the validated clean v13 correlation projector path.  The raw
# query/map features stay fixed; only the local correlation projector is trained.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase3_v13_corrproj_wls_10cm_conf_b20.yaml
exp_name: cpr_clean_phase3_v13_corrproj_wls10cm_conf_b32_gain

training:
  batch_size: 32
  num_workers: 0
  max_steps: 1800
  lr: 0.00005
  best_metric: map_corr_wls_trans_gain_mm
  best_metric_mode: max
  freeze_model_except_prefixes:
    - "local_corr_projector."

map_supervision:
  query_corr_ce_weight: 0.25
  query_corr_subpixel_weight: 0.25
  query_corr_flow_cosine_weight: 0.15
  query_corr_peak_margin_weight: 1.0
  query_corr_wls_pose_weight: 0.015
  query_corr_wls_pose_update_scale: 0.20
  query_corr_wls_conf_threshold: 0.35
  query_corr_wls_conf_power: 2.0
  query_corr_wls_min_conf_cov: 0.03
