# POFD Stage4 deploy-style real-init eval.
#
# Uses a NetVLAD/render-LoFTR initialization cache rather than GT perturbation.
# Candidate rendering is only used by the dataset cache to provide the initial
# pose; the Stage4 evaluator refines from the single cached pose_init.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage4_single_render_q50_val128_eval.yaml
exp_name: pofd_stage4_single_render_realinit_netvlad_eval

dataset:
  teacher_correspondence_val_path:
  val_pose_candidate_cache: /root/ICLPose/result/result/feature_extract/pose_init_exports/oldhospital_netvlad_renderloftr_top10_test.npz

nvs_pose_feature_adapter:
  candidate_bank_mode: cache
  stage4_iterations: 3
