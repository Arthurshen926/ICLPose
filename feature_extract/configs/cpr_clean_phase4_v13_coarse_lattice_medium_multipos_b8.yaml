# Expert-v2 Phase4 probe: coarse scorer is trained as a topK/basin recall
# generator instead of a hard top1 selector. Map/query features stay frozen.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase4_v13_coarse_lattice_probe_medium_combo_rankhard_batch32_b6.yaml
exp_name: cpr_clean_phase4_v13_coarse_lattice_medium_multipos_b8

dataset:
  max_train_samples: 64
  max_val_samples: 32

training:
  batch_size: 8
  max_steps: 96
  log_every: 2
  best_metric: map_candidate_score_fusion_top8_basin_recall
  best_metric_mode: max

map_supervision:
  candidate_render_batch_size: 32
  candidate_score_fusion_target_mode: multi_positive
  candidate_score_fusion_temperature: 0.35
  candidate_score_fusion_cost_regression_weight: 0.05
  candidate_score_fusion_pairwise_rank_weight: 0.05
  candidate_score_fusion_pairwise_rank_min_gap_m: 0.05
  candidate_score_fusion_pairwise_rank_temperature: 0.5
