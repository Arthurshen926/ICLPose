# POFD Stage4: q50-focused query-centered pair-flow training.
#
# This keeps the Stage3a q50 scoring geometry and adds Stage4 pair-flow
# supervision so the matcher sees the nonzero offsets required by single-render
# continuous CPR.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage3a_multiscale_score_q50_shuf.yaml
exp_name: pofd_stage4_pairflow_q50_shuf

training:
  batch_size: 4
  validation_batch_size: 4
  pin_memory: false
  max_steps: 80
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: pred_cost_m
  best_metric_mode: min
  resume_adapter_strict: false

  pair_matcher_score_chunk_points: 512
  pair_matcher_score_candidate_chunk_size: 1

  pair_matcher_weight: 0.25
  stage4_pair_match_flow_weight: 1.0
  stage4_pair_match_flow_margin_weight: 0.5
  stage4_pair_match_flow_margin: 0.2
  stage4_pair_match_flow_cross_candidate_margin_weight: 0.0
  stage4_pair_match_flow_cross_candidate_margin: 0.2
  stage4_pair_match_flow_candidate_mode: all
  stage4_pair_match_flow_hard_negative_min_cost_gap_m: 0.12
