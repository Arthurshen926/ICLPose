base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_posebank_init_soft_v26.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_poseinit_fps_soft_v27
output_dir: /root/ICLPose/result/feature_extract

model:
  pose_init_head: true
  pose_init_mode: anchor
  pose_init_anchor_sampling: fps
  pose_init_num_anchors: 256
  pose_init_hypotheses: 24
  pose_init_residual_scale: 2.5
  pose_init_hidden_dim: 768

pose_init:
  enabled: true
  trans_weight: 6.0
  rot_weight: 1.5
  score_weight: 0.2
  uncertainty_weight: 0.02
  rot_cost_weight: 0.08
  anchor_weight: 4.0
  anchor_soft_sigma_m: 3.0
  anchor_soft_rot_sigma_deg: 35.0
  use_all_anchor_pose_loss: true

training:
  seed: 997
  lr: 0.00005
  max_steps: 2200
  log_every: 10
  model_lr_scales:
    pose_init_head: 12.0
    query_channel_gate: 1.0
