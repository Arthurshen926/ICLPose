base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_fineidentity_frozenmap_v6.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_fineloc_overfit1_v7

dataset:
  max_train_samples: 1

training:
  seed: 863
  lr: 0.00012
  max_steps: 300
  val_every: 100
  save_every: 100
  model_lr_scales:
    stage3.: 0.05
    stage4.: 0.10
    fine_loc_head.: 8.0
    fine_loc_highres_fuse.: 8.0
    local_corr_projector.: 12.0

map_supervision:
  query_fine_weight: 0.12
  query_fine_infonce_weight: 0.0
  query_fine_grad_weight: 0.05

  query_identity_corr_radius: 4
  query_identity_corr_temperature: 0.004
  query_identity_corr_ce_temperature: 0.025
  query_identity_corr_ce_weight: 8.0
  query_identity_corr_subpixel_weight: 8.0
  query_identity_corr_flow_weight: 1.0
  query_identity_corr_peak_margin_weight: 80.0
  query_identity_corr_peak_margin: 0.12

  query_corr_ce_weight: 0.0
  query_corr_subpixel_weight: 0.0
  query_corr_flow_weight: 0.0
  query_corr_peak_margin_weight: 0.0
  query_flow_warp_weight: 0.0
  query_flow_warp_contrastive_weight: 0.0
  map_self_corr_ce_weight: 0.0
  map_self_corr_subpixel_weight: 0.0
  map_self_corr_flow_weight: 0.0
  map_self_corr_peak_margin_weight: 0.0
