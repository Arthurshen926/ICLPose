base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_decoupled_fineloc_v10.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_locdriven_decoupled_corrdirect_v19

model:
  local_matcher_enabled: false
  local_flow_head_enabled: false
  warmstart_strict: false

training:
  seed: 929
  lr: 0.00006
  batch_size: 2
  max_steps: 500
  model_lr_scales:
    stage3.: 0.03
    stage4.: 0.08
    fine_head.: 0.35
    fine_loc_head.: 5.0
    fine_loc_highres_fuse.: 5.0
    local_corr_projector.: 4.0

map_supervision:
  local_matcher_enabled: false
  local_flow_head_enabled: false

  query_fine_key: fine
  query_local_fine_key: fine_loc

  query_fine_weight: 0.06
  query_fine_infonce_weight: 0.004
  query_fine_grad_weight: 0.010
  query_local_fine_weight: 0.030
  query_local_fine_infonce_weight: 0.120
  query_local_fine_grad_weight: 0.020

  query_identity_corr_ce_weight: 0.0
  query_identity_corr_subpixel_weight: 0.0
  query_identity_corr_flow_weight: 0.0
  query_identity_corr_peak_margin_weight: 0.0
  query_identity_corr_distill_weight: 0.0

  query_corr_radius: 10
  query_corr_temperature: 0.010
  query_corr_ce_temperature: 0.040
  query_corr_huber_delta: 0.30
  query_corr_min_flow_px: 1.25
  query_corr_max_flow_px: 8.0
  query_corr_flow_decode_mode: softargmax
  query_corr_ce_weight: 2.0
  query_corr_subpixel_weight: 3.0
  query_corr_flow_weight: 0.40
  query_corr_flow_cosine_weight: 2.0
  query_corr_peak_margin_weight: 8.0
  query_corr_peak_margin: 0.06
  query_corr_wls_pose_weight: 0.0
  query_corr_pose_gain_weight: 0.0

  query_flow_warp_weight: 0.0
  query_flow_warp_contrastive_weight: 0.0
  map_self_corr_ce_weight: 0.0
  map_self_corr_subpixel_weight: 0.0
  map_self_corr_flow_weight: 0.0
  map_self_corr_peak_margin_weight: 0.0
