# Phase6-A4: allow a very small query-side adapter to move, while keeping the
# backbone, map, scorer, and selector frozen.  A3 showed projector-only cannot
# make 25cm K64 fine evidence sortable; this tests whether global query channel
# calibration is the missing degree of freedom without opening the full query
# head.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6a3_metric_align_candidate_bucket025_soft010_sharedproj_w010_b4.yaml
exp_name: cpr_phase6a4_metric_align_bucket025_querygate_soft010_w010_b4

model:
  warmstart_strict: false
  query_channel_gate_enabled: true
  apply_query_channel_gate: true
  query_channel_gate_hidden_dim: 64
  query_channel_gate_zero_init: true

training:
  max_steps: 96
  lr: 0.00005
  freeze_model_except_prefixes:
    - "local_corr_projector."
    - "query_channel_gate."
  model_lr_scales:
    local_corr_projector.: 1.0
    query_channel_gate.: 0.3

map_supervision:
  # Guard the gated query features against drifting away from the frozen map.
  query_fine_weight: 0.5
  query_coarse_weight: 0.2
  query_projected_fine_weight: 1.0
  candidate_render_score_weight: 0.10
