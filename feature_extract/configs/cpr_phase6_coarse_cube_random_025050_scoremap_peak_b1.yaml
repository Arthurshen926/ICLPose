# Same bucket-specific cube lattice as the vector run, but train a fresh
# lightweight score-map coarse scorer. Uses peak/offset score maps, not the
# expensive full correlation volume, to keep K=2809 feasible on one 24GB GPU.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_coarse_cube_random_025050_vector_b1.yaml
exp_name: cpr_phase6_coarse_cube_random_025050_scoremap_peak_b1

model:
  warmstart_strict: false
  candidate_score_fusion_use_score_map_head: true
  candidate_score_fusion_hidden_dim: 64
  candidate_score_fusion_map_channels: 8
  candidate_score_fusion_grid_size: 4
  candidate_score_fusion_context_layers: 1
  candidate_score_fusion_context_heads: 1
  candidate_score_fusion_context_residual: true
  candidate_score_fusion_zero_init: true

map_supervision:
  candidate_score_fusion_score_map_mode: peak_offset
  candidate_score_fusion_radius: 2
