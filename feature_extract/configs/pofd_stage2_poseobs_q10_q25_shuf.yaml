# POFD Stage 2: pose-observability surrogate on small/local basins.
#
# Continues from Stage 1 or the best q10/q25 paircorr checkpoint.  The added
# observability contrast loss makes the GT-pose render score higher than hard
# nearby wrong-pose renders, which is the lightweight surrogate recommended in
# ChatGPT-ICLPose.md before implementing full Fisher/Jacobian objectives.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage1_singleloc_anchor_q10_q25_shuf.yaml
exp_name: pofd_stage2_poseobs_q10_q25_shuf

training:
  batch_size: 8
  validation_batch_size: 8
  max_steps: 100
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: pred_cost_m
  best_metric_mode: min

  candidate_teacher_quality_weight: 0.0
  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  score_correction_cosine_weight: 0.5
  score_pose_improvement_weight: 0.5
  score_anti_identity_weight: 0.5

  observability_contrast_weight: 1.0
  observability_contrast_margin: 0.05
  observability_negative_min_cost_m: 0.08
  observability_contrast_score_source: selection_score
