# Clean CPR Phase 2 probe that allows small raw head adaptation while the
# projector learns correlation. This is the control for projector-only training.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase2_v13_corrproj_b20.yaml
exp_name: cpr_clean_phase2_v13_corrproj_align_b20

training:
  lr: 0.0001
  freeze_model_except_prefixes:
    - "local_corr_projector."
    - "fine_head."
    - "coarse_head."
  model_lr_scales:
    local_corr_projector.: 1.0
    fine_head.: 0.10
    coarse_head.: 0.10

map_supervision:
  query_fine_weight: 0.50
  query_coarse_weight: 0.25
  query_corr_ce_weight: 0.35
  query_corr_subpixel_weight: 0.35
  query_corr_peak_margin_weight: 1.2

