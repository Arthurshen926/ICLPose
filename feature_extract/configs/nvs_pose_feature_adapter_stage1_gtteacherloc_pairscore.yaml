# Stage 1B: GT-render teacher correspondences + pair-matcher candidate ranking.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_gtteacherloc.yaml
exp_name: nvs_pose_feature_adapter_stage1_gtteacherloc_pairscore

training:
  batch_size: 6
  validation_batch_size: 6
  max_steps: 80
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: selected_correction_cos
  best_metric_mode: max

  score_mode: pair_matcher_local
  candidate_bank_mode: adaptive_direction_balanced
  direction_fractions: "0.75,0.5,0.25"
  topk: 8
  include_identity_candidate: true
  train_append_gt_candidate: false
  eval_append_gt_candidate: false

  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  rank_temperature_m: 0.05
  rank_pairwise_min_gap_m: 0.03
  score_correction_cosine_weight: 0.5
  score_pose_improvement_weight: 0.5
  score_anti_identity_weight: 0.5

