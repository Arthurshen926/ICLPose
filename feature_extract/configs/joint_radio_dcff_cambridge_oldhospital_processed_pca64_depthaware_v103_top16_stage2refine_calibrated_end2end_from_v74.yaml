base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v101_batchcandidate_corrvolume_wlssoft_calibrated_end2end_top8_from_v74.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v103_top16_stage2refine_calibrated_end2end_from_v74

dataset:
  pose_candidate_topk: 16

training:
  seed: 203
  max_steps: 640

map_supervision:
  # Stage 1 keeps full top16 coverage but does not backprop through all renders.
  candidate_render_score_train_map: false
  candidate_render_score_max_candidates: 16
  candidate_stage1_topk: 16

  # Stage 2 re-renders only scorer-selected candidates with map gradients and
  # optimizes the differentiable one-step WLS refined-pose error.
  candidate_two_stage_enabled: true
  candidate_stage2_topm: 2
  candidate_stage2_selection: pred
  candidate_stage2_train_map: true
  candidate_refined_pose_weight: 0.20
  candidate_refined_pose_feature: coarse
  candidate_refined_pose_radius: 2
  candidate_refined_pose_temperature: 0.05
  candidate_refined_pose_damping: 0.001
  candidate_refined_pose_update_scale: 1.0
  candidate_refined_pose_wls_conf_mode: max
  candidate_refined_pose_wls_conf_variance_scale: 0.5
  candidate_refined_pose_wls_downsample: 4
