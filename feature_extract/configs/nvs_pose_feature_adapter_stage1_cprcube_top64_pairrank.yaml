# Stage 1 CPR-pool feature adaptation.
#
# This trains the localization feature and pair matcher directly on the same
# cube1024 + rank-uniform top64 CPR candidate pool used by eval.  It is meant
# to fix the current failure where the candidate pool has good oracle poses but
# raw/local-corr features cannot rank them.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_matchingloc_main.yaml
exp_name: nvs_pose_feature_adapter_stage1_cprcube_top64_pairrank

dataset:
  pose_candidate_topk: 64
  pose_candidate_cache_keep_variants: true
  train_pose_candidate_cache_sampling: random
  val_pose_candidate_cache_sampling: first
  train_pose_candidate_cache: /root/ICLPose/result/result/feature_extract/pose_init_exports/cpr_cube1024_rankuniform_top64_train32x2_025050_jittered_20260515.npz
  val_pose_candidate_cache: /root/ICLPose/result/result/feature_extract/pose_init_exports/cpr_cube1024_rankuniform_top64_val16x2_025050_jittered_20260515.npz

training:
  batch_size: 4
  validation_batch_size: 4
  max_steps: 80
  eval_every: 20

nvs_pose_feature_adapter:
  candidate_bank_mode: cache
  candidate_center_mode: batch
  topk: 64
  synthetic_ratio: 0.0
  eval_synthetic_ratio: 0.0

  # CPR-pool ranking is the primary signal here; the NPZ has no PnP teacher
  # quality fields, and previous teacher-quality emphasis did not fix CPR.
  candidate_teacher_quality_weight: 0.0
  teacher_corr_weight: 0.0
  teacher_corr_local_patch_weight: 0.0
  pair_matcher_weight: 0.0

  pair_matcher_enabled: true
  train_pair_matcher: true
  score_mode: pair_matcher_local
  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.75
  rank_pairwise_min_gap_m: 0.03
  score_correction_cosine_weight: 1.0
  score_pose_improvement_weight: 1.0
  score_anti_identity_weight: 0.5

  align_weight: 0.05
  warp_align_weight: 0.5
  drift_weight: 0.01
  variance_weight: 0.02

  best_metric: pred_cost_m
  best_metric_mode: min
