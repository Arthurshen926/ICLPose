base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v68_unified_attn_residual_spatial_alignfirst_stop640.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v73_poseinit_mapcoarse_from_v68

dataset:
  feature_dir: /root/ICLPose/result/result/feature_extract/features_radio_dual_v68_align_stop640/cambridge_oldhospital_processed
  max_train_samples: 895
  max_val_samples: 182

model:
  warmstart_strict: false
  warmstart_skip_prefixes:
    - fine_loc_head.
    - fine_loc_highres_fuse.
    - fine_loc_scale
    - fine_loc_highres_scale
    - local_flow_head.
    - pose_init_head.
  pose_init_head: true
  pose_init_mode: feature_bank
  pose_init_feature_bank_source: map
  pose_init_feature_source: coarse
  pose_init_feature_bank_projector: mlp
  pose_init_anchor_sampling: train_all
  pose_init_num_anchors: 2048
  pose_init_hypotheses: 50
  pose_init_hidden_dim: 256
  pose_init_temperature: 0.05
  pose_init_residual_scale: 0.5

pose_init:
  enabled: true
  trans_weight: 8.0
  rot_weight: 1.5
  score_weight: 2.0
  uncertainty_weight: 0.01
  rot_cost_weight: 0.08
  anchor_weight: 12.0
  anchor_soft_sigma_m: 1.5
  anchor_soft_rot_sigma_deg: 20.0
  use_all_anchor_pose_loss: true

training:
  seed: 173
  batch_size: 1
  num_workers: 0
  max_steps: 640
  lr: 5.0e-5
  freeze_model_except_prefixes:
    - pose_init_head.
  model_lr_scales:
    pose_init_head.: 12.0

loss:
  fine_l1_weight: 0.0
  fine_cos_weight: 0.0
  fine_grad_weight: 0.0
  fine_channel_std_weight: 0.0
  coarse_l1_weight: 0.0
  coarse_cos_weight: 0.0
  coarse_grad_weight: 0.0
  coarse_channel_std_weight: 0.0
  query_teacher_infonce_weight: 0.0

map_supervision:
  enabled: true
  trainable: false
  train_fine_decoder: false
  train_coarse_fusion: false
  train_feat_sharp: false
  train_fsm: false
  train_hash_mlp: false
  train_latent: false
  query_fine_weight: 0.0
  query_coarse_weight: 0.0
  query_fine_infonce_weight: 0.0
  query_coarse_infonce_weight: 0.0
  coarse_pose_rank_weight: 0.0
  query_corr_ce_weight: 0.0
  query_corr_subpixel_weight: 0.0
  query_corr_peak_margin_weight: 0.0
  query_corr_wls_pose_weight: 0.0
  feature_metric_pose_weight: 0.0

