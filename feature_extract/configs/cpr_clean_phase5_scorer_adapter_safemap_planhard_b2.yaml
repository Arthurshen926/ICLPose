# Phase5 CPR: freeze map/query and train the coarse candidate scorer head plus
# residual basin adapter on the plan medium lattice.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase5_basin_adapter_safemap_planhard_b2.yaml
exp_name: cpr_clean_phase5_scorer_adapter_safemap_planhard_b2

model:
  candidate_basin_adapter_max_scale: 0.25

training:
  batch_size: 2
  max_steps: 128
  log_every: 2
  lr: 0.0004
  best_metric: map_candidate_score_fusion_pred_trans_mm
  best_metric_mode: min
  freeze_model_except_prefixes:
    - "candidate_score_fusion_head."
    - "candidate_basin_adapter."
  model_lr_scales:
    candidate_score_fusion_head.: 1.0
    candidate_basin_adapter.: 0.5

map_supervision:
  candidate_score_fusion_weight: 0.10
  candidate_score_fusion_cost_regression_weight: 0.10
  candidate_score_fusion_pairwise_rank_weight: 0.15
