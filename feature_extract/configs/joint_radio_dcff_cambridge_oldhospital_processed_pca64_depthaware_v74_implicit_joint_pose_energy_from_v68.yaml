base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v68_unified_attn_residual_spatial_alignfirst_stop640.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v74_implicit_joint_pose_energy_from_v68

dataset:
  feature_dir: /root/ICLPose/result/result/feature_extract/features_radio_dual_v68_align_stop640/cambridge_oldhospital_processed
  max_train_samples: 895
  max_val_samples: 182

model:
  warmstart_strict: false
  warmstart_skip_prefixes:
    - fine_loc_head.
    - fine_loc_highres_fuse.
    - fine_loc_scale
    - fine_loc_highres_scale
    - local_flow_head.
    - pose_init_head.
  pose_init_head: false

training:
  seed: 174
  batch_size: 1
  num_workers: 0
  max_steps: 960
  lr: 5.0e-5
  freeze_model_except_prefixes: null
  model_lr_scales:
    global_context.: 0.25
    window_attention.: 0.25
    query_channel_gate.: 1.0
    local_corr_projector.: 8.0
    stage3.: 0.03
    stage4.: 0.08
    fine_head.: 0.35
    coarse_head.: 0.35
    coarse_refine.: 0.25

loss:
  fine_l1_weight: 0.02
  fine_cos_weight: 0.02
  fine_grad_weight: 0.0
  fine_channel_std_weight: 0.0
  coarse_l1_weight: 0.02
  coarse_cos_weight: 0.02
  coarse_grad_weight: 0.0
  coarse_channel_std_weight: 0.0
  query_teacher_infonce_weight: 0.0

map_supervision:
  enabled: true
  trainable: true
  train_fine_decoder: true
  train_coarse_fusion: false
  train_feat_sharp: true
  train_fsm: true
  train_hash_mlp: true
  train_latent: true
  train_geometry: false
  map_lr_scale: 0.02
  hash_mlp_lr_scale: 0.02
  latent_lr_scale: 0.01

  coarse_start_epoch: 0
  query_fine_weight: 0.05
  query_coarse_weight: 0.20
  query_fine_infonce_weight: 0.01
  query_coarse_infonce_weight: 0.02
  rendered_teacher_fine_weight: 0.002
  rendered_teacher_coarse_weight: 0.002

  coarse_pose_energy_weight: 2.0
  coarse_pose_energy_temperature: 0.05
  global_render_negative_count: 4
  global_render_negative_min_trans_m: 2.0

  coarse_pose_rank_weight: 0.5
  coarse_pose_rank_temperature: 0.05
  perturb_render_negatives: true
  perturb_trans_cm_choices: [20.0, 50.0, 100.0, 200.0]
  perturb_rot_deg: 3.0

  query_variance_weight: 0.01
  map_variance_weight: 0.01
  query_covariance_weight: 0.002
  map_covariance_weight: 0.002

  query_corr_ce_weight: 0.0
  query_corr_subpixel_weight: 0.0
  query_corr_peak_margin_weight: 0.0
  query_corr_wls_pose_weight: 0.0
  feature_metric_pose_weight: 0.0
