# Stage 1A with GT-render LoFTR correspondence supervision.
#
# This fixes the earlier teacher-coordinate mismatch: map_xy now belongs to
# the same GT render used by nvs_gt_fine, so correspondence supervision is
# geometrically consistent.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_teacherloc.yaml
exp_name: nvs_pose_feature_adapter_stage1_gtteacherloc

dataset:
  teacher_correspondence_train_path: /root/ICLPose/result/result/feature_extract/teacher_corr/oldhospital_train_gt_render_loftr_32_20260515
  teacher_correspondence_val_path: /root/ICLPose/result/result/feature_extract/teacher_corr/oldhospital_test_gt_render_loftr_16_20260515
  teacher_correspondence_max_points: 512
  teacher_correspondence_coordinate_space: image

training:
  batch_size: 8
  validation_batch_size: 8
  max_steps: 80
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: nvs_pair_match_gap
  best_metric_mode: max

  # Stage 1A: train localizable query/render features and pair matcher first.
  pose_energy_enabled: false
  pose_energy_weight: 0.0
  rank_ce_weight: 0.0
  rank_pairwise_weight: 0.0
  score_correction_cosine_weight: 0.0
  score_pose_improvement_weight: 0.0
  score_anti_identity_weight: 0.0

  pair_matcher_enabled: true
  pair_matcher_weight: 2.0
  pair_matcher_hidden_dim: 96
  pair_matcher_radius: 3
  pair_matcher_score_stride: 8
  pair_matcher_score_chunk_points: 32768

  teacher_corr_weight: 1.0
  teacher_corr_local_patch_weight: 2.0
  teacher_corr_min_confidence: 0.3
  teacher_corr_min_points: 16
  teacher_corr_local_patch_min_points: 16

  # Keep base anchors weak so they do not erase pose-sensitive evidence.
  align_weight: 0.05
  warp_align_weight: 0.0
  drift_weight: 0.005
  variance_weight: 0.02
  synthetic_ratio: 0.0

