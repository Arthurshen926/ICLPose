# Phase6-A: strong-anchored query/map metric alignment before K64 selection.
# Trains only an asymmetric local-correlation projection space.  Query/map
# feature fields and candidate heads stay frozen, so this stage cannot corrupt
# the already useful safe-map/coarse topK path.

base_config: /root/ICLPose/feature_extract/configs/cpr_baseline_v13.yaml
exp_name: cpr_phase6a_metric_align_domainproj_anchor_v2_b48

model:
  warmstart_strict: false
  fine_loc_head: false
  local_corr_projector_enabled: true
  local_corr_projector_domain_adapter: true
  local_corr_projector_hidden_dim: 128
  local_corr_projector_output_dim: 64
  local_corr_projector_zero_init: true
  local_corr_projector_l2_normalize: true
  fine_candidate_selector_enabled: false
  candidate_score_fusion_head: false

training:
  batch_size: 48
  validation_batch_size: 12
  num_workers: 0
  pin_memory: false
  max_steps: 1600
  lr: 0.0001
  log_every: 10
  best_metric: map_query_corr_subpx_flow_epe
  best_metric_mode: min
  freeze_model_except_prefixes:
    - "local_corr_projector."
  model_lr_scales:
    local_corr_projector.: 1.0

loss:
  fine_l1_weight: 0.0
  fine_cos_weight: 0.0
  coarse_l1_weight: 0.0
  coarse_cos_weight: 0.0

map_supervision:
  enabled: true
  trainable: false
  train_geometry: false
  query_fine_key: fine
  query_local_fine_key: fine
  local_corr_projector_enabled: true
  local_corr_projector_apply_to_query: true

  # Dense GT-pose alignment in the projected local-correlation space.
  query_fine_weight: 0.0
  query_coarse_weight: 0.0
  query_projected_fine_weight: 1.0
  query_projected_variance_weight: 0.05
  query_projected_covariance_weight: 0.01
  variance_target_std: 0.05

  # Local metric shaping from small pose perturbations, not K64 ranking.
  query_corr_radius: 4
  query_corr_temperature: 0.05
  query_corr_ce_temperature: 0.05
  query_corr_feature_preprocess: spatial_center
  query_corr_highpass_kernel: 5
  query_corr_ce_weight: 1.0
  query_corr_subpixel_weight: 0.3
  query_corr_peak_margin_weight: 0.2
  query_corr_peak_margin: 0.05
  query_corr_wls_pose_weight: 0.0

  perturb_render_negatives: true
  perturb_pose_mode: se3
  perturb_direction_mode: random
  perturb_trans_cm_choices: [2.0, 5.0, 10.0]
  perturb_rot_deg_choices: [0.5, 1.0, 2.0]

  fine_topk_selector_weight: 0.0
  candidate_score_fusion_weight: 0.0
  candidate_render_score_weight: 0.0
  candidate_refined_pose_weight: 0.0
  feature_metric_pose_weight: 0.0
  feature_metric_gradient_direction_weight: 0.0

export:
  fine_key: fine
