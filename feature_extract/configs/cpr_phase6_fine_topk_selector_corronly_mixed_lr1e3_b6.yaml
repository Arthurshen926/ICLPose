# CPR Phase 6 reranker ablation: correlation-only selector.
# Removes coarse logits, candidate motion delta, depth, and mask priors after
# the first trainable selector learned an identity/T0-biased rule.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_fine_topk_selector_frozen_b6.yaml
exp_name: cpr_phase6_fine_topk_selector_corronly_mixed_lr1e3_b6

training:
  lr: 0.001
  max_steps: 256
  best_metric: map_fine_topk_selector_pred_trans_mm
  best_metric_mode: min

map_supervision:
  perturb_trans_cm_choices: [10.0, 25.0, 50.0]
  perturb_rot_deg_choices: [2.0, 5.0, 10.0]
  fine_topk_selector_use_coarse_logits: false
  fine_topk_selector_use_candidate_delta: false
  fine_topk_selector_use_depth: false
  fine_topk_selector_use_mask: false
