# CPR Phase 6 fine reranker: score-map selector, no motion/coarse priors.
# This variant keeps map/query/coarse frozen and lets the selector read the
# local correlation peak/offset maps instead of only vector statistics.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_fine_topk_selector_corronly_mixed_lr1e3_b6.yaml
exp_name: cpr_phase6_fine_topk_selector_scoremap_corronly_mixed_hard_lr1e3_b6

model:
  fine_candidate_selector_use_score_map_head: true
  fine_candidate_selector_hidden_dim: 64
  fine_candidate_selector_map_channels: 8
  fine_candidate_selector_grid_size: 4
  fine_candidate_selector_context_layers: 1
  fine_candidate_selector_context_heads: 1
  fine_candidate_selector_context_residual: true
  fine_candidate_selector_zero_init: true

training:
  lr: 0.001
  max_steps: 160
  best_metric: map_fine_topk_selector_pred_trans_mm
  best_metric_mode: min

map_supervision:
  fine_topk_selector_target_mode: gt_pose_error_hard
  fine_topk_selector_temperature: 0.25
  fine_topk_selector_pairwise_rank_weight: 0.2
  fine_topk_selector_pairwise_rank_min_gap_m: 0.02
  fine_topk_selector_pairwise_rank_temperature: 0.25
  fine_topk_selector_score_map_mode: peak_offset
