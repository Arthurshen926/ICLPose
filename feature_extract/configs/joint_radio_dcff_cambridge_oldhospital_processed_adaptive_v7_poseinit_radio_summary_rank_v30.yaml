base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_poseinit_radio_summary_v29.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_poseinit_radio_summary_rank_v30
output_dir: /root/ICLPose/result/feature_extract

retrieval:
  enabled: true
  feature_dir: /root/ICLPose/result/feature_extract/features_radio_dual/cambridge_oldhospital_processed
  teacher_subdir: summary
  student_dim: 2560
  hidden_dim: 768
  dropout: 0.05
  l2_normalize: true
  cache_teacher: false
  l1_weight: 0.05
  cos_weight: 1.0
  infonce_weight: 1.0
  similarity_weight: 0.2
  temperature: 0.05

pose_init:
  enabled: true
  trans_weight: 5.0
  rot_weight: 1.0
  score_weight: 1.0
  uncertainty_weight: 0.01
  rot_cost_weight: 0.08
  anchor_weight: 20.0
  anchor_soft_sigma_m: 2.5
  anchor_soft_rot_sigma_deg: 30.0
  use_all_anchor_pose_loss: true

training:
  seed: 1019
  batch_size: 8
  num_workers: 0
  lr: 0.00008
  max_steps: 2500
  log_every: 10
  model_lr_scales:
    retrieval_head.: 12.0
    pose_init_head: 18.0
    stage3.: 0.04
    stage4.: 0.08
    fine_head.: 0.10
    coarse_head.: 0.10
