# POFD Stage 2e-B: q50 feature-health probe with residual texture branch.
#
# The previous main matchingloc config lets the RGB/texture branch replace the
# base RADIO/DCFF feature.  q50 diagnostics show low align_cos and poor
# Spearman, so this probe keeps the feature family closer to the teacher/map
# space and tests whether residual adaptation is a better POFD bias.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage2d_nvs_quality_pose_margin_q50_shuf.yaml
exp_name: pofd_stage2e_q50_residual_feature_health_shuf

training:
  batch_size: 16
  validation_batch_size: 16
  max_steps: 40
  eval_every: 20

nvs_pose_feature_adapter:
  pose_feature_adapter_texture_fusion_mode: residual
  pose_feature_adapter_texture_branch_scale: 0.25
  pose_feature_adapter_base_anchor_weight: 1.0
  pose_feature_adapter_residual_scale: 0.1
  align_weight: 0.5
  drift_weight: 0.08
  variance_weight: 0.02

  candidate_teacher_quality_weight: 0.75
  candidate_observability_weight: 0.25
  score_anti_identity_weight: 0.25
