# CPR fine selector over a coverage-preserving local cube lattice.
#
# Rationale:
# - jittered/no-exact eval shows axis topK is selector-limited and coverage-limited.
# - cube1024 + rank-uniform top64 keeps the coarse scorer as a prior but adds
#   diverse local hypotheses so the fine selector can actually reach the oracle.

base_config: /root/ICLPose/result/result/feature_extract/cpr_clean_phase5_scorer_adapter_safemap_planhard_b2/config.yaml
exp_name: cpr_cube1024_rankuniform_top64_fine_selector_scoremap

model:
  warmstart_strict: false
  fine_candidate_selector_enabled: true
  fine_candidate_selector_use_score_map_head: true
  fine_candidate_selector_score_map_channels: 3
  fine_candidate_selector_map_channels: 8
  fine_candidate_selector_grid_size: 4
  fine_candidate_selector_hidden_dim: 96
  fine_candidate_selector_context_layers: 1
  fine_candidate_selector_context_heads: 1
  fine_candidate_selector_context_residual: true
  fine_candidate_selector_zero_init: true

training:
  batch_size: 4
  lr: 0.0005
  freeze_model_except_prefixes:
    - "fine_candidate_selector_head."

map_supervision:
  fine_topk_selector_topk: 64
  fine_topk_selector_mode: local
  fine_topk_selector_radius: 4
  fine_topk_selector_score_map_mode: peak_offset
  fine_topk_selector_preprocess: spatial_center
  fine_topk_selector_highpass_kernel: 5
  fine_topk_selector_use_projector: true
  fine_topk_selector_require_projector: false
  fine_topk_selector_projector_chunk_size: 32
  fine_topk_selector_use_coarse_logits: true
  fine_topk_selector_use_candidate_delta: true
  fine_topk_selector_use_delta_vector: false
  fine_topk_selector_use_depth: true
  fine_topk_selector_use_mask: true
  fine_topk_selector_use_rgb: false
  fine_topk_selector_temperature: 0.25
  fine_topk_selector_target_mode: gt_pose_error_soft
  fine_topk_selector_target_temperature_m: 0.05
  fine_topk_selector_pairwise_rank_weight: 0.15
  fine_topk_selector_pairwise_rank_min_gap_m: 0.03
  fine_topk_selector_pairwise_rank_temperature: 0.25
  fine_topk_selector_rot_cost_weight: 0.1
  fine_topk_selector_basin_trans_m: 0.25
  fine_topk_selector_basin_rot_deg: 5.0
