base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_locaware_flowhead_v48_negmap_distill_raw_finedecoder.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_locaware_flowhead_v50_corrproj_raw_negmap_distill

model:
  local_corr_projector_enabled: true
  local_corr_projector_hidden_dim: 128
  local_corr_projector_output_dim: 96
  local_corr_projector_zero_init: true
  local_corr_projector_l2_normalize: true
  warmstart_strict: false
  warmstart_skip_prefixes: ["local_corr_projector."]

training:
  seed: 613
  lr: 0.00002
  batch_size: 2
  max_steps: 700
  freeze_model_except_prefixes:
    - "fine_loc_head."
    - "fine_loc_highres_fuse."
    - "fine_loc_scale"
    - "fine_loc_highres_scale"
    - "local_corr_projector."
  model_lr_scales:
    local_corr_projector.: 4.0

map_supervision:
  local_corr_projector_enabled: true
  query_fine_weight: 0.18
  query_fine_infonce_weight: 0.010
  query_fine_grad_weight: 0.010

  query_corr_feature_preprocess: none
  query_corr_distill_weight: 2.0
  query_corr_distill_temperature: 0.04
  query_corr_distill_target_temperature: 0.025
  query_corr_ce_weight: 0.7
  query_corr_subpixel_weight: 0.7
  query_corr_flow_weight: 0.3
  query_corr_peak_margin_weight: 5.0
  query_corr_peak_margin: 0.04

