base_config: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_locaware_flowhead_v42_corr_concat_highpass_finedecoder.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_locaware_flowhead_v44_corr_concat_highpass_selfdistill_finedecoder

training:
  seed: 571
  lr: 0.000015
  batch_size: 2
  max_steps: 700

map_supervision:
  # Keep the reconstruction anchor stronger than the localization-only branch.
  query_fine_weight: 0.24
  query_fine_infonce_weight: 0.014
  query_fine_grad_weight: 0.020

  # Softly distill map-self local correlation into query-map correlation.
  query_identity_corr_distill_weight: 1.2
  query_identity_corr_distill_temperature: 0.05
  query_identity_corr_distill_target_temperature: 0.035

  # Hard identity objectives remain as weak peak regularizers only.
  query_identity_corr_ce_weight: 0.15
  query_identity_corr_subpixel_weight: 0.25
  query_identity_corr_flow_weight: 0.05
  query_identity_corr_peak_margin_weight: 2.0
  query_identity_corr_peak_margin: 0.03

  query_corr_ce_weight: 0.55
  query_corr_subpixel_weight: 0.55
  query_corr_flow_weight: 0.25
  query_corr_peak_margin_weight: 4.0
  query_corr_peak_margin: 0.03
  query_flow_warp_weight: 0.08
  query_flow_warp_contrastive_weight: 4.0
