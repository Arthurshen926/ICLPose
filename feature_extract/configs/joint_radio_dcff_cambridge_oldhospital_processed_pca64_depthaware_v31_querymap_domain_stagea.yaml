base_config: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v22_jointmap_corrwls_peak.yaml
exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_v31_querymap_domain_stagea

model:
  local_corr_projector_enabled: true
  local_corr_projector_domain_adapter: true
  local_corr_projector_hidden_dim: 128
  local_corr_projector_output_dim: 64
  local_corr_projector_zero_init: true
  warmstart_strict: false

training:
  seed: 131
  lr: 0.00005
  max_steps: 1200
  model_lr_scales:
    local_corr_projector.: 8.0
    fine_loc_head.: 4.0
    fine_loc_highres_fuse.: 4.0

map_supervision:
  trainable: false
  train_fine_decoder: false
  train_feat_sharp: false
  train_fsm: false
  local_corr_projector_enabled: true
  local_corr_projector_apply_to_query: true
  feature_metric_use_projector: true
  query_corr_ce_weight: 8.0
  query_corr_subpixel_weight: 4.0
  query_corr_flow_weight: 0.05
  query_corr_peak_margin_weight: 20.0
  query_corr_low_peak_gap_threshold: 0.02
  query_corr_wls_pose_weight: 0.2
  query_corr_wls_pose_update_scale: 0.25
  query_corr_wls_pose_rot_weight: 0.1
  query_corr_wls_pose_trans_weight: 20.0
  feature_metric_pose_weight: 0.04
  feature_metric_pose_update_scale: 0.25
