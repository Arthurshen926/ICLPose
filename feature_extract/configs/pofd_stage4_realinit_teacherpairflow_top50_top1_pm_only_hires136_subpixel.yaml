# Continuous-offset companion for the high-resolution render-at-init LoFTR
# teacher-flow experiment.  Integer CE is disabled because many real-init
# corrections are below one score-grid pixel and otherwise round to the center.

base_config: /root/ICLPose/feature_extract/configs/pofd_stage4_realinit_teacherpairflow_top50_top1_pm_only_hires136.yaml
exp_name: pofd_stage4_realinit_teacherpairflow_top50_top1_pm_only_hires136_subpixel

nvs_pose_feature_adapter:
  best_metric: nvs_teacher_pair_flow_subpixel_epe
  best_metric_mode: min

  pair_matcher_temperature: 0.2
  teacher_pair_flow_temperature: 0.2
  teacher_pair_flow_min_target_offset_px: 0.25
  teacher_pair_flow_ce_weight: 0.0
  teacher_pair_flow_margin_weight: 0.0
  teacher_pair_flow_subpixel_weight: 5.0
  teacher_pair_flow_subpixel_beta: 0.5
