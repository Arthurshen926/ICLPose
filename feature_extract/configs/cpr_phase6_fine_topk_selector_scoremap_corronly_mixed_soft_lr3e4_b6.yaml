# CPR Phase 6 fine reranker: lower-capacity score-map selector with soft pose target.
# Use this if hard score-map training becomes over-confident on train but does not
# improve validation selection.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6_fine_topk_selector_corronly_mixed_lr1e3_b6.yaml
exp_name: cpr_phase6_fine_topk_selector_scoremap_corronly_mixed_soft_lr3e4_b6

model:
  fine_candidate_selector_use_score_map_head: true
  fine_candidate_selector_hidden_dim: 64
  fine_candidate_selector_map_channels: 4
  fine_candidate_selector_grid_size: 4
  fine_candidate_selector_context_layers: 0
  fine_candidate_selector_zero_init: true

training:
  lr: 0.0003
  max_steps: 160
  best_metric: map_fine_topk_selector_pred_trans_mm
  best_metric_mode: min

map_supervision:
  fine_topk_selector_target_mode: gt_pose_error_soft
  fine_topk_selector_target_temperature_m: 0.03
  fine_topk_selector_temperature: 1.0
  fine_topk_selector_pairwise_rank_weight: 0.05
  fine_topk_selector_pairwise_rank_min_gap_m: 0.02
  fine_topk_selector_pairwise_rank_temperature: 0.5
  fine_topk_selector_score_map_mode: peak_offset
