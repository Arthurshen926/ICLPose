experiment: pofd_fs_stage2_pose_rank_q50_shopfacade
scene: ShopFacade

selector:
  in_channels: 64
  out_channels: 64
  group_size: 8
  spatial_utility: true
  uncertainty: true
  l2_normalize: true

scorer:
  mode: pair_matcher_local
  score_feature_hw: [34, 60]
  radius: 12
  temperature: 0.04

losses:
  rank_weight: 1.0
  online_hard_weight: 1.0
  basin_bce_weight: 0.5
  weak_teacher_anchor_weight: 0.03

candidate_banks:
  train:
    - /root/ICLPose/result/result/feature_extract/localizability_banks/shopfacade_q50_train_standard.npz
  val:
    - /root/ICLPose/result/result/feature_extract/localizability_banks/shopfacade_q50_val_standard.npz
