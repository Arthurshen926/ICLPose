# CPR Phase 6 coarse scorer repair for continuous T0 noise.
#
# Fixed-lattice fine selector improved topK reranking, but random/jittered eval
# showed the upstream coarse topK no longer reliably enters the fine basin.
# This run freezes map/query/adapter and retrains only the coarse candidate
# scorer on random-direction T0 perturbations with a cube-direction lattice.

base_config: /root/ICLPose/feature_extract/configs/cpr_clean_phase5_basin_adapter_on_safemap_top4_b6.yaml
exp_name: cpr_phase6_coarse_cube_random_scorer_b2

dataset:
  max_train_samples: 128
  max_val_samples: 32

training:
  batch_size: 2
  max_steps: 160
  log_every: 2
  lr: 0.0001
  best_metric: map_candidate_score_fusion_top4_basin_recall
  best_metric_mode: max
  freeze_model_except_prefixes:
    - "candidate_score_fusion_head."
  model_lr_scales:
    candidate_score_fusion_head.: 1.0

loss:
  fine_l1_weight: 0.0
  fine_cos_weight: 0.0
  coarse_l1_weight: 0.0
  coarse_cos_weight: 0.0

map_supervision:
  trainable: false
  train_geometry: false
  candidate_render_score_train_map: false
  candidate_render_include_aux: false
  candidate_render_batch_size: 16

  perturb_render_negatives: true
  perturb_pose_mode: se3_delta
  perturb_direction_mode: random
  perturb_trans_cm_choices: [10.0, 25.0, 50.0]
  perturb_rot_deg: 0.0
  perturb_rot_deg_choices: [2.0, 5.0, 10.0]

  candidate_render_pose_source: coarse_pose_lattice
  coarse_pose_lattice_base_source: rendered_map_pose_neg
  coarse_pose_lattice_direction_mode: cube
  coarse_pose_lattice_trans_cm: [0.0, 5.0, 10.0, 25.0, 50.0]
  coarse_pose_lattice_rot_deg: [0.0, 1.0, 2.0, 5.0, 10.0]
  coarse_pose_lattice_combine_trans_rot: true
  coarse_pose_lattice_max_candidates: 1024
  coarse_pose_lattice_limit_strategy: uniform

  candidate_score_fusion_weight: 1.0
  candidate_score_fusion_target_mode: multi_positive
  candidate_score_fusion_temperature: 0.35
  candidate_score_fusion_cost_regression_weight: 0.05
  candidate_score_fusion_cost_regression_temperature_m: 0.05
  candidate_score_fusion_pairwise_rank_weight: 0.05
  candidate_score_fusion_pairwise_rank_min_gap_m: 0.05
  candidate_score_fusion_pairwise_rank_temperature: 0.5
  candidate_score_fusion_basin_trans_m: 0.25
  candidate_score_fusion_basin_rot_deg: 5.0

  fine_topk_selector_weight: 0.0
