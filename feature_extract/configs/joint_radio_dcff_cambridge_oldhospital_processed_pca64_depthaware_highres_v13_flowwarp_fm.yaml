exp_name: joint_radio_dcff_cambridge_oldhospital_processed_pca64_depthaware_highres_v13_flowwarp_fm
output_dir: /root/ICLPose/result/feature_extract

dataset:
  source_dir: /hy-tmp/Cambridge_stdloc/OldHospital/processed
  colmap_dir: /hy-tmp/Cambridge_stdloc/OldHospital/sparse/0
  feature_dir: /root/ICLPose/result/feature_extract/features_radio_dual/cambridge_oldhospital_processed
  train_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_train.txt
  val_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_test.txt
  image_patterns:
    - seq*/*.png
    - seq*/*.jpg
    - images/*.png
    - images/*.jpg
    - "*.png"
    - "*.jpg"
  patch_size: 16
  input_hw: [1088, 1920]
  feature_hw: [68, 120]
  coarse_feature_hw: [68, 120]
  student_feature_hw: [136, 240]
  student_coarse_feature_hw: [68, 120]
  cache_teacher: false
  fallback_val_ratio: 0.1
  max_train_samples: null
  max_val_samples: 182
  synthetic_if_missing: false
  prior_mask_path: /hy-tmp/Cambridge_stdloc/OldHospital/processed/masks.pkl
  prior_mask_channels: [0, 1, 2]

model:
  feature_dim: 64
  fine_feature_dim: 64
  coarse_feature_dim: 64
  base_channels: 48
  stage_dims: [48, 96, 144, 192]
  dropout: 0.0
  l2_normalize: true
  predict_magnitude: true
  fine_init_norm: 4.38
  coarse_init_norm: 25.50
  magnitude_min: 0.0001
  warmstart_strict: false
  fine_low_level_skip: true
  fine_low_level_init: 0.25

training:
  device: cuda
  seed: 75
  epochs: 16
  batch_size: 4
  num_workers: 0
  lr: 0.00008
  weight_decay: 0.00001
  grad_clip: 1.0
  amp: true
  log_every: 10
  save_every_epochs: 1
  val_every_epochs: 1
  max_steps: 800

loss:
  fine_l1_weight: 0.10
  fine_cos_weight: 0.18
  fine_grad_weight: 0.06
  fine_channel_std_weight: 0.06
  coarse_l1_weight: 0.05
  coarse_cos_weight: 0.10
  coarse_grad_weight: 0.01
  coarse_channel_std_weight: 0.03
  fine_coarse_ortho_weight: 0.02
  teacher_norm_weight: 0.02
  query_teacher_infonce_weight: 0.03
  infonce_temperature: 0.07
  infonce_samples: 768
  infonce_cross_batch: true

retrieval:
  enabled: false

map_supervision:
  enabled: true
  config_path: feature_field/configs/reconstruction_cambridge_oldhospital_processed_cached64_v10.yaml
  colmap_dir: /hy-tmp/Cambridge_stdloc/OldHospital/sparse/0
  cache_rendered: false
  trainable: true
  map_lr_scale: 0.015
  train_fine_decoder: true
  train_coarse_fusion: false
  train_feat_sharp: true
  train_fsm: true
  train_hash_mlp: false
  train_latent: false
  train_geometry: false
  detach_query_features: false
  alpha_threshold: 0.5
  coarse_start_epoch: 0
  depth_observability_weight: 0.5
  depth_observability_power: 1.0
  depth_observability_max: 4.0
  translation_observability_weight: 0.75
  translation_observability_mode: z
  translation_observability_power: 1.0
  translation_observability_max: 4.0
  query_fine_weight: 0.42
  query_fine_raw_weight: 0.05
  query_coarse_weight: 0.10
  query_fine_infonce_weight: 0.55
  query_coarse_infonce_weight: 0.16
  query_fine_grad_weight: 0.08
  query_coarse_grad_weight: 0.01
  rendered_teacher_fine_weight: 0.20
  rendered_teacher_fine_raw_weight: 0.05
  rendered_teacher_coarse_weight: 0.0
  rendered_teacher_fine_infonce_weight: 0.08
  rendered_teacher_coarse_infonce_weight: 0.0
  rendered_teacher_fine_grad_weight: 0.04
  rendered_teacher_coarse_grad_weight: 0.0
  infonce_temperature: 0.07
  infonce_samples: 1024
  infonce_cross_batch: true
  variance_target_std: 0.06
  query_variance_weight: 0.025
  map_variance_weight: 0.0
  query_covariance_weight: 0.006
  map_covariance_weight: 0.0
  query_corr_subpixel_weight: 0.75
  query_corr_flow_weight: 0.25
  query_corr_radius: 8
  query_corr_temperature: 0.05
  query_corr_huber_delta: 0.25
  query_flow_warp_weight: 0.75
  feature_metric_pose_weight: 0.15
  feature_metric_pose_damping: 0.01
  feature_metric_pose_update_scale: 1.0
  feature_metric_pose_rot_weight: 0.2
  feature_metric_pose_trans_weight: 50.0
  feature_metric_pose_normalize: true
  perturb_rank_weight: 1.0
  perturb_render_negatives: true
  perturb_rot_deg: 0.0
  perturb_trans_m: 0.0
  perturb_trans_cm_choices: [1.0, 2.0, 5.0, 10.0]
  perturb_frame: camera
  perturb_axes: [0, 1, 2]
  perturb_margin: 0.0002
  perturb_margin_per_m: 0.08

visualization:
  num_val_vis: 4
  save_root: /root/ICLPose/result/feature_extract/visualizations/feature_track
