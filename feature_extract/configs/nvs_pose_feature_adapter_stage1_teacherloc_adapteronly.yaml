# Stage 1A adapter-only feature-localizability check.
#
# This is the go/no-go experiment for the feature problem: the pair-conditioned
# matcher is disabled, so improvements must come from Q_loc and M_loc dot
# product localizability rather than a downstream heatmap decoder.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_teacherloc.yaml
exp_name: nvs_pose_feature_adapter_stage1_teacherloc_adapteronly

training:
  batch_size: 24
  validation_batch_size: 24
  max_steps: 160
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: nvs_teacher_patch_gap
  best_metric_mode: max

  pair_matcher_enabled: false
  pair_matcher_weight: 0.0

  pose_feature_adapter_hidden_dim: 128
  pose_feature_adapter_residual_scale: 0.5
  pose_feature_adapter_rgb_context_channels: 32
  pose_feature_adapter_texture_branch_enabled: true
  pose_feature_adapter_texture_branch_hidden_dim: 64
  pose_feature_adapter_texture_branch_scale: 0.5
  pose_feature_adapter_texture_branch_zero_init: true

  teacher_corr_weight: 1.0
  teacher_corr_local_patch_weight: 5.0
  align_weight: 0.2
  drift_weight: 0.005
  variance_weight: 0.02
