# POFD Stage 2d: NVS teacher-quality + pose-observability margin on q50.
#
# The latest ChatGPT-ICLPose.md asks for pose-observable localization features,
# not a standalone selector.  Empirically, pure GT-pose ranking/observability
# did not beat the previous q50 NVS teacher-quality run.  This config keeps the
# useful render-LoFTR/PnP candidate-quality supervision as NVS evidence while
# adding the candidate-internal pose margin, so the feature remains optimized
# for pose-observable matching rather than only reproducing a teacher score.

base_config: /root/ICLPose/feature_extract/configs/nvs_pose_feature_adapter_stage1_matchingloc_teacherquality_q50_paircorr_shuf.yaml
exp_name: pofd_stage2d_nvs_quality_pose_margin_q50_shuf

training:
  batch_size: 12
  validation_batch_size: 12
  max_steps: 80
  eval_every: 20

nvs_pose_feature_adapter:
  best_metric: pred_cost_m
  best_metric_mode: min
  resume_adapter_strict: false

  pose_feature_adapter_uncertainty_enabled: false
  score_use_uncertainty: false

  candidate_teacher_quality_weight: 1.0
  candidate_teacher_quality_target_mode: pnp_composite
  candidate_teacher_quality_temperature: 0.5
  candidate_teacher_quality_pairwise_weight: 0.25
  candidate_teacher_quality_pairwise_min_gap: 0.25

  candidate_observability_weight: 0.5
  candidate_observability_margin: 0.08
  candidate_observability_min_cost_gap_m: 0.12
  observability_contrast_weight: 0.0

  rank_ce_weight: 1.0
  rank_pairwise_weight: 0.5
  score_correction_cosine_weight: 0.5
  score_pose_improvement_weight: 0.5
  score_anti_identity_weight: 0.5

  pose_energy_enabled: false
  train_pose_energy_net: false
  train_pair_matcher: true
  train_pose_feature_adapter: true
