# Phase6-A3: train the projected fine metric on the same 0.25m/5deg
# candidate basin used by the K64 selector eval.  A2 used 2-10cm
# perturb negatives, which improved a small local lattice but did not transfer
# to 25cm K64 sorting.

base_config: /root/ICLPose/feature_extract/configs/cpr_phase6a2_metric_align_candidate_poseaware_sharedproj_w005_b4.yaml
exp_name: cpr_phase6a3_metric_align_candidate_bucket025_sharedproj_w010_b4

dataset:
  max_train_samples: 192
  max_val_samples: 32

training:
  batch_size: 4
  validation_batch_size: 2
  max_steps: 320
  lr: 0.00005
  log_every: 16
  best_metric: map_candidate_render_score_pred_trans_mm
  best_metric_mode: min

map_supervision:
  # Keep the dense GT-pose projected anchor, but avoid using large 25cm
  # flow as a local-correlation CE target.  The local-corr radius is too
  # small for that displacement; the K64 listwise candidate score is the
  # shaping signal in this stage.
  query_corr_ce_weight: 0.0
  query_corr_subpixel_weight: 0.0
  query_corr_peak_margin_weight: 0.0

  perturb_render_negatives: true
  perturb_pose_mode: se3
  perturb_direction_mode: random
  perturb_trans_cm_choices: [25.0]
  perturb_rot_deg_choices: [5.0]

  candidate_render_score_weight: 0.10
  candidate_render_score_feature: fine
  candidate_render_score_mode: local
  candidate_render_score_temperature: 0.05
  candidate_render_score_radius: 4
  candidate_render_score_preprocess: spatial_center
  candidate_render_score_rot_cost_weight: 0.1
  candidate_render_score_use_projector: true
  candidate_render_score_require_projector: true
  candidate_render_score_projector_chunk_size: 64
  candidate_render_score_max_candidates: 64
  candidate_render_include_aux: false
  candidate_render_pose_source: coarse_pose_lattice
  coarse_pose_lattice_base_source: rendered_map_pose_neg
  coarse_pose_lattice_trans_cm: [0.0, 5.0, 10.0, 25.0, 50.0]
  coarse_pose_lattice_rot_deg: [0.0, 1.0, 2.0, 5.0, 10.0]
  coarse_pose_lattice_direction_mode: cube
  coarse_pose_lattice_limit_strategy: uniform
  coarse_pose_lattice_max_candidates: 64
