exp_name: joint_radio_dcff_oh_v5l_pointwise_featsharp_full
output_dir: feature_extract/output

dataset:
  source_dir: dataset/OldHospital
  feature_dir: feature_extract/output/features_radio_dual/OldHospital
  train_split: dataset/OldHospital/dataset_train.txt
  val_split: dataset/OldHospital/dataset_test.txt
  image_patterns:
    - seq*/*.png
    - seq*/*.jpg
    - images/*.png
    - images/*.jpg
    - "*.png"
    - "*.jpg"
  patch_size: 16
  input_hw: [1088, 1920]
  feature_hw: [68, 120]
  cache_teacher: false
  fallback_val_ratio: 0.1
  max_train_samples: 128
  max_val_samples: 32
  synthetic_if_missing: false

model:
  feature_dim: 64
  base_channels: 32
  stage_dims: [32, 64, 96, 128]
  dropout: 0.0
  l2_normalize: true
  predict_magnitude: true
  fine_init_norm: 4.38
  coarse_init_norm: 25.50
  magnitude_min: 0.0001
  warmstart_strict: false

training:
  device: cuda
  seed: 42
  epochs: 6
  batch_size: 8
  num_workers: 4
  lr: 0.00008
  weight_decay: 0.00001
  grad_clip: 1.0
  amp: true
  log_every: 10
  save_every_epochs: 1
  val_every_epochs: 1
  max_steps: null

loss:
  fine_l1_weight: 1.0
  fine_cos_weight: 1.0
  coarse_l1_weight: 1.0
  coarse_cos_weight: 1.0
  teacher_norm_weight: 0.1
  query_teacher_infonce_weight: 0.0
  infonce_temperature: 0.07
  infonce_samples: 256

retrieval:
  enabled: true
  feature_dir: feature_extract/output/features_multiscale_compressed/OldHospital
  teacher_subdir: cls
  student_dim: 768
  hidden_dim: 256
  dropout: 0.0
  l2_normalize: true
  cache_teacher: false
  l1_weight: 1.0
  cos_weight: 1.0
  infonce_weight: 0.2
  similarity_weight: 1.0
  temperature: 0.07

map_supervision:
  enabled: true
  config_path: pose_refine/output/concat_loc_oh_v20d/config.yaml
  colmap_dir: dataset/OldHospital/sparse/0
  cache_rendered: true
  trainable: true
  map_lr_scale: 0.5
  hash_mlp_lr_scale: 0.05
  train_fine_decoder: true
  train_feat_sharp: true
  train_hash_mlp: false
  fine_decoder_override:
    type: pointwise
    hidden_dim: 128
    num_layers: 3
    use_viewdirs: false
  refiner_override:
    type: featsharp
  coarse_start_epoch: 999999
  query_fine_weight: 0.5
  query_fine_raw_weight: 0.15
  query_coarse_weight: 0.0
  rendered_teacher_fine_weight: 0.5
  rendered_teacher_fine_weight_end: 0.25
  rendered_teacher_fine_weight_anneal_epochs: 4
  rendered_teacher_fine_raw_weight: 0.25
  rendered_teacher_coarse_weight: 0.0

visualization:
  num_val_vis: 4
  save_root: feature_extract/output/visualizations/feature_track
