# v20k pilot: keep the strongest learned-map receiver from v20g,
# but swap in the newly exported v5g student query features.

exp_name: concat_loc_oh_v20k_v5g_student_querymap_adapt
output_dir: pose_refine/output

dataset:
  feature_dir: feature_extract/output/features_query_student_v5g/OldHospital
  colmap_dir: dataset/OldHospital/sparse/0
  source_dir: dataset/OldHospital
  train_split: dataset/OldHospital/dataset_train.txt
  test_split: dataset/OldHospital/dataset_test.txt
  cache_in_memory: true

dcff:
  checkpoint: feature_field/output/dcff_radio_oh_v10/checkpoints/best.pth
  joint_checkpoint: feature_extract/output/joint_radio_dcff_oh_v5d_joint_fine_schedule/checkpoints/best.pth
  ply_path: feature_gaussian/output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  feature_dim: 64
  latent_dim: 32
  render_width: 120
  render_height: 68
  finetune_decoder: true
  coarse_smoothing_kernel: 1

model:
  feature_dim: 64
  hidden_dim: 256
  irls_iters: 0
  use_coarse: true
  use_gru: true
  gru_iters: 8
  local_radius: 4
  proj_dim: 32
  proj_mode: shared
  full_wls: false
  flow_init: zero
  coarse_flow_init: true
  coarse_pool_factor: 4
  detach_trans: false
  detach_wls_rot: false
  rot_mode: mlp

training:
  epochs: 8
  batch_size: 12
  lr: 8.0e-6
  decoder_lr: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0

  noise_curriculum:
    rot_start_deg: 3.0
    rot_end_deg: 3.0
    trans_start_m: 0.10
    trans_end_m: 0.10
    warmup_epochs: 0

  loss:
    flow_weight: 5.0
    pose_weight: 1.0
    rot_loss_type: cosine
    trans_weight: 10.0
    conf_reg_weight: 0.05
    conf_nll_weight: 0.3
    direct_trans_loss: false
    feat_match_weight: 0.2

  phase1_epochs: 2
  outer_iters_train: 6
  outer_iters_val: 10

  val_every: 2
  save_every: 2
  save_epoch_checkpoints: false
  vis_every: 2
  num_vis_samples: 4

renderer:
  longest_edge: 1088
