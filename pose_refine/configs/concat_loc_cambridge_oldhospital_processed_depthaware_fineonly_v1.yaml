exp_name: concat_loc_cambridge_oldhospital_processed_depthaware_fineonly_v1
output_dir: /root/ICLPose/result/pose_refine

dataset:
  feature_dir: /root/ICLPose/result/feature_extract/features_radio_dual/cambridge_oldhospital_processed
  colmap_dir: /hy-tmp/Cambridge_stdloc/OldHospital/sparse/0
  source_dir: /hy-tmp/Cambridge_stdloc/OldHospital
  train_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_train.txt
  test_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_test.txt
  fine_hw: [68, 120]
  coarse_hw: [68, 120]
  cache_in_memory: true

dcff:
  checkpoint: /root/ICLPose/result/feature_field/dcff_cambridge_oldhospital_processed_cached64_v10_fine_stable_4gpu/checkpoints/best.pth
  ply_path: /root/ICLPose/result/feature_field/dcff_cambridge_oldhospital_processed_cached64_v10_fine_stable_4gpu/checkpoints/best.ply
  feature_dim: 64
  latent_dim: 64
  render_width: 120
  render_height: 68
  finetune_decoder: true
  finetune_fsm: false
  coarse_smoothing_kernel: 1

model:
  feature_dim: 64
  hidden_dim: 256
  irls_iters: 2
  robust_kernel: huber
  use_coarse: false
  use_gru: true
  gru_iters: 8
  local_radius: 4
  proj_dim: 32
  proj_mode: shared
  full_wls: true
  flow_init: small
  coarse_flow_init: true
  coarse_pool_factor: 4
  detach_trans: false
  detach_wls_rot: false
  rot_mode: wls
  use_two_stage_refine: false

training:
  epochs: 16
  batch_size: 6
  use_amp: true
  lr: 8.0e-6
  decoder_lr: 8.0e-7
  weight_decay: 1.0e-4
  grad_clip: 1.0

  noise_curriculum:
    rot_start_deg: 2.0
    rot_end_deg: 5.0
    trans_start_m: 0.30
    trans_end_m: 2.00
    warmup_epochs: 6
    rot_min_deg: 0.2
    trans_min_m: 0.05

  val_noise_deg: 5.0
  val_noise_m: 2.0

  loss:
    flow_weight: 5.0
    pose_weight: 1.0
    pose_loss_mode: lie
    rot_loss_type: cosine
    trans_weight: 10.0
    conf_reg_weight: 0.05
    conf_nll_weight: 0.3
    direct_trans_loss: false
    feat_match_weight: 0.2
    pose_rank_weight: 0.05
    pose_rank_margin: 0.05
    pose_rank_rot_deg: 2.0
    pose_rank_trans_m: 0.25

  phase1_epochs: 2
  map_finetune_start_epoch: 6
  pose_rank_start_epoch: 6
  outer_iters_train: 4
  outer_iters_val: 8

  val_every: 2
  save_every: 2
  save_epoch_checkpoints: false
  vis_every: 2
  num_vis_samples: 4

renderer:
  longest_edge: 640
