# v3: low-noise finetune from the v2 best checkpoint.
#
# Motivation:
# - v2 stabilized training and reached a much better best val checkpoint
# - after reaching full 3deg / 0.10m noise, validation mostly plateaued
# - the remaining gap appears to be last-mile pose tightening, not coarse recovery

exp_name: concat_loc_oh_v20k_v5l_pointwise_featsharp_full_fsm_v1_b4_bs4_v3_lownoise
output_dir: output/pose_refine

dataset:
  feature_dir: output/feature_extract/features_query_student_v5l_pointwise_featsharp_full_fsm_v1_b4/OldHospital
  colmap_dir: dataset/OldHospital/sparse/0
  source_dir: dataset/OldHospital
  train_split: dataset/OldHospital/dataset_train.txt
  test_split: dataset/OldHospital/dataset_test.txt
  cache_in_memory: true

dcff:
  checkpoint: output/feature_field/dcff_oldhospital_v15d_v14b_coarse_smooth_frozen/checkpoints/best.pth
  joint_checkpoint: output/feature_extract/joint_radio_dcff_oh_v5l_pointwise_featsharp_full_fsm_v1_b4/checkpoints/best.pth
  joint_override_components: [fsm, hash_grid_mlp]
  ply_path: output/feature_gaussian/joint_radio_dual_oldhospital_teacher_geom_v1/point_cloud/best/point_cloud.ply
  feature_dim: 64
  latent_dim: 32
  render_width: 120
  render_height: 68
  finetune_decoder: false
  finetune_fsm: false
  coarse_smoothing_kernel: 5

model:
  feature_dim: 64
  hidden_dim: 256
  irls_iters: 0
  use_coarse: true
  use_gru: true
  gru_iters: 8
  local_radius: 4
  proj_dim: 32
  proj_mode: shared
  full_wls: false
  flow_init: zero
  coarse_flow_init: true
  coarse_pool_factor: 4
  detach_trans: false
  detach_wls_rot: false
  rot_mode: mlp

training:
  epochs: 20
  batch_size: 8
  lr: 2.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  min_lr: 1.0e-6

  noise_curriculum:
    rot_start_deg: 0.5
    rot_end_deg: 1.5
    trans_start_m: 0.01
    trans_end_m: 0.05
    warmup_epochs: 6
    rot_min_deg: 0.1
    trans_min_m: 0.005

  loss:
    flow_weight: 5.0
    pose_weight: 1.0
    rot_loss_type: geodesic
    rot_weight: 50.0
    trans_weight: 10.0
    conf_reg_weight: 0.05
    conf_nll_weight: 0.3
    direct_trans_loss: false
    feat_match_weight: 0.0

  phase1_epochs: 0
  outer_iters_train: 6
  outer_iters_val: 10

  warmstart: output/pose_refine/concat_loc_oh_v20k_v5l_pointwise_featsharp_full_fsm_v1_b4_bs4_v2/checkpoints/best.pth

  val_every: 2
  save_every: 2
  save_epoch_checkpoints: true
  vis_every: 5
  num_vis_samples: 4
  val_noise_deg: 3.0
  val_noise_m: 0.10

renderer:
  longest_edge: 1088
