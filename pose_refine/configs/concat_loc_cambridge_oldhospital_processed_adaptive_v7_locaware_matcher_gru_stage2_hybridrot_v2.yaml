base_config: concat_loc_cambridge_oldhospital_processed_adaptive_v7_locaware_matcher_gru_safe_v1.yaml
exp_name: concat_loc_cambridge_oldhospital_processed_adaptive_v7_locaware_matcher_gru_stage2_hybridrot_v2

model:
  full_wls: true
  rot_mode: hybrid
  gru_iters: 2
  local_radius: 10
  pose_update_scale: 1.0

training:
  epochs: 12
  best_metric: joint_1deg_50mm
  batch_size: 1
  num_workers: 0
  lr: 2.0e-5
  min_lr: 1.0e-6
  decoder_lr: 0.0
  weight_decay: 1.0e-5
  grad_clip: 1.0

  noise_curriculum:
    rot_start_deg: 1.0
    rot_end_deg: 1.0
    trans_start_m: 0.05
    trans_end_m: 0.05
    warmup_epochs: 1
    rot_min_deg: 0.05
    trans_min_m: 0.005

  val_noise_deg: 1.0
  val_noise_m: 0.05
  val_seed: 12345

  loss:
    flow_weight: 30.0
    pose_weight: 0.25
    full_pose_weight: 0.05
    pose_loss_mode: compose
    rot_loss_type: geodesic
    rot_weight: 120.0
    trans_weight: 10.0
    conf_reg_weight: 0.01
    conf_nll_weight: 0.05
    conf_valid_weight: 0.1
    direct_trans_loss: false
    feat_match_weight: 0.0
    corr_feat_weight: 0.0
    corr_ce_weight: 0.0
    corr_subpixel_ce_weight: 0.0
    corr_flow_weight: 0.0
    pose_rank_weight: 0.0
    loc_rank_weight: 0.0
    feature_metric_weight: 0.0
    feature_metric_eval: true

  phase1_epochs: 0
  map_finetune_start_epoch: 999
  fsm_finetune_start_epoch: 999
  pose_rank_start_epoch: 999
  outer_iters_train: 1
  outer_iters_val: 1
  val_every: 1
  save_every: 1
  save_epoch_checkpoints: false
  vis_every: 0
  num_vis_samples: 0
