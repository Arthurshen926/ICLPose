exp_name: concat_loc_oh_v20k_v5l_pointwise_featsharp_full_fsm_v1_b4_matched_bs4
output_dir: output/pose_refine

dataset:
  feature_dir: output/feature_extract/features_query_student_v5l_pointwise_featsharp_full_fsm_v1_b4/OldHospital
  colmap_dir: dataset/OldHospital/sparse/0
  source_dir: dataset/OldHospital
  train_split: dataset/OldHospital/dataset_train.txt
  test_split: dataset/OldHospital/dataset_test.txt
  cache_in_memory: true

dcff:
  checkpoint: output/feature_field/dcff_oldhospital_v15d_v14b_coarse_smooth_frozen/checkpoints/best.pth
  joint_checkpoint: output/feature_extract/joint_radio_dcff_oh_v5l_pointwise_featsharp_full_fsm_v1_b4/checkpoints/best.pth
  ply_path: output/feature_gaussian/joint_radio_dual_oldhospital_teacher_geom_v1/point_cloud/best/point_cloud.ply
  feature_dim: 64
  latent_dim: 32
  render_width: 120
  render_height: 68
  finetune_decoder: true
  finetune_fsm: true
  coarse_smoothing_kernel: 5
  fine_decoder_override:
    type: pointwise
    hidden_dim: 128
    num_layers: 3
    use_viewdirs: false
  refiner_override:
    type: featsharp

model:
  feature_dim: 64
  hidden_dim: 256
  irls_iters: 0
  use_coarse: true
  use_gru: true
  gru_iters: 8
  local_radius: 4
  proj_dim: 32
  proj_mode: shared
  full_wls: false
  flow_init: zero
  coarse_flow_init: true
  coarse_pool_factor: 4
  detach_trans: false
  detach_wls_rot: false
  rot_mode: mlp

training:
  epochs: 8
  batch_size: 4
  lr: 8.0e-6
  decoder_lr: 1.0e-6
  fsm_lr: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0

  noise_curriculum:
    rot_start_deg: 3.0
    rot_end_deg: 3.0
    trans_start_m: 0.10
    trans_end_m: 0.10
    warmup_epochs: 0

  loss:
    flow_weight: 5.0
    pose_weight: 1.0
    rot_loss_type: cosine
    trans_weight: 10.0
    conf_reg_weight: 0.05
    conf_nll_weight: 0.3
    direct_trans_loss: false
    feat_match_weight: 0.2

  phase1_epochs: 2
  outer_iters_train: 6
  outer_iters_val: 10

  val_every: 2
  save_every: 2
  save_epoch_checkpoints: false
  vis_every: 2
  num_vis_samples: 4

renderer:
  longest_edge: 1088
