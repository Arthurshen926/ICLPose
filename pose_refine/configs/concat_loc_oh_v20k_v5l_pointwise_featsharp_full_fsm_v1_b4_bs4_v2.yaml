# v2: Fix training collapse from v1 (bs4) run where translation exploded at phase transition.
#
# Root causes fixed:
#   1. phase1_epochs: 2 caused loss spike when pose loss kicked in → set to 0
#   2. Decoder/FSM finetuning with unstable early gradients corrupted DCFF features
#      → freeze decoder & FSM initially (finetune_decoder: false, finetune_fsm: false)
#   3. Fixed high noise (3°/0.1m) from epoch 0 → use curriculum 1°→3° with 5-epoch warmup
#   4. cosine rot loss → geodesic for better small-angle gradients
#   5. rot_weight was implicit 1.0 → set to 50.0 to balance with trans_weight: 10.0
#   6. batch_size 4 too noisy → increase to 8
#   7. No min_lr → add min_lr: 1e-7
#   8. Warmstart from best.pth (epoch 0) of v1 run to keep the good flow-only baseline
#
# Strategy: Train pose head from strong flow-only init, keep decoder frozen,
# use noise curriculum, geodesic rotation loss, pose loss from epoch 0.

exp_name: concat_loc_oh_v20k_v5l_pointwise_featsharp_full_fsm_v1_b4_bs4_v2
output_dir: output/pose_refine

dataset:
  feature_dir: output/feature_extract/features_query_student_v5l_pointwise_featsharp_full_fsm_v1_b4/OldHospital
  colmap_dir: dataset/OldHospital/sparse/0
  source_dir: dataset/OldHospital
  train_split: dataset/OldHospital/dataset_train.txt
  test_split: dataset/OldHospital/dataset_test.txt
  cache_in_memory: true

dcff:
  checkpoint: output/feature_field/dcff_oldhospital_v15d_v14b_coarse_smooth_frozen/checkpoints/best.pth
  joint_checkpoint: output/feature_extract/joint_radio_dcff_oh_v5l_pointwise_featsharp_full_fsm_v1_b4/checkpoints/best.pth
  joint_override_components: [fsm, hash_grid_mlp]
  ply_path: output/feature_gaussian/joint_radio_dual_oldhospital_teacher_geom_v1/point_cloud/best/point_cloud.ply
  feature_dim: 64
  latent_dim: 32
  render_width: 120
  render_height: 68
  finetune_decoder: false
  finetune_fsm: false
  coarse_smoothing_kernel: 5

model:
  feature_dim: 64
  hidden_dim: 256
  irls_iters: 0
  use_coarse: true
  use_gru: true
  gru_iters: 8
  local_radius: 4
  proj_dim: 32
  proj_mode: shared
  full_wls: false
  flow_init: zero
  coarse_flow_init: true
  coarse_pool_factor: 4
  detach_trans: false
  detach_wls_rot: false
  rot_mode: mlp

training:
  epochs: 30
  batch_size: 8
  lr: 5.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  min_lr: 1.0e-7

  noise_curriculum:
    rot_start_deg: 1.0
    rot_end_deg: 3.0
    trans_start_m: 0.03
    trans_end_m: 0.10
    warmup_epochs: 5
    rot_min_deg: 0.3
    trans_min_m: 0.01

  loss:
    flow_weight: 5.0
    pose_weight: 1.0
    rot_loss_type: geodesic
    rot_weight: 50.0
    trans_weight: 10.0
    conf_reg_weight: 0.05
    conf_nll_weight: 0.3
    direct_trans_loss: false
    feat_match_weight: 0.0

  phase1_epochs: 0
  outer_iters_train: 6
  outer_iters_val: 10

  warmstart: output/pose_refine/concat_loc_oh_v20k_v5l_pointwise_featsharp_full_fsm_v1_b4_bs4/checkpoints/best.pth

  val_every: 2
  save_every: 2
  save_epoch_checkpoints: true
  vis_every: 5
  num_vis_samples: 4

renderer:
  longest_edge: 1088
