exp_name: concat_loc_cambridge_oldhospital_processed_adaptive_v7_locaware_matcher_gru_safe_v1
output_dir: /root/ICLPose/result/pose_refine

dataset:
  feature_dir: /root/ICLPose/result/feature_extract/features_query_adaptive_v7_locaware_matcher_v1/cambridge_oldhospital_processed
  colmap_dir: /hy-tmp/Cambridge_stdloc/OldHospital/sparse/0
  source_dir: /hy-tmp/Cambridge_stdloc/OldHospital
  train_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_train.txt
  test_split: /hy-tmp/Cambridge_stdloc/OldHospital/dataset_test.txt
  fine_hw: [272, 480]
  coarse_hw: [34, 60]
  cache_in_memory: false

dcff:
  checkpoint: /root/ICLPose/result/feature_field/dcff_cambridge_oldhospital_processed_adaptive_bottleneck_v7_finecap_edge_gpu0_b16/checkpoints/best.pth
  ply_path: /root/ICLPose/result/feature_field/dcff_cambridge_oldhospital_processed_adaptive_bottleneck_v7_finecap_edge_gpu0_b16/checkpoints/best.ply
  feature_dim: 96
  fine_feature_dim: 96
  coarse_feature_dim: 32
  latent_dim: 48
  fine_latent_dim: 32
  coarse_latent_dim: 16
  render_width: 480
  render_height: 272
  finetune_decoder: false
  finetune_fsm: false
  coarse_smoothing_kernel: 3

model:
  feature_dim: 96
  hidden_dim: 192
  irls_iters: 2
  robust_kernel: huber
  use_coarse: false
  use_gru: true
  use_corr_wls: false
  gru_iters: 2
  local_radius: 10
  proj_dim: 48
  proj_mode: shared
  corr_wls_temperature: 0.05
  full_wls: true
  flow_init: small
  coarse_flow_init: false
  coarse_pool_factor: 4
  detach_wls_rot: false
  rot_mode: wls
  use_two_stage_refine: false
  pose_update_scale: 1.0
  local_matcher_enabled: true
  local_matcher_hidden_dim: 64
  local_matcher_zero_init: true
  local_matcher_residual_scale: 1.0
  local_matcher_init_checkpoint: /root/ICLPose/result/feature_extract/joint_radio_dcff_cambridge_oldhospital_processed_adaptive_v7_stagea_locaware_matcher_v1/checkpoints/best.pth

training:
  epochs: 8
  batch_size: 1
  num_workers: 0
  use_amp: true
  lr: 4.0e-5
  min_lr: 1.0e-6
  decoder_lr: 0.0
  weight_decay: 1.0e-5
  grad_clip: 1.0

  noise_curriculum:
    rot_start_deg: 1.0
    rot_end_deg: 1.0
    trans_start_m: 0.05
    trans_end_m: 0.05
    warmup_epochs: 1
    rot_min_deg: 0.05
    trans_min_m: 0.005

  val_noise_deg: 1.0
  val_noise_m: 0.05
  val_seed: 12345

  loss:
    flow_weight: 40.0
    pose_weight: 0.05
    pose_loss_mode: compose
    rot_loss_type: cosine
    trans_weight: 20.0
    conf_reg_weight: 0.01
    conf_nll_weight: 0.05
    conf_valid_weight: 0.1
    direct_trans_loss: false

    feat_match_weight: 0.0
    corr_feat_weight: 0.0
    corr_ce_weight: 0.0
    corr_subpixel_ce_weight: 0.0
    corr_flow_weight: 0.0

    pose_rank_weight: 0.0
    loc_rank_weight: 0.0
    loc_rank_start_epoch: 999
    feature_metric_weight: 0.0
    feature_metric_start_epoch: 999
    feature_metric_eval: true

  phase1_epochs: 2
  map_finetune_start_epoch: 999
  fsm_finetune_start_epoch: 999
  pose_rank_start_epoch: 999
  outer_iters_train: 1
  outer_iters_val: 1

  val_every: 1
  save_every: 1
  save_epoch_checkpoints: false
  vis_every: 0
  num_vis_samples: 0

renderer:
  longest_edge: 640
