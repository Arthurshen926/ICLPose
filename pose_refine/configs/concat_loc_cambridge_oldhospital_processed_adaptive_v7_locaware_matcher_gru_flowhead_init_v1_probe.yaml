base_config: concat_loc_cambridge_oldhospital_processed_adaptive_v7_locaware_matcher_gru_stage2_hybridrot_v7_rotcont.yaml
exp_name: concat_loc_cambridge_oldhospital_processed_adaptive_v7_locaware_matcher_gru_flowhead_init_v1_probe

model:
  full_wls: true
  rot_mode: hybrid
  use_gru: true
  gru_iters: 2
  local_radius: 10
  pose_update_scale: 1.0
  local_flow_head_enabled: true
  local_flow_head_hidden_dim: 96
  local_flow_head_zero_init: true
  local_flow_head_max_flow: 10.0
  local_flow_head_base_flow_mode: none
  local_flow_head_base_temperature: 0.05

training:
  epochs: 4
  best_metric: joint_1deg_50mm
  batch_size: 1
  num_workers: 0
  lr: 5.0e-6
  min_lr: 5.0e-7
  max_train_batches: 192
  max_val_batches: 64
  save_every: 1
  save_epoch_checkpoints: false
