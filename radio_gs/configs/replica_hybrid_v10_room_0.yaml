# RADIO-GS V10 Hybrid: warmstarted V9 + depth-gradient-guided refiner
exp_name: "radio_gs_room0_hybrid_v10"
output_dir: "output/radio_gs/room0_hybrid_v10"
seed: 42

# Scene
scene: "room_0"
ply_path: "output/2dgs_models/room_0/v8_fixed_poses/point_cloud/iteration_30000/point_cloud.ply"

# RADIO
radio_version: "c-radio_v4-h"
radio_repo: "/root/RADIO"
radio_feature_dim: 1280

# Architecture — upgraded from v8
architecture: "hybrid"
hybrid_latent_dim: 32
hash_levels: 16
hash_features_per_level: 4
hash_log2_size: 19
hash_base_resolution: 16
hash_max_resolution: 2048
hash_output_dim: 96
fine_dim: 96
coarse_dim: 96
hybrid_output_dim: 192

# Training mode
train_mode: "decoded"

# HCD Codec — symmetric encoder/decoder
bottleneck_dim: 192
dual_stream: true
symmetric_decoder: true

# Self-rendered RGB + depth-gradient-guided refiner
use_refiner: true
refiner_hidden_dim: 256
refiner_num_blocks: 8
refiner_dropout: 0.1
refiner_rgb_guide: true
refiner_depth_guide: true
refiner_depth_grad: true
refiner_depth_grad_scale: 10.0
refiner_norm_type: "gn"
self_guided: true
lr_refiner: 3.0e-4

# FeatSharp
featsharp_mode: "analytical"
featsharp_strength: 0.3

# Rendering
image_height: 480
image_width: 640
fx: 320.0
fy: 320.0
cx: 319.5
cy: 239.5
feature_height: 60
feature_width: 80
max_channels_per_chunk: 32
use_2dgs: true

# Training — warmstart from V9 best checkpoint
epochs: 120
batch_size: 2
lr_features: 1.0e-4
lr_hash: 1.5e-4
lr_decoder: 5.0e-5
lr_heads: 6.0e-5
weight_decay: 1.0e-4
grad_clip: 5.0
warmup_epochs: 4
scheduler: "cosine"
resume_from: "output/radio_gs/room0_hybrid_v9/checkpoints/best.pth"

# Loss weights — upgraded
l2_weight: 1.0
cosine_weight: 2.0
adaptor_weight: 0.5
tv_weight: 0.03
feat_norm_weight: 0.0
depth_loss_weight: 0.2
geom_depth_loss_weight: 0.1
geom_depth_detach: false
depth_alpha_threshold: 0.05
depth_head_type: "mlp"
depth_head_hidden_dim: 256
depth_head_num_layers: 3

# Gradient-weighted distillation loss for sharp boundaries
gradient_loss_weight: 0.5
gradient_loss_type: "sobel"

# Depth-guided feature smoothness — geometry edges guide feature edges
depth_guided_feature_weight: 0.3

# Geometric depth loss type — Berhu for better edge handling
geom_depth_supervision_loss_type: "berhu"

# Segmentation auxiliary — stronger
seg_loss_weight: 0.3
seg_head_type: "mlp"
seg_head_hidden_dim: 256
seg_head_num_layers: 3
seg_loss_type: "ce"
seg_ignore_index: 255

# Data
feature_dir: "output/radio_features_1280d/room_0/Sequence_1"
depth_dir: "dataset/room_0/Sequence_1/depth"
semantics_dir: "dataset/room_0/Sequence_1/semantic_class"
train_split: "Sequence_1"
val_split: "Sequence_2"
num_workers: 4

# Downstream tasks
seg_num_classes: 101

# Checkpointing
save_every: 10
eval_every: 5
log_every: 50
