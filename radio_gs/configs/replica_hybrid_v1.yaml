# RADIO-GS Hybrid V1: 16d per-Gaussian + hash grid decoding
# Experiment: Compare explicit 64d (V11) vs hybrid 16d + spatial hash grid
# Hypothesis: Hash grid provides spatial interpolation that may generalize
# better to novel viewpoints than per-Gaussian-only features.
#
# Architecture: 16d per-Gaussian latent (rendered via alpha-blending)
#             + SpatialHashField (16 levels, 48d output)
#             → FineDecoder(16→64) + CoarseDecoder(48→64) → FusionHead(128→128)
#             → HCD Decoder(128→1280d)
exp_name: "radio_gs_room0_hybrid_v1"
output_dir: "output/radio_gs/room0_hybrid_v1"
seed: 42

# Scene
scene: "room_0"
ply_path: "output/2dgs_models/room_0/v8_fixed_poses/point_cloud/iteration_30000/point_cloud.ply"

# RADIO
radio_version: "c-radio_v4-h"
radio_repo: "/root/RADIO"
radio_feature_dim: 1280

# Architecture — Hybrid (16d Gaussian + Hash Grid)
architecture: "hybrid"
hybrid_latent_dim: 16
hash_levels: 16
hash_features_per_level: 2
hash_log2_size: 19
hash_base_resolution: 16
hash_max_resolution: 2048
hash_output_dim: 48
fine_dim: 64
coarse_dim: 64
hybrid_output_dim: 128

# Training mode: supervise in decoded 1280d space
train_mode: "decoded"

# HCD Codec (128d hybrid output → 1280d RADIO space)
bottleneck_dim: 128
dual_stream: true

# Self-rendered RGB-guided screen-space refiner
use_refiner: true
refiner_hidden_dim: 128
refiner_num_blocks: 4
refiner_dropout: 0.1
refiner_rgb_guide: true
refiner_norm_type: "gn"
self_guided: true
lr_refiner: 2.0e-4

# FeatSharp
featsharp_mode: "analytical"
featsharp_strength: 0.3

# Rendering — 2DGS surfels
image_height: 480
image_width: 640
fx: 320.0
fy: 320.0
cx: 319.5
cy: 239.5
feature_height: 30
feature_width: 40
max_channels_per_chunk: 32
use_2dgs: true

# Training
epochs: 100
batch_size: 4
lr_features: 5.0e-4
lr_decoder: 5.0e-5
lr_hash: 1.0e-3
weight_decay: 1.0e-4
grad_clip: 5.0
warmup_epochs: 5
scheduler: "cosine"

# Loss weights
l2_weight: 1.0
cosine_weight: 3.0
adaptor_weight: 0.5
tv_weight: 0.05
feat_norm_weight: 0.0

# Data — standard Seq1/Seq2 split (same as V11 for fair comparison)
feature_dir: "output/radio_features_1280d/room_0/Sequence_1"
depth_dir: "dataset/room_0/Sequence_1/depth"
semantics_dir: "dataset/room_0/Sequence_1/semantic_class"
train_split: "Sequence_1"
val_split: "Sequence_2"
num_workers: 4

# Downstream tasks
seg_num_classes: 101

# Checkpointing
save_every: 10
eval_every: 5
log_every: 50
