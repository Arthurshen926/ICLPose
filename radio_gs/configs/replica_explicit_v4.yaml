# RADIO-GS V4: Combined latent + decoded training
# Key insight: latent-only (V3) gets high latent cosine but poor decoded cosine
# because rendered features drift from encoder distribution.
# V4 uses primary latent loss + secondary decoded loss with slow decoder fine-tuning.
exp_name: "radio_gs_room0_explicit_v4"
output_dir: "output/radio_gs/room0_explicit_v4"
seed: 42

# Scene
scene: "room_0"
ply_path: "output/2dgs_models/room_0/v6_sfm/point_cloud/iteration_30000/point_cloud.ply"

# RADIO
radio_version: "c-radio_v4-h"
radio_repo: "/root/RADIO"
radio_feature_dim: 1280

# Architecture
architecture: "explicit"
latent_dim: 64

# Training mode: decoded (train through decoder, with latent auxiliary)
train_mode: "decoded"

# HCD Codec
bottleneck_dim: 64
dual_stream: true

# FeatSharp
featsharp_mode: "analytical"
featsharp_strength: 0.3

# Rendering — 2DGS surfels
image_height: 480
image_width: 640
fx: 320.0
fy: 320.0
cx: 319.5
cy: 239.5
feature_height: 30
feature_width: 40
max_channels_per_chunk: 32
use_2dgs: true

# Training — slower LR, more epochs
epochs: 200
batch_size: 4
lr_features: 5.0e-4
lr_decoder: 2.0e-5
weight_decay: 1.0e-4
grad_clip: 5.0
warmup_epochs: 10
scheduler: "cosine"

# Loss weights — higher cosine + TV + compact matching
l2_weight: 1.0
cosine_weight: 2.0
adaptor_weight: 1.0
tv_weight: 0.1
feat_norm_weight: 0.0

# Data — 1280d features (decoded mode needs full features)
feature_dir: "output/radio_features_1280d/room_0/Sequence_1"
depth_dir: "dataset/room_0/Sequence_1/depth"
semantics_dir: "dataset/room_0/Sequence_1/semantic_class"
train_split: "Sequence_1"
val_split: "Sequence_2"
num_workers: 4

# Downstream tasks
depth_head_type: "mlp"
seg_num_classes: 101
seg_head_type: "mlp"
grounding_use_adaptor: true

# Checkpointing
save_every: 10
eval_every: 5
log_every: 50
