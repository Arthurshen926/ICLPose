name: iclpose
channels:
  - pytorch
  - nvidia/label/cuda-11.8.0
  - conda-forge
  - defaults

# ============================================================
# 安装顺序说明:
#   1. conda 创建环境 + 安装 Python
#   2. pip 安装 PyTorch (指定 cu118 index)
#   3. pip 安装纯 Python 依赖
#   4. 源码编译安装 CUDA 扩展 (需要 nvcc 11.8)
#   5. 源码编译安装 detectron2 生态
#   6. .pth 方式安装 mask2former / ODISE
#
# 快速复现: 见 docs/ENVIRONMENT_SETUP_GUIDE.md
# ============================================================

dependencies:
  # ── conda 管理的包 ──
  - python=3.9
  - pip

  # CUDA 编译工具链 (系统只有 11.6, 需要 11.8 支持 RTX 4090 sm_89)
  - nvidia/label/cuda-11.8.0::cuda-nvcc=11.8.89

  # ── pip 管理的包 ──
  - pip:
      # --- PyTorch (必须指定 --index-url, conda env create 不支持, 需手动安装) ---
      # pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118

      # --- 核心科学计算 ---
      - numpy==1.23.5
      - scipy==1.13.1
      - PyYAML==6.0.3
      - tqdm==4.67.3
      - Pillow==9.5.0
      - matplotlib==3.9.4
      - scikit-learn==1.6.1
      - opencv-python==4.8.1.78
      - tensorboard==2.20.0
      - requests

      # --- 深度学习工具 ---
      - einops==0.3.0
      - munch==4.0.0
      - kornia==0.6.12
      - timm==1.0.25
      - torchmetrics==0.6.0
      - transformers==4.26.1
      - wandb

      # --- 3D / 几何 ---
      - open3d==0.17.0
      - plyfile==1.1.3
      - trimesh==4.11.0

      # --- 3DGS 渲染 ---
      - gsplat==1.4.0

      # --- detectron2 生态 ---
      - fvcore==0.1.5.post20221221
      - iopath==0.1.9
      - pycocotools==2.0.11
      - ninja==1.13.0

      # --- ODISE 额外依赖 ---
      - open-clip-torch==3.3.0
      - ftfy==6.3.1
      - regex

      # ============================================================
      # 以下包需要源码编译, 无法通过 pip install 直接安装:
      #
      # diff-gaussian-rasterization  (from GitHub, CUDA 编译)
      # simple-knn                   (from GitHub, CUDA 编译)
      # tinycudann                   (from GitHub, CUDA 编译)
      # detectron2==0.6              (from GitHub, CUDA 编译)
      # mask2former                  (通过 .pth 文件挂载)
      # odise                        (通过 .pth 文件挂载)
      #
      # 详见 docs/ENVIRONMENT_SETUP_GUIDE.md 的 Step 4-6
      # ============================================================
