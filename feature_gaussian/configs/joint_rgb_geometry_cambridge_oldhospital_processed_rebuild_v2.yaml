exp_name: joint_rgb_geometry_cambridge_oldhospital_processed_rebuild_v2

dataset:
  type: cambridge
  source_dir: /hy-tmp/Cambridge_stdloc/OldHospital
  images: processed
  feature_dir: /root/ICLPose/result/feature_extract/features_radio_dual/cambridge_oldhospital_processed
  feature_scales:
    - fine_geo
    - coarse_sem

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 12000
  longest_edge: 0
  eval_interval: 1000
  save_interval: 2000
  vis_frames: [0, 8, 16, 24]
  init_ply: ''
  freeze_geometry: false

  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  feature_embedding_lr: 0.01
  feature_weight: 0.0
  feature_cos_weight: 0.5
  feature_start_iter: 999999
  detach_feat_geometry: true

  lambda_dssim: 0.2
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  mono_depth_dir: ''
  lambda_depth: 0.0
  depth_start_iter: 999999
  depth_warmup_iters: 1

  densify_from_iter: 300
  densify_until_iter: 8000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01
  size_threshold: null
  max_gaussians: 500000

  use_mask: true
  mask_path: /hy-tmp/Cambridge_stdloc/OldHospital/processed/masks.pkl
  use_appearance: false
  use_transient: false
  semantic_mask_dir: ''
  vegetation_reg_scale: 1.0
  veg_prune_opacity: 0.0
  grad_accum_steps: 1

output_dir: /root/ICLPose/result/feature_gaussian
