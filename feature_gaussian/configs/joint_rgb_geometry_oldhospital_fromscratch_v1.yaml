exp_name: joint_rgb_geometry_oldhospital_fromscratch_v1

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: feature_extract/output/features_radio_dual/OldHospital_pilot
  feature_scales:
    - fine_geo
    - coarse_sem

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 30000
  longest_edge: 1280
  eval_interval: 5000
  save_interval: 5000
  vis_frames: [0, 8, 16, 24]
  init_ply: ''
  freeze_geometry: false

  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  feature_embedding_lr: 0.01
  feature_weight: 0.0
  feature_cos_weight: 0.5
  feature_start_iter: 999999
  detach_feat_geometry: true

  lambda_dssim: 0.2
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  mono_depth_dir: ''
  lambda_depth: 0.0
  depth_start_iter: 3000
  depth_warmup_iters: 2000

  densify_from_iter: 999999
  densify_until_iter: 0
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 999999
  opacity_reset_value: 0.01
  size_threshold: null
  max_gaussians: 500000

  use_mask: false
  mask_path: ''
  use_appearance: false
  use_transient: false
  semantic_mask_dir: ''
  vegetation_reg_scale: 1.0
  veg_prune_opacity: 0.0
  grad_accum_steps: 1

output_dir: feature_gaussian/output
