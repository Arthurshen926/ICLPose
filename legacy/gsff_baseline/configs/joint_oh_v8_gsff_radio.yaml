# Joint 2DGS + GSFF Triplane + Raw RADIO — OldHospital v8
# ========================================================
# 联合训练: 2DGS几何重建 + GSFF triplane/encoder特征学习 + 原始RADIO 1280d监督
#
# 核心创新:
#   1. 使用原始1280d RADIO特征(不做PCA降维)作为特征监督
#   2. GSFF triplane (16d) + DualScaleEncoder 做自监督对比学习
#   3. 通过 projection head (16d → 1280d) 桥接triplane到RADIO空间
#   4. 2DGS几何同时训练(v7 recipe: mask + appearance + transient + depth)
#
# 架构:
#   2DGS: 几何(xyz, rotation, scaling, opacity) + 外观(SH RGB)
#   Triplane: DualScaleTriplane(coarse=256, fine=1024, dim=16)
#   Encoder: DualScaleEncoder(dim=16, DINOv2 frozen backbone)
#   RadioProj: MLP(16 → 128 → 256 → 1280)
#
# 损失函数:
#   L_rgb: L1 + SSIM (geometry)
#   L_depth: Pearson correlation (monocular depth, exclude vegetation)
#   L_nce: Symmetric pixel-level InfoNCE (encoder vs rendered triplane)
#   L_pro: Prototypical contrastive loss
#   L_ce: Segmentation cross-entropy alignment
#   L_radio: L1 + cosine (projected triplane vs raw RADIO 1280d)
#   L_tvl: Total variation on triplane grids
#   L_reg: Normal + distortion + scale (2DGS geometry)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=2 python legacy/gsff_baseline/scripts/train_joint_gsff_radio.py \
#     --config legacy/gsff_baseline/configs/joint_oh_v8_gsff_radio.yaml

exp_name: joint_oh_v8_gsff_radio

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  # Raw 1280d RADIO features (no PCA)
  radio_feature_dir: output/features_radio/OldHospital_raw
  radio_feature_scale: fine_radio

model:
  sh_degree: 3
  white_background: false

# GSFF triplane + encoder settings
gsff:
  feature_dim: 16
  coarse_resolution: 256
  fine_resolution: 1024
  n_clusters: 34
  temperature: 0.07
  nce_samples: 1024
  cosine_loss_weight: 0.5
  prototype_update_freq: 500
  # Radio projection head
  radio_proj_hidden: [128, 256]
  # Loss weights
  weight_nce: 0.5
  weight_pro: 0.5
  weight_ce: 0.5
  weight_radio: 0.3
  weight_tvl: 0.1
  # Phase timing (relative to geometry iterations)
  gsff_start_iter: 2000
  fine_start_iter: 8000
  # Learning rates
  lr_triplane: 0.001
  lr_encoder: 0.0001
  lr_radio_proj: 0.0005

training:
  iterations: 40000
  longest_edge: 0
  eval_interval: 2000
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # 2DGS geometry learning rates (v7 recipe)
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision
  mono_depth_dir: output/oh_depth_local/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000
  depth_exclude_vegetation: true

  # Densification
  densify_from_iter: 500
  densify_until_iter: 25000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 6000
  opacity_reset_value: 0.01

  # Sky / object masking (v7)
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork (v7)
  use_appearance: true
  appearance_embed_dim: 32
  appearance_lr: 0.001
  appearance_reg: 0.0
  appearance_mean_reg: 0.01

  # Transient mask (v7)
  use_transient: true
  transient_lr: 0.001
  transient_reg: 0.01

  # Semantic-guided regularization (v7)
  semantic_mask_dir: dataset/OldHospital/semantic_masks
  vegetation_reg_scale: 0.3
  vegetation_scale_boost: 3.0
  veg_prune_opacity: 0.15
  veg_prune_scale_percentile: 95
  depth_exclude_vegetation: true

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/joint_gsff_radio
