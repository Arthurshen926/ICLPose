# exp107 — stairs with architectural improvements
# Key changes from exp101/106:
#   1. fine_iters: 12 (vs 8) — more GRU refinement iterations
#   2. geometry_upsample: 2 — solve geometry at 138×182 instead of 69×91
#   3. mid_iters: 2 (vs 1) — extra mid-scale refinement
#   4. Soft gradient clamp in geometry solver (code change)
# Warmstart from exp101 best (1.26° train val, 0.527° deterministic)
exp_name: exp107_stairs_fi12_geoup
output_dir: output/exp107_stairs_fi12_geoup

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 12
  mid_iters: 2
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [69, 91]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 3
  geometry_upsample: 2

renderer:
  ply_path: output/2dgs_models/stairs/v5_minN/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/stairs_v4_stride7/per_scale/coarse.pth
    mid:       output/feature_3dgs/stairs_v4_stride7/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/stairs_v4_stride7/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/stairs_v4_stride7/per_scale/fine_dino.pth

data:
  train_traj_path: dataset/stairs/seq-02/traj_w_c.txt
  train_feature_dir: output/features_multiscale_stride7_compressed/stairs_seq02
  val_split_ratio: 0.1
  batch_size: 8
  val_batch_size: 2
  num_workers: 4
  noise_rot_deg: 8.0
  noise_trans_m: 0.25

training:
  epochs: 120
  lr: 0.0001
  min_lr: 1.0e-06
  weight_decay: 0.0001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 10
  val_outer_iters: 10
  phase1_epochs: 0

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    use_huber: true
    huber_delta: 0.5
    conf_reg_weight: 0.01
    conf_coverage_range: [0.05, 0.95]

  scheduler:
    type: cosine
    warmup_epochs: 5
    T_max: 120
