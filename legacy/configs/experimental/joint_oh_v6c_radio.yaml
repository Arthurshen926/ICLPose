# Joint 2DGS Geometry + RADIO Feature — OldHospital  v6c-RADIO
# =============================================================
# 精准修复版: 基于v5配置, 仅添加植被特定优化
#   - 在v5基础上最小化修改, 保持PSNR
#   - 不使用 size_threshold (户外场景下0.1*extent过于激进)
#   - 在植被区域排除深度监督 (新核心改进)
#   - 启用温和的植被剪枝
#   - 略微增强植被区域正则化
#
# v5 baseline: iter 12k PSNR=15.61, N=69,911
# v6 试验:     强正则→PSNR=13.02 ✗
# v6b 试验:    中等正则→PSNR=14.37, 仍受size_threshold影响 ✗
# v6c 策略:    v5 + 植被特定修复 → 目标PSNR≥15.5 + 更好几何
#
# Usage:
#   CUDA_VISIBLE_DEVICES=3 python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v6c_radio.yaml

exp_name: joint_oh_v6c_radio

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_radio/OldHospital_indexed
  feature_scales:
    - fine_radio

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 40000
  longest_edge: 0
  eval_interval: 1000
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # Learning rates — SAME AS v5
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding — SAME AS v5
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss — SAME AS v5
  lambda_dssim: 0.2

  # 2DGS geometry regularization — SAME AS v5
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision — SAME AS v5 BUT exclude vegetation
  mono_depth_dir: output/oh_depth_local/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000
  depth_exclude_vegetation: true  # ← 关键改进: 排除植被区域的深度监督

  # Densification — SAME AS v5
  densify_from_iter: 500
  densify_until_iter: 25000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 6000
  opacity_reset_value: 0.01
  size_threshold: null           # 保持null! 户外场景下全局size剪枝有害
  max_gaussians: 0               # 不设上限

  # Sky / object masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork
  use_appearance: true
  appearance_embed_dim: 32
  appearance_lr: 0.001
  appearance_reg: 0.0
  appearance_mean_reg: 0.01

  # Transient mask
  use_transient: true
  transient_lr: 0.001
  transient_reg: 0.01

  # Semantic-guided regularization — TARGETED improvements
  semantic_mask_dir: dataset/OldHospital/semantic_masks
  vegetation_reg_scale: 0.2     # v5=0.1 → v6c: 2x更强, 但不过度
  vegetation_scale_boost: 1.5   # NEW: 植被区域scale正则温和boost
  veg_prune_opacity: 0.03      # v5=0.0 → v6c: 温和植被剪枝

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
