# ============================================================
#  exp083_stairs_optimized.yaml
#  Stairs: Apply room_0 proven recipe (oi=5, gamma=0.95, IRLS)
#  Key changes vs exp034:
#    - outer_iters: 3 → 5 (room_0 recipe)
#    - gamma: 0.8 → 0.95 (enables composable iterations)
#    - irls_iters: 3 (better outlier rejection)
#    - fine_iters: 8 → 12 (more refinement)
#    - batch_size: 2 → 8 (maximize GPU utilization)
#    - conf_coverage_range: [0.05, 0.95] (gamma=0.95 compatible)
#    - epochs: 200 (longer training)
#    - Train from scratch (fresh start with proven recipe)
# ============================================================

exp_name: exp083_stairs_optimized
output_dir: output/exp083_stairs_optimized

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 12
  mid_iters: 3
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [35, 46]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 3

renderer:
  ply_path: output/2dgs_models/stairs/v5_minN/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/stairs_v3/per_scale/coarse.pth
    mid:       output/feature_3dgs/stairs_v3/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/stairs_v3/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/stairs_v3/per_scale/fine_dino.pth
  img_height: 480
  img_width: 640
  fx: 525.505
  fy: 525.505
  cx: 320.0
  cy: 240.0

data:
  train_feature_dir: output/features_multiscale_compressed/stairs_seq02
  train_traj_path: dataset/stairs/seq-02/traj_w_c.txt
  train_depth_dir: output/depth_links/stairs_seq02

  val_feature_dir: null
  val_split_ratio: 0.1

  noise_rot_deg: 8.0
  noise_trans_m: 0.15
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.15

  batch_size: 8
  val_batch_size: 8
  num_workers: 4

training:
  epochs: 200
  phase1_epochs: 3
  lr: 0.0001
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 5
  val_outer_iters: 10

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: false

  pose_warmup:
    enabled: true
    warmup_epochs: 3
    min_weight: 0.1
