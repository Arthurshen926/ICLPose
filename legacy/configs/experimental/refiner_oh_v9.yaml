# ============================================================
#  refiner_oh_v9.yaml
#  PoseRefiner V9: radius=8 + multi-iteration training
#
#  Combines V8's large capture range (radius=8 → ±4° at 68×120)
#  with V6's multi-iteration training (outer_iters=3).
#
#  V8 (r=8, iters=1) showed multi-iter CONVERGENCE tendency at
#  E002-E003, unlike all r=4 models which diverge.
#  V6 (r=4, iters=3) achieved STABLE monotonic convergence
#  (8° N=7 → 7.20°, no divergence).
#
#  V9 hypothesis: r=8's wider capture range will give V6-like
#  stability but with MUCH faster per-step convergence.
#
#  Memory: radius=8 unfold is expensive (~13GB at B=2 single-iter).
#  With outer_iters=3, we may need B=1 or gradient accumulation.
#  Start with B=1, outer_iters=2 to fit in 24GB.
#
#  Training:
#    CUDA_VISIBLE_DEVICES=0 python scripts/train_refiner.py \
#        --config configs/refiner_oh_v9.yaml \
#        --warmstart output/refiner_oh_v1/checkpoints/latest.pth
# ============================================================

exp_name: refiner_oh_v9
output_dir: output/refiner_oh_v9

model:
  in_dim: 64
  match_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 8
  fine_iters: 8
  damping: 0.001
  coarse_hw: [17, 30]
  fine_hw: [68, 120]
  solver_hw: [68, 120]
  solver_upsample: 4
  depth_normalize: false
  sequential_solve: true
  detach_conf: true
  conf_floor: 0.1
  solver_trans_scale: 0.0
  use_trans_head: false
  trans_head_mode: replace

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  feat_hw: [68, 120]
  img_hw: [1080, 1920]
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25
  batch_size: 1
  val_batch_size: 1
  num_workers: 4

training:
  epochs: 200
  phase1_epochs: 200
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  outer_iters: 2
  val_outer_iters: 5
  loss:
    flow_weight: 5.0
    pose_weight: 0.0
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.8
    conf_reg_weight: 0.3
    contrast_weight: 0.5
    xi_weight: 0.0
  noise_curriculum:
    enabled: true
    warmup_epochs: 20
    base_rot_deg: 2.0
    base_trans_m: 0.05
    max_rot_deg: 8.0
    max_trans_m: 0.25
