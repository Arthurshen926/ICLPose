# ============================================================
#  exp037_stairs_multi_curriculum.yaml
#  Multi-sequence stairs (seq-02,03,05 = 1500 frames)
#  With noise curriculum fix (persistent_workers=False)
# ============================================================

exp_name: exp037_stairs_multi_curriculum
output_dir: output/exp037_stairs_multi_curriculum

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [35, 46]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64

renderer:
  ply_path: output/2dgs_models/stairs/v5_minN/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/stairs_v3/per_scale/coarse.pth
    mid:       output/feature_3dgs/stairs_v3/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/stairs_v3/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/stairs_v3/per_scale/fine_dino.pth
  img_height: 480
  img_width: 640
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

data:
  train_feature_dir: output/features_multiscale_compressed/stairs_multi
  train_traj_path: output/features_multiscale_compressed/stairs_multi/traj_w_c.txt
  train_depth_dir: null

  val_feature_dir: null
  val_split_ratio: 0.1

  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25

  batch_size: 4
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 80
  phase1_epochs: 5
  lr: 0.0002
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 3
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.8
    gamma_outer: 0.8

  noise_curriculum:
    enabled: true
    warmup_epochs: 40
    noise_rot_min: 2.0
    noise_trans_min: 0.05

  pose_warmup:
    enabled: true
    warmup_epochs: 8
    min_weight: 0.1
