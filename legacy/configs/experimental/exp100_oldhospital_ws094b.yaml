# exp100 — OldHospital stride-7, warmstart from exp094b best (~7.88°), bs=4
# Higher batch size for better gradients + GPU utilization
exp_name: exp100_oldhospital_ws094b
output_dir: output/exp100_oldhospital_ws094b

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 26]
  mid_hw: [30, 53]
  fine_hw: [69, 121]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 3

renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/oldhospital_v4_stride7/per_scale/coarse.pth
    mid:       output/feature_3dgs/oldhospital_v4_stride7/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/oldhospital_v4_stride7/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/oldhospital_v4_stride7/per_scale/fine_dino.pth
  img_height: 1080
  img_width: 1920
  fx: 1673.5
  fy: 1673.5
  cx: 960.0
  cy: 540.0

data:
  train_traj_path: output/features_multiscale_stride7_compressed/OldHospital_indexed/traj_w_c.txt
  train_feature_dir: output/features_multiscale_stride7_compressed/OldHospital_indexed
  val_split_ratio: 0.17
  batch_size: 4
  val_batch_size: 2
  num_workers: 4
  noise_rot_deg: 10.0
  noise_trans_m: 1.0

training:
  epochs: 150
  lr: 0.0001
  min_lr: 1.0e-06
  weight_decay: 0.0001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 3
  val_outer_iters: 5
  phase1_epochs: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.8
    gamma_outer: 0.8
