# v22f: Deep refinement model — 8 outer iters for deeper convergence basin
# Trained at 0.3°-1.5° noise with 8 outer iterations (vs v22d's 5)
# Goal: extend convergence depth so the model can reduce error to <0.3°
# Warmstart from v22d best (E30, 0.296° at 0.5° MS=10)
#
# Key changes vs v22d:
#   - outer_iters_train: 5 → 8 (deeper iterative refinement)
#   - noise_curriculum: tighter (0.3°-1.5° → better at low-noise regime)
#   - epochs: 40 → 60 (more training for 8-iter model)
#   - Warmstart from v22d (not v22b) for better starting point

exp_name: concat_loc_oh_v22f_deep_refine
output_dir: output

dataset:
  feature_dir: output/features_query_student_v5g/OldHospital
  colmap_dir: dataset/OldHospital/sparse/0
  source_dir: dataset/OldHospital
  train_split: dataset/OldHospital/dataset_train.txt
  test_split: dataset/OldHospital/dataset_test.txt
  cache_in_memory: true

dcff:
  checkpoint: output/dcff_radio_oh_v10/checkpoints/best.pth
  joint_checkpoint: output/joint_radio_dcff_oh_v5d_joint_fine_schedule/checkpoints/best.pth
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  feature_dim: 64
  latent_dim: 32
  render_width: 120
  render_height: 68
  finetune_decoder: true
  coarse_smoothing_kernel: 1

model:
  feature_dim: 64
  hidden_dim: 256
  irls_iters: 0
  use_coarse: true
  use_gru: true
  gru_iters: 8
  local_radius: 4
  proj_dim: 32
  proj_mode: shared
  full_wls: false
  flow_init: small
  coarse_flow_init: true
  coarse_pool_factor: 4
  detach_trans: false
  detach_wls_rot: false
  rot_mode: wls

training:
  epochs: 60
  batch_size: 12
  lr: 1.5e-5
  decoder_lr: 4.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0
  min_lr: 5.0e-7

  noise_curriculum:
    rot_start_deg: 0.3
    rot_end_deg: 1.5
    trans_start_m: 0.008
    trans_end_m: 0.04
    warmup_epochs: 15
    rot_min_deg: 0.05
    trans_min_m: 0.003

  loss:
    flow_weight: 5.0
    pose_weight: 1.0
    rot_loss_type: geodesic
    rot_weight: 50.0
    trans_weight: 10.0
    conf_reg_weight: 0.05
    conf_nll_weight: 0.3
    direct_trans_loss: false
    feat_match_weight: 0.3

  phase1_epochs: 0
  outer_iters_train: 8
  outer_iters_val: 8

  warmstart: output/concat_loc_oh_v22d_stage2_lownoise/checkpoints/best.pth

  val_every: 5
  save_every: 10
  vis_every: 10
  num_vis_samples: 4

  # Validate at the noise level this model will operate at
  val_noise_deg: 1.0
  val_noise_m: 0.03

renderer:
  longest_edge: 1088
