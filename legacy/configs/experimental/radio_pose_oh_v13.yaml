# RadioPoseNet v13: OldHospital — Fix anti-correlated domain projections
#
# ROOT CAUSE: v12 proj_q/proj_r diverged → cosine sim = -0.07 (NEGATIVE!)
# Top-1 matching accuracy = 9% → flow predictions ~25% of GT → no refinement.
#
# FIXES in v13:
#   - shared_projection: true — same network for Q and R (guarantees feature alignment)
#   - Inherits v12 flow emphasis (flow_weight=5.0, outer_iters=1, phase1_epochs=20)

exp_name: radio_pose_oh_v13
output_dir: output/radio_pose_oh_v13

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  img_hw: [1080, 1920]
  feat_hw: [68, 120]
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

model:
  feat_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 4
  fine_iters: 4
  damping: 0.001
  coarse_hw: [17, 30]
  fine_hw: [34, 60]
  irls_iters: 0
  conf_floor: 0.1                  # NEW: minimum confidence prevents collapse
  detach_conf_in_solver: true      # NEW: conf not trained by pose loss
  solver_hw: [68, 120]             # NEW: solve at RADIO native res (2× fine → 4× pixels, 2× fx)
  sequential_solve: true           # NEW: rotation-first then translation (decouples ill-conditioning)
  solver_trans_scale: 0.0          # NEW: disable translation from solver (unobservable at 33m depth)
  shared_projection: true          # NEW: guarantee Q/R feature alignment

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  batch_size: 16
  val_batch_size: 8
  num_workers: 4
  noise_rot_deg: 3.0               # REDUCED from 8.0
  noise_trans_m: 0.08              # REDUCED from 0.25
  val_noise_rot_deg: 3.0           # Match train distribution
  val_noise_trans_m: 0.08

  noise_curriculum:
    enabled: true
    warmup_epochs: 20              # Faster ramp (max is lower)
    base_rot_deg: 1.0              # Start very small
    base_trans_m: 0.02
    max_rot_deg: 3.0               # REDUCED from 8.0
    max_trans_m: 0.08              # REDUCED from 0.25

training:
  epochs: 200
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  phase1_epochs: 20                # Extended flow-only warmup
  outer_iters: 1                   # Single iteration (avoid drift)
  val_outer_iters: 1               # Match train
  pose_loss_last_only: false       # Pose loss at every iter

  loss:
    flow_weight: 5.0              # 5×: flow learning is now dominant
    pose_weight: 0.5               # Reduced: don't fight flow
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.8
    conf_reg_weight: 0.3
    xi_weight: 0.5                 # Reduced: don't fight flow
    contrast_weight: 0.5           # Reduced: good enough, don't dominate
