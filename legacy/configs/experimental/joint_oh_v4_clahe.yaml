# Joint 2DGS Geometry + DA3 Feature Training v4 — OldHospital (CLAHE)
# ====================================================================
# 基于 v3 + STDLoc 对比改进:
#   ✅ CLAHE 替代 AppearanceNetwork (更简单,更有效)
#   ✅ 动态物体 mask (行人/车辆 class 5 排除 RGB + feature loss)
#   ✅ 植被 Gaussian 激进剪枝 (opacity < 0.05 的植被 Gaussian 被剪掉)
#   ✅ 移除 AppearanceNetwork 和 TransientHead (CLAHE + dynamic mask 替代)
#
# 前置步骤:
#   1. python scripts/preprocess_clahe.py --image_dir dataset/OldHospital \
#        --output_dir dataset/OldHospital/clahe_images
#   2. python scripts/extract_da3_unified.py (确保 6-class mask 已提取)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v4_clahe.yaml

exp_name: joint_oh_v4_clahe

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: clahe_images       # CLAHE 预处理后的图像
  feature_dir: output/features_da3/OldHospital_indexed
  feature_scales:
    - fine                   # 64d @ 69×121

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 30000
  longest_edge: 0
  eval_interval: 2500
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # LR
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision
  mono_depth_dir: dataset/OldHospital/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000

  # Densification (conservative)
  densify_from_iter: 500
  densify_until_iter: 20000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01

  # Sky / object masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork — DISABLED (CLAHE replaces it)
  use_appearance: false

  # TransientHead — DISABLED (dynamic mask replaces it)
  use_transient: false

  # Semantic-guided regularization + dynamic masking
  # 使用 DA3 unified 6-class masks (含动态物体 class 5)
  semantic_mask_dir: output/features_da3_unified/OldHospital/masks
  vegetation_reg_scale: 0.1

  # Vegetation aggressive pruning
  # 植被区域 Gaussian opacity < 0.05 时被剪掉 (标准阈值 0.005)
  veg_prune_opacity: 0.05

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
