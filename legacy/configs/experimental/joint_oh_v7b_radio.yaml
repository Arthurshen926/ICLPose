# Joint 2DGS Geometry + RADIO Feature — OldHospital  v7b-RADIO
# =============================================================
# 超激进植被修复版: 与v7并行的对照实验
#
# 与v7的区别:
#   - veg_prune_opacity 更高 (0.25 vs 0.15)
#   - veg_prune_scale_percentile 更低 (90 vs 95) → 修剪更多大高斯
#   - vegetation_scale_boost 更高 (5.0 vs 3.0) → 极强尺度约束
#   - opacity_reset_interval 更频繁 (4000 vs 6000) → 更多修剪机会
#
# 目标: 测更激进修剪的PSNR下限; 如果PSNR降幅<0.3dB, 说明可以更大胆

exp_name: joint_oh_v7b_radio

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_radio/OldHospital_indexed
  feature_scales:
    - fine_radio

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 40000
  longest_edge: 0
  eval_interval: 1000
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # Learning rates — same as v5/v6c
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding — same as v5/v6c
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision — exclude vegetation
  mono_depth_dir: output/oh_depth_local/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000
  depth_exclude_vegetation: true

  # Densification — more frequent opacity reset for more pruning chances
  densify_from_iter: 500
  densify_until_iter: 25000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 4000    # v7=6000 → v7b: 更频繁重置+修剪
  opacity_reset_value: 0.01
  size_threshold: null
  max_gaussians: 0

  # Sky / object masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork
  use_appearance: true
  appearance_embed_dim: 32
  appearance_lr: 0.001
  appearance_reg: 0.0
  appearance_mean_reg: 0.01

  # Transient mask
  use_transient: true
  transient_lr: 0.001
  transient_reg: 0.01

  # Semantic-guided regularization — ULTRA AGGRESSIVE
  semantic_mask_dir: dataset/OldHospital/semantic_masks
  vegetation_reg_scale: 0.4            # v7=0.3 → 更强法线/距离正则
  vegetation_scale_boost: 5.0          # v7=3.0 → 极强尺度约束
  veg_prune_opacity: 0.25             # v7=0.15 → 更激进透明度修剪
  veg_prune_scale_percentile: 90      # v7=95 → 更多大高斯被修剪

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
