# exp129 — stairs ENHANCED architecture (vs exp110b baseline)
# Tests: multi-scale correlation, positional encoding, more mid iters, cross-scale consistency
# Same hyperparameters as exp110b for fair comparison
exp_name: exp129_stairs_enhanced
output_dir: output/exp129_stairs_enhanced

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 2              # 1 → 2: more mid-level refinement
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [69, 91]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 3
  # NEW: architectural enhancements (corr_dilations removed — OOM at 69×91)
  positional_encoding: true  # spatial disambiguation for repetitive textures
  pe_mode: add               # 'add' avoids channel size increase (OOM with 'concat')
  multiscale_consistency: true  # cross-scale consistency weighting

renderer:
  ply_path: output/2dgs_models/stairs/v5_minN/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/stairs_v5_stride7_fx525/per_scale/coarse.pth
    mid:       output/feature_3dgs/stairs_v5_stride7_fx525/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/stairs_v5_stride7_fx525/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/stairs_v5_stride7_fx525/per_scale/fine_dino.pth
  fx: 525.505
  fy: 525.505
  cx: 320.0
  cy: 240.0

data:
  train_traj_path: dataset/stairs/seq-02/traj_w_c.txt
  train_feature_dir: output/features_multiscale_stride7_compressed/stairs_seq02
  val_split_ratio: 0.1
  batch_size: 12
  val_batch_size: 2
  num_workers: 4
  noise_rot_deg: 8.0
  noise_trans_m: 0.25

training:
  epochs: 200
  lr: 0.0003
  min_lr: 1.0e-06
  weight_decay: 0.0001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 10
  val_outer_iters: 10
  phase1_epochs: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_reg_weight: 0.0

  pose_warmup:
    enabled: false

  scheduler:
    type: cosine
    warmup_epochs: 5
    T_max: 200

  noise_curriculum:
    enabled: false
