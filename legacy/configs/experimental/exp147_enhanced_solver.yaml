# ============================================================
#  exp147_enhanced_solver.yaml
#  基于 exp032 的增强定位模块优化:
#   1. learnable_temperature: 可学习的 per-scale correlation 温度
#   2. directional_confidence: 方向性置信度 (u/v 分离权重)
#   3. adaptive_damping: 自适应 LM 阻尼 (基于条件数)
#   4. irls_iters=2: 启用 IRLS 鲁棒估计
# ============================================================

exp_name: exp147_enhanced_solver
output_dir: output/exp147_enhanced_solver

# ── Model ──
model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  coarse_hw: [7, 10]
  mid_hw: [15, 20]
  fine_hw: [35, 46]
  # New optimizations
  learnable_temperature: true      # per-scale learnable correlation temperature
  directional_confidence: true     # u/v directional confidence weighting
  adaptive_damping: true           # condition-number-adaptive LM damping
  adaptive_damping_max: 0.1
  adaptive_damping_cond_thresh: 10000.0
  irls_iters: 2                    # IRLS robust estimation
  irls_huber_k: 1.345

# ── Renderer (3DGS) ──
renderer:
  ply_path: dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/room_0_raw/coarse/best_model.pth
    mid:       output/feature_3dgs/room_0_raw/mid/best_model.pth
    fine_sd:   output/feature_3dgs/room_0_raw/fine_sd/best_model.pth
    fine_dino: output/feature_3dgs/room_0_raw/fine_dino/best_model.pth
  img_height: 480
  img_width: 640
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

# ── Data ──
data:
  train_feature_dir: output/features_multiscale/room_0
  train_traj_path: dataset/room_0/Sequence_1/traj_w_c.txt
  train_depth_dir: dataset/room_0/Sequence_1/depth

  val_feature_dir: null
  val_traj_path: dataset/room_0/Sequence_2/traj_w_c.txt
  val_depth_dir: dataset/room_0/Sequence_2/depth
  val_netvlad_poses: null
  val_split_ratio: 0.1

  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25

  batch_size: 4
  val_batch_size: 4
  num_workers: 4

# ── Training ──
training:
  epochs: 60
  phase1_epochs: 3
  lr: 0.00005
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  # 外层迭代精化
  outer_iters: 3
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.8
    gamma_outer: 0.8

  # Noise curriculum
  noise_curriculum:
    enabled: true
    warmup_epochs: 40
    noise_rot_min: 2.0
    noise_trans_min: 0.05

  # Pose loss warmup
  pose_warmup:
    enabled: true
    warmup_epochs: 8
    min_weight: 0.1
