# Ablation: v1 baseline + aggressive densification + relaxed scale reg ONLY
# Tests: Lower densify threshold (0.00015) + lower scale_reg (0.0005) + higher scale threshold (0.5)
# All other params identical to joint_oh_v1.yaml
#
# CUDA_VISIBLE_DEVICES=4 python -m feature_3dgs.train_2dgs_joint_v2 \
#   --config configs/joint_oh_ab_densify.yaml

exp_name: joint_oh_ab_densify

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_da3/OldHospital_indexed
  feature_scales:
    - fine

model:
  sh_degree: 3
  white_background: false

training:
  iterations: 30000
  longest_edge: 0
  eval_interval: 2500
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # LR (same as v1)
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding (same as v1)
  feature_embedding_lr: 0.01
  feature_weight: 0.1
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  # >>> ABLATION VARIABLE: Relaxed scale regularization <<<
  lambda_scale: 0.0005         # v1: 0.001 — 让高斯更自由
  scale_reg_threshold: 0.5     # v1: 0.3 — 更宽松阈值
  reg_start_iter: 500

  # Densification
  densify_from_iter: 500
  densify_until_iter: 20000
  densification_interval: 100
  # >>> ABLATION VARIABLE: More aggressive densification <<<
  densify_grad_threshold: 0.00015  # v1: 0.0002 — 更积极分裂/克隆
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01

output_dir: output/2dgs_joint
