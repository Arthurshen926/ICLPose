# Ablation: v1 baseline + longer training + extended densification ONLY
# Tests: 40K iterations (vs 30K) + densify until 25K (vs 20K)
# All other params identical to joint_oh_v1.yaml
#
# CUDA_VISIBLE_DEVICES=3 python -m feature_3dgs.train_2dgs_joint_v2 \
#   --config configs/joint_oh_ab_longer.yaml

exp_name: joint_oh_ab_longer

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_da3/OldHospital_indexed
  feature_scales:
    - fine

model:
  sh_degree: 3
  white_background: false

training:
  # >>> ABLATION VARIABLE: Longer training + extended densification <<<
  iterations: 40000
  longest_edge: 0
  eval_interval: 2500
  save_interval: 10000
  vis_frames: [0, 200, 500, 800]

  # LR (same as v1)
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding (same as v1)
  feature_embedding_lr: 0.01
  feature_weight: 0.1
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization (same as v1)
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # >>> ABLATION VARIABLE: Extended densification <<<
  densify_from_iter: 500
  densify_until_iter: 25000    # v1: 20000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01

output_dir: output/2dgs_joint
