# ============================================================
#  refiner_oh_v15.yaml 
#  PoseRefiner V15: V14 base + multi-iter training + trans fix
#
#  Key changes from V14:
#   - outer_iters: 2 (train with 2 iterations, so model learns
#     to refine from partially-corrected poses)
#   - solver_trans_scale: 0.1 (enable partial translation solving
#     to reduce translation-to-rotation leakage in sequential solver)
#   - Warmstart from V14 best (E003, already adapted to 34×60)
#
#  Rationale: V14 showed I0=3.58° from 8° (55% reduction in one
#  iter) but iterations 2+ diverge. At 34×60 resolution, the ±8.82°
#  capture range easily covers the residual after iter 1 (~6°), so
#  multi-iter training SHOULD work here (unlike at 68×120 where 
#  ±3.6° was too small).
#
#  Previous multi-iter failures (V10/V11/V12) were at 68×120 where
#  r=8 only covers ±3.6° — after one correction (8°→6°), residual
#  still exceeds capture range. At 34×60, ±8.82° easily handles this.
#
#  Training:
#    CUDA_VISIBLE_DEVICES=0 python scripts/train_refiner.py \
#        --config configs/refiner_oh_v15.yaml \
#        --warmstart output/refiner_oh_v14/checkpoints/best.pth
# ============================================================

exp_name: refiner_oh_v15
output_dir: output/refiner_oh_v15

model:
  in_dim: 64
  match_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 8
  fine_iters: 8
  damping: 0.001
  coarse_hw: [17, 30]
  fine_hw: [34, 60]
  solver_upsample: 4
  depth_normalize: false
  sequential_solve: true
  detach_conf: true
  conf_floor: 0.1
  solver_trans_scale: 0.1
  use_trans_head: false
  trans_head_mode: replace

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  feat_hw: [68, 120]
  img_hw: [1080, 1920]
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25
  batch_size: 2
  val_batch_size: 2
  num_workers: 4

training:
  epochs: 200
  phase1_epochs: 200
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  outer_iters: 2
  val_outer_iters: 5
  grad_accum_steps: 4
  loss:
    flow_weight: 5.0
    pose_weight: 0.0
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.8
    conf_reg_weight: 0.3
    contrast_weight: 0.5
    xi_weight: 0.0
  noise_curriculum:
    enabled: false
