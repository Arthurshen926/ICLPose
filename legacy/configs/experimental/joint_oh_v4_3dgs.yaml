# Joint 3DGS + DA3 Feature Training — OldHospital (3DGS comparison)
# ====================================================================
# 3DGS (ellipsoid) 对比实验:
#   ✅ use_3dgs: true — 使用 gsplat.rasterization 替代 rasterization_2dgs
#   ✅ 自动禁用 lambda_normal 和 lambda_dist (3DGS 不产生法线/distortion)
#   ✅ 其他超参保持与 v4_clahe 一致, 确保公平比较
#
# 运行方式:
#   CUDA_VISIBLE_DEVICES=0 FORCE_3DGS_RASTERIZATION=1 \
#     python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v4_3dgs.yaml

exp_name: joint_oh_v4_3dgs

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: clahe_images
  feature_dir: output/features_da3/OldHospital_indexed
  feature_scales:
    - fine

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 30000
  longest_edge: 0
  eval_interval: 2500
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # LR (same as v4_clahe)
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization — will be auto-disabled by use_3dgs
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision
  mono_depth_dir: dataset/OldHospital/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000

  # Densification
  densify_from_iter: 500
  densify_until_iter: 20000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01

  # Sky masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork — DISABLED
  use_appearance: false
  use_transient: false

  # 3DGS mode
  use_3dgs: true

  # Semantic + vegetation pruning
  semantic_mask_dir: output/features_da3_unified/OldHospital/masks
  vegetation_reg_scale: 0.1
  veg_prune_opacity: 0.05

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
