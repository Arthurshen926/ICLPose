# Joint 2DGS + DA3 Training v4 — OldHospital 50K (extended training)
# ====================================================================
# 基于 v4_clahe, 延长训练到 50K iterations:
#   ✅ iterations: 30000 → 50000
#   ✅ densify_until_iter: 20000 → 25000 (更多 Gaussian 预算)
#   ✅ 更多 eval 和 save 点
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v4_50k.yaml

exp_name: joint_oh_v4_50k

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: clahe_images
  feature_dir: output/features_da3/OldHospital_indexed
  feature_scales:
    - fine

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 50000          # 50K (from 30K)
  longest_edge: 0
  eval_interval: 2500
  save_interval: 10000
  vis_frames: [0, 200, 500, 800]

  # LR (same as v4_clahe)
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision
  mono_depth_dir: dataset/OldHospital/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000

  # Densification — extended to 25K
  densify_from_iter: 500
  densify_until_iter: 25000  # Extended (from 20K)
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01

  # Sky masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork — DISABLED (CLAHE)
  use_appearance: false
  use_transient: false

  # Semantic + dynamic mask + vegetation pruning
  semantic_mask_dir: output/features_da3_unified/OldHospital/masks
  vegetation_reg_scale: 0.1
  veg_prune_opacity: 0.05

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
