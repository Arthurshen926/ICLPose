# exp153 — Room0 + Phase 1 Combined (Validation)
# Verify Phase 1 improvements don't regress on Room0 (current best: 0.119°)
# Warmstart from exp143 best
exp_name: exp153_r0_phase1_combined
output_dir: output/exp153_r0_phase1_combined

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [91, 120]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 2
  irls_huber_k: 1.345
  learnable_temperature: true
  directional_confidence: true
  adaptive_damping: true
  adaptive_damping_max: 0.1
  adaptive_damping_cond_thresh: 10000.0
  localizability_prior: true

renderer:
  ply_path: output/2dgs_models/room_0/v8_fixed_poses/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/room_0_v4_stride7_decoupled/per_scale/coarse.pth
    mid:       output/feature_3dgs/room_0_v4_stride7_decoupled/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/room_0_v4_stride7_decoupled/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/room_0_v4_stride7_decoupled/per_scale/fine_dino.pth

data:
  train_traj_path: dataset/room_0/Sequence_1/traj_w_c.txt
  train_feature_dir: output/features_multiscale_stride7_compressed/room_0
  val_split_ratio: 0.1
  noise_rot_deg: 1.0
  noise_trans_m: 0.01
  batch_size: 8
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 100
  phase1_epochs: 0
  lr: 0.00001
  min_lr: 1.0e-08
  weight_decay: 0.0001
  grad_clip: 1.0
  use_amp: true

  per_scale_lr:
    enabled: true
    coarse_scale: 0.5
    mid_scale: 0.75
    fine_scale: 1.0

  outer_iters: 10
  val_outer_iters: 20

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    flow_consistency_weight: 0.05
    localizability_weight: 0.01

  scheduler:
    type: cosine
    warmup_epochs: 3
    T_max: 100
