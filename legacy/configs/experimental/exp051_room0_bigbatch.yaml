# ============================================================
#  exp051_room0_bigbatch.yaml
#  Room_0 with LARGE batch size + hidden_dim=256 to fill VRAM
#  Based on exp039's proven recipe (gamma=0.95, oi=5, const 8°)
#  Key changes vs exp039:
#    - batch_size 4 → 16 (fill 24GB VRAM)
#    - hidden_dim 128 → 256 (more GRU capacity)
#    - mid_iters 1 → 3 (multiple mid refinement passes)
#    - epochs 120 → 80 (larger batch = fewer epochs needed)
# ============================================================

exp_name: exp051_room0_bigbatch
output_dir: output/exp051_room0_bigbatch

model:
  hidden_dim: 256
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 3
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [35, 46]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64

renderer:
  ply_path: output/2dgs_models/room_0/v8_fixed_poses/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/room_0_v2/per_scale/coarse.pth
    mid:       output/feature_3dgs/room_0_v2/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/room_0_v2/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/room_0_v2/per_scale/fine_dino.pth
  img_height: 480
  img_width: 640
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

data:
  train_feature_dir: output/features_multiscale_compressed/room_0
  train_traj_path: dataset/room_0/Sequence_1/traj_w_c.txt
  train_depth_dir: dataset/room_0/Sequence_1/depth

  val_feature_dir: null
  val_split_ratio: 0.1

  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25

  batch_size: 16
  val_batch_size: 8
  num_workers: 4

training:
  epochs: 80
  phase1_epochs: 3
  lr: 0.0004
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 5
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: false

  pose_warmup:
    enabled: true
    warmup_epochs: 5
    min_weight: 0.1
