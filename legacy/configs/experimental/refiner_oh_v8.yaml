# ============================================================
#  refiner_oh_v8.yaml
#  PoseRefiner V8: High-res with radius=8 (larger capture range)
#
#  V5 at 68×120 with radius=4 has only ±2° fine capture range
#  (0.5°/px × 4px), vs V1's ±4° at 34×60 (1.0°/px × 4px).
#  This explains V5's poor 8° performance (coarse can't fully
#  correct 8° → fine stage needs >2° capture range).
#
#  V8 uses radius=8 → ±4° capture = same as V1 at 34×60.
#  Correlation volume: (2*8+1)²=289 channels (vs 81 at r=4).
#  The fine_head.corr_encoder.0 weights from V1 are incompatible
#  (81 vs 289 input channels) — these layers train from scratch.
#  All other weights are warm-started from V1.
#
#  Key changes from V5:
#    - local_radius: 8 (up from 4) — ±4° fine capture range
#    - outer_iters: 1 (single step, like V5)
#    - batch_size: 8 (same as V5)
#
#  Training:
#    CUDA_VISIBLE_DEVICES=3 python scripts/train_refiner.py \
#        --config configs/refiner_oh_v8.yaml \
#        --warmstart output/refiner_oh_v1/checkpoints/latest.pth
# ============================================================

exp_name: refiner_oh_v8
output_dir: output/refiner_oh_v8

model:
  in_dim: 64
  match_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 8               # ±8 px @ 68×120 = ±4° capture (matches V1's range)
  fine_iters: 8
  damping: 0.001
  coarse_hw: [17, 30]
  fine_hw: [68, 120]
  solver_hw: [68, 120]
  solver_upsample: 4
  depth_normalize: false
  sequential_solve: true
  detach_conf: true
  conf_floor: 0.1
  solver_trans_scale: 0.0
  use_trans_head: false
  trans_head_mode: replace

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  feat_hw: [68, 120]
  img_hw: [1080, 1920]
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25
  batch_size: 2
  val_batch_size: 2
  num_workers: 4

training:
  epochs: 200
  phase1_epochs: 200
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  outer_iters: 1
  val_outer_iters: 5
  loss:
    flow_weight: 5.0
    pose_weight: 0.0
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.8
    conf_reg_weight: 0.3
    contrast_weight: 0.5
    xi_weight: 0.0
  noise_curriculum:
    enabled: true
    warmup_epochs: 20
    base_rot_deg: 2.0
    base_trans_m: 0.05
    max_rot_deg: 8.0
    max_trans_m: 0.25
