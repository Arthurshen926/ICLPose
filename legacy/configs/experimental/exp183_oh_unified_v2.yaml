# ============================================================
#  exp183_oh_unified_v2.yaml
#  OldHospital: DA3 fine features (2DGS-retrained) at ALL 3 resolutions
#
#  Key changes from exp182:
#  - gsplat 1.4.0 with proper rasterization_2dgs
#  - Features retrained with correct 2DGS renderer (cos_sim=0.96 at all scales)
#  - Proper per-scale resolution in checkpoints
# ============================================================

exp_name: exp183_oh_unified_v2
output_dir: output/exp183_oh_unified_v2

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 26]
  mid_hw: [30, 53]
  fine_hw: [69, 121]
  coarse_in_dim: 64
  mid_in_dim: 64
  fine_in_dim: 64
  flowfeat_mode: true

renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse: output/feature_3dgs/oldhospital_da3_fine_unified_v2/coarse/best_model.pth
    mid: output/feature_3dgs/oldhospital_da3_fine_unified_v2/mid/best_model.pth
    fine: output/feature_3dgs/oldhospital_da3_fine_unified_v2/fine/best_model.pth
  scale_resolutions:
    coarse: [15, 26]
    mid: [30, 53]
    fine: [69, 121]
  img_height: 1080
  img_width: 1920
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  train_feature_dir: output/features_da3_fine_unified_v2/OldHospital
  train_traj_path: output/features_da3_fine_unified_v2/OldHospital/traj_w_c.txt
  scale_names: [coarse, mid, fine]

  val_feature_dir: null
  val_traj_path: null
  val_netvlad_poses: null
  val_split_ratio: 0.1

  noise_rot_deg: 10.0
  noise_trans_m: 1.0
  val_noise_rot_deg: 10.0
  val_noise_trans_m: 1.0

  batch_size: 4
  val_batch_size: 2
  num_workers: 4

training:
  epochs: 150
  phase1_epochs: 5
  lr: 0.0002
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  use_depth_warp: false

  outer_iters: 3
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.8
    gamma_outer: 0.8
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: true
    warmup_epochs: 40
    noise_rot_min: 2.0
    noise_trans_min: 0.1

  pose_warmup:
    enabled: true
    warmup_epochs: 8
    min_weight: 0.1
