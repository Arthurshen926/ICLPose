# Joint 2DGS Geometry + DA3 Feature Training — OldHospital v2
# 改进点 (vs v1):
#   1. 单目深度监督 (Pearson correlation loss, λ=0.05)
#   2. Random background (帮助边缘和 alpha 学习)
#   3. 更长训练 (40K iter) + 延迟 densification 结束到 25K
#   4. 更高 feature weight (0.15)
#   5. 更低 scale_reg (0.0005) 避免过分限制高斯大小
#   6. 更积极 densification (grad threshold 0.00015)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 python -m feature_3dgs.train_2dgs_joint_v2 \
#     --config configs/joint_oh_v2.yaml

exp_name: joint_oh_v2

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_da3/OldHospital_indexed
  feature_scales:
    - fine                  # 64d @ 69×121

model:
  sh_degree: 3
  white_background: false
  random_background: true   # 帮助学习正确的 alpha 和边缘

training:
  iterations: 40000         # 更长训练，让特征充分收敛
  longest_edge: 0           # Full resolution 1920×1080
  eval_interval: 2500
  save_interval: 10000
  vis_frames: [0, 200, 500, 800]

  # LR
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.15      # 提高特征权重 (v1: 0.1)
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.0005     # 降低 scale reg (v1: 0.001)，让高斯更自由以覆盖树木灌木
  scale_reg_threshold: 0.5  # 更宽松 (v1: 0.3)
  reg_start_iter: 500

  # Monocular depth supervision (Pearson correlation)
  mono_depth_dir: dataset/OldHospital/mono_depth
  lambda_depth: 0.05        # NEW: 深度监督
  depth_start_iter: 3000    # 先稳定几何再引入深度
  depth_warmup_iters: 2000  # 线性 warmup 到 iter 5000

  # Densification
  densify_from_iter: 500
  densify_until_iter: 25000  # 延长 densification (v1: 20000)
  densification_interval: 100
  densify_grad_threshold: 0.00015  # 更积极 (v1: 0.0002)
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01

output_dir: output/2dgs_joint
