# ============================================================
#  exp058_stairs_irls.yaml
#  Stairs: exp039's proven recipe (γ=0.95, oi=5) + IRLS
#  Key changes vs exp042:
#    - gamma 0.8 → 0.95 (exp039's recipe works better)
#    - outer_iters 3 → 5
#    - irls_iters=3 (robust geometry solver)
#    - batch_size 2 → 8 (fill VRAM)
#    - warmstart from exp042 best checkpoint
# ============================================================

exp_name: exp058_stairs_irls
output_dir: output/exp058_stairs_irls

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [35, 46]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 3

renderer:
  ply_path: output/2dgs_models/stairs/v5_minN/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/stairs_v3/per_scale/coarse.pth
    mid:       output/feature_3dgs/stairs_v3/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/stairs_v3/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/stairs_v3/per_scale/fine_dino.pth
  img_height: 480
  img_width: 640
  fx: 525.505
  fy: 525.505
  cx: 320.0
  cy: 240.0

data:
  train_feature_dir: output/features_multiscale_compressed/stairs_multi
  train_traj_path: output/features_multiscale_compressed/stairs_multi/traj_w_c.txt
  train_depth_dir: null

  val_feature_dir: null
  val_split_ratio: 0.1

  noise_rot_deg: 8.0
  noise_trans_m: 0.15
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.15

  batch_size: 8
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 80
  phase1_epochs: 3
  lr: 0.0001
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  # warmstart via CLI: --warmstart output/exp042_stairs_expanded/checkpoints/best.pth

  outer_iters: 5
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: false

  pose_warmup:
    enabled: true
    warmup_epochs: 3
    min_weight: 0.1
