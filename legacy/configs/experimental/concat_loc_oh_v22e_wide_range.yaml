# v22e: Wide-range iterative refinement model (8 outer iters)
# Key insight: train with many outer iters at operating noise level
# to learn iterative self-correction over the full 0.1°-3° range.
#
# v22d (low noise ≤1.5°) failed at 1.86° Stage 1 input — OOD.
# v22e trains at the ACTUAL operating range with 8 outer iters so the model
# learns to chain corrections: 3° → 2.5° → 2.1° → ... → <1°
#
# Warmstarts from v22b (3° noise trained) for better initialization
# than v22d (which only saw ≤1.5° noise)

exp_name: concat_loc_oh_v22e_wide_range
output_dir: output

dataset:
  feature_dir: output/features_query_student_v5g/OldHospital
  colmap_dir: dataset/OldHospital/sparse/0
  source_dir: dataset/OldHospital
  train_split: dataset/OldHospital/dataset_train.txt
  test_split: dataset/OldHospital/dataset_test.txt
  cache_in_memory: true

dcff:
  checkpoint: output/dcff_radio_oh_v10/checkpoints/best.pth
  joint_checkpoint: output/joint_radio_dcff_oh_v5d_joint_fine_schedule/checkpoints/best.pth
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  feature_dim: 64
  latent_dim: 32
  render_width: 120
  render_height: 68
  finetune_decoder: true
  coarse_smoothing_kernel: 1

model:
  feature_dim: 64
  hidden_dim: 256
  irls_iters: 0
  use_coarse: true
  use_gru: true
  gru_iters: 10
  local_radius: 4
  proj_dim: 32
  proj_mode: shared
  full_wls: false
  flow_init: small
  coarse_flow_init: true
  coarse_pool_factor: 4
  detach_trans: false
  detach_wls_rot: false
  rot_mode: wls

training:
  epochs: 60
  batch_size: 16
  lr: 3.0e-5
  decoder_lr: 8.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0
  min_lr: 2.0e-6

  noise_curriculum:
    rot_start_deg: 1.0
    rot_end_deg: 3.0
    trans_start_m: 0.02
    trans_end_m: 0.10
    warmup_epochs: 15
    rot_min_deg: 0.1
    trans_min_m: 0.003

  loss:
    flow_weight: 5.0
    pose_weight: 1.0
    rot_loss_type: geodesic
    rot_weight: 50.0
    trans_weight: 10.0
    conf_reg_weight: 0.05
    conf_nll_weight: 0.3
    direct_trans_loss: false
    feat_match_weight: 0.3

  phase1_epochs: 0
  outer_iters_train: 8
  outer_iters_val: 8

  warmstart: output/concat_loc_oh_v22b_prealigned_full/checkpoints/best.pth

  val_every: 5
  save_every: 10
  vis_every: 10
  num_vis_samples: 4

  val_noise_deg: 3.0
  val_noise_m: 0.10

renderer:
  longest_edge: 1088
