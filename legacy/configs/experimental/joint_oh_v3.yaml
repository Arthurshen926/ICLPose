# Joint 2DGS Geometry + DA3 Feature Training v3 — OldHospital
# ============================================================
# 基于消融实验结论的深度改进:
#   ✅ 保留: depth supervision (λ=0.05, +0.05dB), feature_weight=0.5
#   ✅ 新增: sky masking, AppearanceNetwork, transient mask, 语义引导正则化
#   ❌ 移除: random_background (-0.18dB), aggressive densification (-0.23dB)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v3.yaml

exp_name: joint_oh_v3

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_da3/OldHospital_indexed
  feature_scales:
    - fine                  # 64d @ 69×121

model:
  sh_degree: 3
  white_background: false
  random_background: false  # ❌ ablation: -0.18dB

training:
  iterations: 30000
  longest_edge: 0           # Full resolution 1920×1080
  eval_interval: 2500
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # LR
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.5       # ✅ ablation: better feat loss than 0.1
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision — ✅ ablation: +0.05dB
  mono_depth_dir: dataset/OldHospital/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000

  # Densification — v1 params (conservative, ablation: aggressive harmful)
  densify_from_iter: 500
  densify_until_iter: 20000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01

  # ── v3 新增特性 ──

  # Sky / object masking (masks.pkl)
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork (per-image affine color correction)
  use_appearance: true
  appearance_embed_dim: 32
  appearance_lr: 0.001
  appearance_reg: 0.0        # individual identity reg (disabled)
  appearance_mean_reg: 0.01  # mean-centering reg (enabled)

  # Transient mask (learnable soft mask for dynamic objects)
  use_transient: true
  transient_lr: 0.001
  transient_reg: 0.01        # regularize confidence toward 0.5

  # Semantic-guided regularization
  semantic_mask_dir: dataset/OldHospital/semantic_masks
  vegetation_reg_scale: 0.1  # vegetation areas get 10% normal/dist/scale reg

  # Gradient accumulation: N cameras per optimizer step → better gradients + more VRAM usage
  grad_accum_steps: 4

output_dir: output/2dgs_joint
