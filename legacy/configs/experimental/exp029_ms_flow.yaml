# ============================================================
#  exp029_ms_flow.yaml
#  SD-Primary Coarse-to-Fine Multi-Scale Flow Pose Estimation
# ============================================================

exp_name: exp029_ms_flow
output_dir: output/exp029_ms_flow

# ── Model ──
model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  # v1 特征分辨率
  coarse_hw: [7, 10]
  mid_hw: [15, 20]
  fine_hw: [35, 46]

# ── Renderer (3DGS) ──
renderer:
  ply_path: dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/room_0_raw/coarse/best_model.pth
    mid:       output/feature_3dgs/room_0_raw/mid/best_model.pth
    fine_sd:   output/feature_3dgs/room_0_raw/fine_sd/best_model.pth
    fine_dino: output/feature_3dgs/room_0_raw/fine_dino/best_model.pth
  img_height: 480
  img_width: 640
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

# ── Data ──
data:
  # 训练 (Sequence 1, v1 preextracted features)
  train_feature_dir: output/features_multiscale/room_0
  train_traj_path: dataset/room_0/Sequence_1/traj_w_c.txt
  train_depth_dir: dataset/room_0/Sequence_1/depth

  # 验证 (Sequence 2 — 暂时跳过, 缺少 coarse/mid/fine_sd)
  val_feature_dir: null
  val_traj_path: dataset/room_0/Sequence_2/traj_w_c.txt
  val_depth_dir: dataset/room_0/Sequence_2/depth
  val_netvlad_poses: null
  val_split_ratio: 0.1   # 无独立验证集时, 从训练集取 10% 作验证

  # 扰动噪声 (per-axis std, 实际总旋转约 ×√3 ≈ 14°)
  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25

  batch_size: 8
  val_batch_size: 8
  num_workers: 4

# ── Training ──
training:
  epochs: 100
  phase1_epochs: 20   # Phase1: flow only, Phase2: flow + pose
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true        # 混合精度训练 (fp16), 节省 ~40% 显存

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
