# ============================================================
#  exp054_room0_highres_bigbatch.yaml
#  Room_0 HIGH-RES with batch_size=8 to fill VRAM
#  Replaces exp050 (batch_size=2, only 3.1GB VRAM used)
#  Key changes vs exp050:
#    - batch_size 2 → 8 (fill VRAM)
#    - mid_hw bumped [30,40] → [45,60] for better mid→fine handoff
#    - lr scaled up for larger batch
# ============================================================

exp_name: exp054_room0_highres_bigbatch
output_dir: output/exp054_room0_highres_bigbatch

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [60, 80]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64

renderer:
  ply_path: output/2dgs_models/room_0/v8_fixed_poses/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse: output/feature_3dgs/room_0_v2/per_scale/coarse.pth
    mid:    output/feature_3dgs/room_0_v2/per_scale/mid.pth
    fine_sd: output/feature_3dgs/room_0_v2/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/room_0_v2/per_scale/fine_dino.pth
  img_height: 480
  img_width: 640
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

data:
  train_feature_dir: output/features_multiscale_compressed/room_0
  train_traj_path: dataset/room_0/Sequence_1/traj_w_c.txt
  train_depth_dir: dataset/room_0/Sequence_1/depth

  val_feature_dir: null
  val_split_ratio: 0.1

  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25

  batch_size: 8
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 100
  phase1_epochs: 5
  lr: 0.0003
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 5
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: false

  pose_warmup:
    enabled: true
    warmup_epochs: 5
    min_weight: 0.1
