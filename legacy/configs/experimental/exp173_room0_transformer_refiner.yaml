# ============================================================
#  exp173 — room_0 Transformer Feature Refiner (coarse+mid)
#
#  Key change: Add TransformerFeatureRefiner before correlation
#  - Self+cross attention enhances Q/R features at coarse+mid scales
#  - 2 layers, 4 heads per scale → ~104K params × 2 = ~209K extra
#  - Residual gate (init=0) for safe warmstart compatibility
#  - Coarse: 300 tokens (15×20) — full attention
#  - Mid: 1200 tokens (30×40) — full attention
#  - Fine: unchanged (correlation-based, too many tokens for full attn)
#
#  Warmstart from exp143 best (0.12°), same data/renderer
#  GPU: 0
# ============================================================

exp_name: exp173_room0_transformer_refiner
output_dir: output/exp173_room0_transformer_refiner

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [91, 120]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 3
  # ★ Transformer feature refiner at coarse + mid
  transformer_refiner: coarse_mid
  transformer_refiner_layers: 2
  transformer_refiner_heads: 4

renderer:
  ply_path: output/2dgs_models/room_0/v8_fixed_poses/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/room_0_v4_stride7_decoupled/per_scale/coarse.pth
    mid:       output/feature_3dgs/room_0_v4_stride7_decoupled/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/room_0_v4_stride7_decoupled/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/room_0_v4_stride7_decoupled/per_scale/fine_dino.pth

data:
  train_traj_path: dataset/room_0/Sequence_1/traj_w_c.txt
  train_feature_dir: output/features_multiscale_stride7_compressed/room_0
  val_split_ratio: 0.1
  batch_size: 6
  val_batch_size: 4
  num_workers: 4
  noise_rot_deg: 1.0
  noise_trans_m: 0.01

training:
  epochs: 80
  lr: 0.00002
  min_lr: 1.0e-08
  weight_decay: 0.0001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 10
  val_outer_iters: 20
  phase1_epochs: 0

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95

  scheduler:
    type: cosine
    warmup_epochs: 5
    T_max: 80
