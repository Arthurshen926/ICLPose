# Joint 2DGS Geometry + DINOv2 fine Feature — OldHospital  v4-DINO
# ================================================================
# 全新联合重建: 几何 + DINOv2 fine 特征同步训练
#   - DINO fine: 64d @ 35×61 (1084 frames, via PCA压缩)
#   - 全部 v3 改进: depth supervision, sky mask, appearance, semantic reg
#   - 更频繁可视化 (eval_interval: 1000)
#   - GPU: 4 (15 GB free)
#
# DA3FeatureCache 按 scale 名称匹配: scale='fine_dino'
#   → 搜索 rgb_*_fine_dino_*.pt — 与现有文件名完全匹配
#
# Usage:
#   CUDA_VISIBLE_DEVICES=4 python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v4_dino.yaml

exp_name: joint_oh_v4_dino

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_multiscale_compressed/OldHospital_indexed
  feature_scales:
    - fine_dino     # DINOv2 ViT-G/14 PCA-64: 64d @ 35×61

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 30000
  longest_edge: 0           # Full resolution 1920×1080
  eval_interval: 1000       # 频繁可视化
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # Learning rates
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision (disabled: NFS too slow for pre-cache)
  mono_depth_dir: ""
  lambda_depth: 0.0
  depth_start_iter: 3000
  depth_warmup_iters: 2000

  # Densification (conservative)
  densify_from_iter: 500
  densify_until_iter: 20000
  densification_interval: 100
  densify_grad_threshold: 0.0001   # was 0.0002; lower = more densification (needed without depth)
  opacity_reset_interval: 6000    # was 3000; give more time to grow before reset
  opacity_reset_value: 0.01
  size_threshold: null             # was 20 (hardcoded); null = no screen-space pruning

  # Sky / object masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork
  use_appearance: true
  appearance_embed_dim: 32
  appearance_lr: 0.001
  appearance_reg: 0.0
  appearance_mean_reg: 0.01

  # Transient mask
  use_transient: true
  transient_lr: 0.001
  transient_reg: 0.01

  # Semantic-guided regularization
  semantic_mask_dir: dataset/OldHospital/semantic_masks
  vegetation_reg_scale: 0.1
  veg_prune_opacity: 0.0

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
