exp_name: dcff_oldhospital_v3_explicit_implicit
output_dir: output

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_radio_dual/OldHospital

model:
  sh_degree: 3
  white_background: false
  latent_dim: 16
  feature_dim: 64

fine_decoder:
  use_viewdirs: true
  view_degree: 2
  hidden_dim: 192
  num_layers: 4

hash_grid:
  input_mode: implicit_scale
  scale_dim: 2
  scale_pe_freqs: 4
  include_raw_scale: true
  n_levels: 16
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  max_resolution: 2048
  mlp_hidden: 160
  mlp_layers: 3

training:
  iterations: 30000
  freeze_geometry: true
  geometry_unfreeze_iter: 8000
  geometry_finetune_lr_scale: 0.1
  geometry_densify_after_unfreeze: false

  fine_start_iter: 0
  coarse_start_iter: 5000

  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001

  latent_lr: 0.0007
  lr_hash_grid: 0.001
  lr_fine_decoder: 0.002

  percent_dense: 0.01
  densify_from_iter: 999999
  densify_until_iter: 0
  densify_every: 100
  densify_grad_threshold: 0.0002
  min_opacity: 0.005
  max_num_gaussians: 500000
  opacity_reset_every: 999999

  longest_edge: 960

  log_every: 100
  save_every: 5000
  sh_degree_up_every: 1000

  loss:
    lambda_dssim: 0.2
    lambda_fine_cos: 0.6
    lambda_fine_l1: 0.25
    lambda_coarse_cos: 0.5
    lambda_coarse_l1: 0.2
    lambda_tv: 0.01
    lambda_normal: 0.01
    lambda_dist: 0.002