# ============================================================
#  refiner_oh_v5.yaml
#  PoseRefiner V5: High-resolution fine stage (68×120)
#
#  Key changes from V1:
#    - fine_hw = [68, 120] (up from [34, 60]) — use FULL RADIO resolution
#    - solver_hw = [68, 120] (same as fine — no upsampling needed)
#    - outer_iters = 1 (focus on single-step quality)
#    - fine_iters = 8 (more GRU iterations for sub-pixel accuracy)
#    - Warmstart from V1 latest (all weights compatible)
#
#  Theory: Operating at native RADIO feature resolution (68×120) doubles
#  the fine-level spatial precision. The solver directly uses fine output
#  without lossy upsampling artifacts. Single outer_iter training focuses
#  all capacity on the best first correction step.
#
#  Training:
#    CUDA_VISIBLE_DEVICES=1 python scripts/train_refiner.py \
#        --config configs/refiner_oh_v5.yaml \
#        --warmstart output/refiner_oh_v1/checkpoints/latest.pth
# ============================================================

exp_name: refiner_oh_v5
output_dir: output/refiner_oh_v5

model:
  in_dim: 64
  match_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 4               # ±4 pixels @ 68x120 = ±2.2° coverage
  fine_iters: 8                  # more GRU iters for sub-pixel accuracy
  damping: 0.001
  coarse_hw: [17, 30]           # same as V1 (global corr dim = 510, compatible)
  fine_hw: [68, 120]            # FULL RADIO resolution (up from 34×60)
  solver_hw: [68, 120]          # same as fine — direct solve, no upsampling
  solver_upsample: 4             # kept at 4 for V1 weight compat (upsampler unused)
  depth_normalize: false
  sequential_solve: true
  detach_conf: true
  conf_floor: 0.1
  solver_trans_scale: 0.0
  use_trans_head: false
  trans_head_mode: replace

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  feat_hw: [68, 120]
  img_hw: [1080, 1920]
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25
  batch_size: 8
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 200
  phase1_epochs: 200
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  outer_iters: 1                 # SINGLE STEP — focus on best first correction
  val_outer_iters: 5             # evaluate with 5 iters to see convergence
  loss:
    flow_weight: 5.0
    pose_weight: 0.0
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.8
    conf_reg_weight: 0.3
    contrast_weight: 0.5
    xi_weight: 0.0
  noise_curriculum:
    enabled: true
    warmup_epochs: 20
    base_rot_deg: 2.0
    base_trans_m: 0.05
    max_rot_deg: 8.0
    max_trans_m: 0.25
