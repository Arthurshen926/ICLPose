# exp140 — OldHospital: combine best ideas from exp138 + exp139
# skip_coarse_flow (bypass flat coarse correlation) + temp=0.5 (sharpen mid/fine)
# + mid_iters=3 (more refinement since starting from zero) + no IRLS
exp_name: exp140_oh_combined
output_dir: output/exp140_oh_combined

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 3
  coarse_hw: [15, 26]
  mid_hw: [30, 53]
  fine_hw: [69, 121]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 0
  skip_coarse_flow: true
  corr_temperature: 0.5

renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/oldhospital_v5_stride7_fx1663/per_scale/coarse.pth
    mid:       output/feature_3dgs/oldhospital_v5_stride7_fx1663/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/oldhospital_v5_stride7_fx1663/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/oldhospital_v5_stride7_fx1663/per_scale/fine_dino.pth
  img_height: 1080
  img_width: 1920
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  train_traj_path: output/features_multiscale_stride7_compressed/OldHospital_indexed/traj_w_c.txt
  train_feature_dir: output/features_multiscale_stride7_compressed/OldHospital_indexed
  val_split_ratio: 0.1
  batch_size: 8
  val_batch_size: 4
  num_workers: 4
  noise_rot_deg: 3.0
  noise_trans_m: 0.3

training:
  epochs: 200
  lr: 0.0003
  min_lr: 1.0e-06
  weight_decay: 0.0001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 10
  val_outer_iters: 10
  phase1_epochs: 5

  gamma: 0.95
  gamma_outer: 0.95

  loss:
    rot_loss_type: cosine
    rot_weight: 1.0
    trans_weight: 10.0
    flow_weights:
      coarse: 0.0
      mid: 0.5
      fine: 1.0

  noise_curriculum:
    enabled: false

  confidence:
    coverage_min: 0.05
    coverage_max: 0.95
    reg_weight: 0.01

  scheduler:
    type: cosine
    warmup_epochs: 5
