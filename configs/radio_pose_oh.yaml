# RadioPoseNet: OldHospital
# Transformer Cross-Attention + RAFT-style GRU + Geometry Solver
# 基于 RADIO 64d 特征 + 2DGS (v7_radio)

exp_name: radio_pose_oh
output_dir: output/radio_pose_oh

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  img_hw: [1080, 1920]
  feat_hw: [68, 120]      # RADIO native resolution
  # OldHospital intrinsics (from cameras.json, cx/cy = center)
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

model:
  feat_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 4
  fine_iters: 4
  damping: 0.001
  coarse_hw: [17, 30]    # 68/4, 120/4
  fine_hw: [34, 60]      # 68/2, 120/2
  irls_iters: 0

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  batch_size: 16
  val_batch_size: 8
  num_workers: 4
  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25

  noise_curriculum:
    enabled: true
    warmup_epochs: 40        # linearly ramp noise over 40 epochs
    base_rot_deg: 2.0        # start small (solver is well-conditioned)
    base_trans_m: 0.05
    max_rot_deg: 8.0
    max_trans_m: 0.25

training:
  epochs: 150
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  phase1_epochs: 10       # flow-only warmup (no pose loss)
  outer_iters: 3          # outer pose refinement loops during training
  val_outer_iters: 3      # outer loops during validation
  pose_loss_last_only: true  # only apply pose loss at last outer iter

  loss:
    flow_weight: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.8             # RAFT sequence loss decay
    conf_reg_weight: 0.1   # confidence regularization weight (prevents collapse)
    xi_weight: 1.0         # direct se3 xi supervision weight
    contrast_weight: 0.5   # contrastive matching loss (InfoNCE for discriminative projections)
