# ============================================================
#  refiner_oh_v18.yaml
#  PoseRefiner V18: Learned flow_scale head + multi-iter pose loss
#
#  Key innovation: instead of fixed flow_scale damping, the model
#  learns to predict its own step size alpha∈[0.1,1.0] per sample.
#  This allows the model to apply full corrections at large errors
#  and small corrections at small errors.
#
#  Uses outer_iters=2 with pose loss so the model learns that
#  overshooting on iter1 hurts iter2's pose accuracy.
#
#  Training:
#    CUDA_VISIBLE_DEVICES=4 nohup python -u scripts/train_refiner.py \
#        --config configs/refiner_oh_v18.yaml \
#        --warmstart output/refiner_oh_v8c/checkpoints/best.pth \
#        > output/refiner_oh_v18_train.log 2>&1 &
# ============================================================

exp_name: refiner_oh_v18
output_dir: output/refiner_oh_v18

model:
  in_dim: 64
  match_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 8
  fine_iters: 8
  damping: 0.001
  coarse_hw: [17, 30]
  fine_hw: [68, 120]
  solver_hw: [68, 120]
  solver_upsample: 4
  depth_normalize: false
  sequential_solve: true
  detach_conf: true
  conf_floor: 0.1
  solver_trans_scale: 0.0
  use_trans_head: false
  trans_head_mode: replace
  use_flow_scale_head: true   # NEW: learned per-sample step size

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  feat_hw: [68, 120]
  img_hw: [1080, 1920]
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 4.0
  val_noise_trans_m: 0.12
  batch_size: 2
  val_batch_size: 2
  num_workers: 4

training:
  epochs: 200
  phase1_epochs: 0           # Pose loss from the start
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  outer_iters: 2             # Multi-iter to train step size prediction
  val_outer_iters: 5
  grad_accum_steps: 4
  loss:
    flow_weight: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 0.0
    gamma: 0.8
    conf_reg_weight: 0.01
    contrast_weight: 0.0
    xi_weight: 0.0
  noise_curriculum:
    enabled: false
