# 隐式对应关系位姿估计训练配置文件 - exp018（修复平移学习）
# 问题诊断：exp017中旋转在改善(+10%)但平移在恶化(-23%)
# 解决方案：
#   1. 降低初始噪声，让模型专注于精细修正
#   2. 增大平移的Kendall初始权重
#   3. 使用标准模型（非迭代），简化问题

# 随机种子
seed: 42

# 输出目录
output_dir: "/home/yons/Projects/ICLPose/output/exp018"

# SplatLoc预训练模型配置
splatloc:
  gaussians_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  decoder_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/train_feat/ckpt.pth"
  config_path: "/home/yons/Projects/SplatLoc/configs/replica_nerf/base_config.yaml"
  freeze_decoder: true

# 场景配置
scene:
  bound: [[-1.0, 7.0], [-1.3, 3.7], [-1.7, 1.4]]
  voxel_sdf: 0.06

# 特征解码器配置
decoder:
  enc: 'HashGrid'
  num_layers: 4
  hidden_dim: 128
  final_dim: 256

# ICPoseNet模型配置 - 🔧 回退到标准模型简化调试
model:
  # 使用标准单阶段模型（更容易调试）
  model_type: 'standard'
  
  feature_dim: 256
  num_queries: 64
  fusion_layers: 4  # 增加融合层数
  num_heads: 8
  dropout: 0.1

# 数据集配置
dataset:
  data_root: "/home/yons/Projects/ICLPose/dataset/room_0"
  train_scene: "Sequence_1"
  val_scene: "Sequence_2"
  train_step: 1
  val_step: 1
  image_size: [640, 480]
  max_train_samples: null
  max_val_samples: null
  gaussian_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  use_depth: false
  
  # 🔧 大幅降低初始噪声（让模型学习精细修正）
  # 验证集初始位姿误差约4°/0.48m，目标是让模型输出低于这个值
  pose_noise_rot_deg: 2.0     # 从5°降到2°
  pose_noise_trans_m: 0.15    # 从0.3m降到0.15m
  
  # 相机内参
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

# 损失函数配置
loss:
  use_relative_pose: true
  normalize_translation: false
  
  # Kendall's Loss配置
  use_kendall: true
  # 🔧 大幅增加平移权重（解决平移学不好的问题）
  init_log_var_rotation: 1.0    # 降低旋转权重 (weight = exp(-1.0) = 0.37)
  init_log_var_translation: -2.0  # 增加平移权重 (weight = exp(2.0) = 7.4)
  
  rotation_loss: 'geodesic'
  translation_loss: 'l2'
  rotation_weight: 1.0
  translation_weight: 1.0
  
  # Diversity Loss配置
  diversity_weight: 0.05
  diversity_margin_2d: 16.0
  diversity_margin_3d: 0.16
  
  # Reprojection Loss配置（增加权重，提供更强的几何约束）
  reprojection_weight: 0.2

# 训练配置
training:
  num_epochs: 500
  batch_size: 32
  val_batch_size: 32
  num_workers: 8
  
  optimizer: 'adamw'
  learning_rate: 1.0e-4
  decoder_lr: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 5.0
  
  scheduler: 'cosine'
  min_lr: 1.0e-6
  
  val_interval: 2
  save_interval: 10
  log_interval: 10

# 可视化配置
visualization:
  enable: true
  vis_interval: 10
  num_samples: 3
  vis_types:
    pose_prediction: true
    feature_similarity: true
    correspondence: true
    query_evolution: false
