# ============================================================
#  exp033_room0_compressed.yaml
#  基于 exp032 架构, 使用 AE 压缩特征 + v8 几何体
#  关键调整:
#   1. 使用 compressed features (32d/64d) 代替 raw ODISE (512d)
#   2. 基于 v8 2DGS 几何体 (25.22 dB PSNR)
#   3. 重新训练的 v2 feature embedding (匹配 v8 几何)
#   4. 分辨率匹配 compressed 特征: 15×20, 30×40, 35×46
# ============================================================

exp_name: exp033b_room0_extended
output_dir: output/exp033_room0_compressed

# ── Model ──
model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  # Compressed feature resolutions (match AE output)
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [35, 46]
  # AE-compressed feature dimensions (ODISE 512d → AE → 32d/64d)
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64

# ── Renderer (3DGS) ──
renderer:
  ply_path: output/2dgs_models/room_0/v8_fixed_poses/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/room_0_v2/per_scale/coarse.pth
    mid:       output/feature_3dgs/room_0_v2/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/room_0_v2/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/room_0_v2/per_scale/fine_dino.pth
  img_height: 480
  img_width: 640
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

# ── Data ──
data:
  # Use AE-compressed features (64d/32d, matching 3DGS rendered output)
  train_feature_dir: output/features_multiscale_compressed/room_0
  train_traj_path: dataset/room_0/Sequence_1/traj_w_c.txt
  train_depth_dir: dataset/room_0/Sequence_1/depth

  val_feature_dir: null
  val_traj_path: dataset/room_0/Sequence_2/traj_w_c.txt
  val_depth_dir: dataset/room_0/Sequence_2/depth
  val_netvlad_poses: null
  val_split_ratio: 0.1

  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25

  batch_size: 4
  val_batch_size: 4
  num_workers: 4

# ── Training ──
training:
  epochs: 160
  phase1_epochs: 5
  lr: 0.0002
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  # 外层迭代精化 (critical for accuracy!)
  outer_iters: 3
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.8
    gamma_outer: 0.8

  # Noise curriculum
  noise_curriculum:
    enabled: true
    warmup_epochs: 40
    noise_rot_min: 2.0
    noise_trans_min: 0.05

  # Pose loss warmup
  pose_warmup:
    enabled: true
    warmup_epochs: 8
    min_weight: 0.1
