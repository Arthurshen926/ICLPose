# ============================================================
#  exp065_oldhospital_mid_iters.yaml
#  OldHospital: More mid iterations for better mid-scale correction
#  Key changes vs exp035:
#    - mid_iters: 1 → 3
#    - batch_size: 2 → 4 (push GPU utilization)
#    - lr: 0.0002 → 0.0001 (gentler for warmstart)
#    - Keep proven recipe: gamma=0.8, oi=3, curriculum
#    - warmstart from exp035 best
# ============================================================

exp_name: exp065_oldhospital_mid_iters
output_dir: output/exp065_oldhospital_mid_iters

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 3
  coarse_hw: [15, 26]
  mid_hw: [30, 53]
  fine_hw: [35, 61]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64

renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/oldhospital_v1/per_scale/coarse.pth
    mid:       output/feature_3dgs/oldhospital_v1/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/oldhospital_v1/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/oldhospital_v1/per_scale/fine_dino.pth
  img_height: 1080
  img_width: 1920
  fx: 1673.5
  fy: 1673.5
  cx: 960.0
  cy: 540.0

data:
  train_feature_dir: output/features_multiscale_compressed/OldHospital_indexed
  train_traj_path: output/features_multiscale_compressed/OldHospital_indexed/traj_w_c.txt
  train_depth_dir: null

  val_feature_dir: null
  val_split_ratio: 0.1

  noise_rot_deg: 10.0
  noise_trans_m: 1.0
  val_noise_rot_deg: 10.0
  val_noise_trans_m: 1.0

  batch_size: 4
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 80
  phase1_epochs: 3
  lr: 0.0001
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 3
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.8
    gamma_outer: 0.8

  noise_curriculum:
    enabled: true
    warmup_epochs: 30
    noise_rot_min: 2.0
    noise_trans_min: 0.1

  pose_warmup:
    enabled: true
    warmup_epochs: 3
    min_weight: 0.1
