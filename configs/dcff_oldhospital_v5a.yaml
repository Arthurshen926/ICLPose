# DCFF v5a — Online RADIO teacher, no PCA, learned projection
#
# Key difference from v4: RADIO runs online, features projected 1280→128
# by a trainable linear layer initialized from PCA components.
# Latent dim doubled (32d) for more expressive fine features.

exp_name: dcff_oldhospital_v5a
output_dir: output

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_radio_dual/OldHospital

teacher:
  mode: online
  shallow_block: 10
  radio_repo: feature_extract/checkpoints/RADIO
  pca_init_dir: output/features_radio_dual/OldHospital/pca_params
  lr_projection: 0.0005

model:
  sh_degree: 3
  white_background: false
  latent_dim: 32
  feature_dim: 128

fine_decoder:
  use_viewdirs: true
  view_degree: 2
  hidden_dim: 256
  num_layers: 5

hash_grid:
  input_mode: implicit_scale
  scale_dim: 2
  scale_pe_freqs: 4
  include_raw_scale: true
  n_levels: 16
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  max_resolution: 2048
  mlp_hidden: 256
  mlp_layers: 4

training:
  init_ply: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  iterations: 30000
  freeze_geometry: true
  batch_size: 2

  fine_start_iter: 0
  coarse_start_iter: 2000
  warmup_iters: 200
  grad_clip: 1.0
  coarse_downsample: true

  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001

  latent_lr: 0.001
  lr_hash_grid: 0.001
  lr_fine_decoder: 0.002

  percent_dense: 0.01
  densify_from_iter: 999999
  densify_until_iter: 0
  densify_every: 100
  densify_grad_threshold: 0.0002
  min_opacity: 0.005
  max_num_gaussians: 500000
  opacity_reset_every: 999999

  longest_edge: 960

  log_every: 100
  save_every: 5000
  val_every: 5000
  sh_degree_up_every: 1000

  loss:
    lambda_dssim: 0.2
    lambda_fine_cos: 0.65
    lambda_fine_l1: 0.2
    lambda_coarse_cos: 0.45
    lambda_coarse_l1: 0.15
    lambda_tv: 0.02
    lambda_normal: 0.0
    lambda_dist: 0.0
