# ============================================================
#  exp069_render_ref_warmstart.yaml
#  OldHospital: Warm-start from exp059 (depth-warp best: 0.04°)
#  + Rendered reference features (PCA-nomean)
#
#  Hypothesis: exp059's learned representations may transfer to
#  rendered features with lower LR fine-tuning.
# ============================================================

exp_name: exp069_render_ref_warmstart
output_dir: output/exp069_render_ref_warmstart

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 26]
  mid_hw: [30, 53]
  fine_hw: [35, 61]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64

renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/oldhospital_pca_v1/per_scale/coarse.pth
    mid:       output/feature_3dgs/oldhospital_pca_v1/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/oldhospital_pca_v1/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/oldhospital_pca_v1/per_scale/fine_dino.pth
  img_height: 1080
  img_width: 1920
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  train_feature_dir: output/features_pca_nomean/OldHospital_indexed
  train_traj_path: output/features_pca_nomean/OldHospital_indexed/traj_w_c.txt

  val_feature_dir: null
  val_traj_path: null
  val_netvlad_poses: null
  val_split_ratio: 0.1

  noise_rot_deg: 10.0
  noise_trans_m: 0.5
  val_noise_rot_deg: 10.0
  val_noise_trans_m: 0.5

  batch_size: 8
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 150
  phase1_epochs: 0
  lr: 0.00005
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  use_depth_warp: true
  ref_feature_dir: output/features_pca_nomean_rendered/OldHospital_indexed

  outer_iters: 5
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.3
      mid: 0.5
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: true
    noise_rot_min: 2.0
    noise_trans_min: 0.05
    warmup_epochs: 40
