# ============================================================
#  exp060_single_scale.yaml
#  SingleScalePoseNet on Cambridge Landmarks OldHospital
#  Single-scale DA3 64d fine features + dilated correlation
#  + GRU iteration + geometry solver
# ============================================================

exp_name: exp060_single_scale
output_dir: output/exp060_single_scale

# ── Model ──
model:
  hidden_dim: 128
  decode_dim: 64
  feat_in_dim: 64          # DA3 fine features are 64d
  local_radius: 4
  corr_dilations: [1, 2, 4]  # multi-scale: r=4 covers ±4/8/16 pixels
  fine_iters: 4            # start with 4, increase later
  damping: 0.001
  fine_hw: [69, 121]       # DA3 fine resolution
  irls_iters: 3
  irls_huber_k: 1.345
  robust_kernel: huber
  pixel_stride: 1

# ── Renderer (per-Gaussian fine features) ──
renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    fine: output/feature_3dgs/oldhospital_da3_perscale_v2/fine/best_model.pth
  # triplane_model_path: output/feature_3dgs/oldhospital_triplane_single_v1/best_model.pth
  scale_resolutions:
    fine: [69, 121]
  img_height: 1080
  img_width: 1920
  fx: 1673.5
  fy: 1673.5
  cx: 960.0
  cy: 540.0

# ── Data (DA3 unified extraction) ──
data:
  train_feature_dir: output/features_da3_unified/OldHospital
  train_traj_path: output/features_da3_unified/OldHospital/traj_w_c.txt

  val_feature_dir: null
  val_traj_path: null
  val_netvlad_poses: null
  val_split_ratio: 0.1

  noise_rot_deg: 8.0
  noise_trans_m: 0.5
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.5

  batch_size: 2
  val_batch_size: 2
  num_workers: 4

# ── Training ──
training:
  lr: 2e-4
  weight_decay: 1e-5
  min_lr: 1e-6
  epochs: 120
  phase1_epochs: 10       # first 10 epochs: flow only
  grad_clip: 1.0
  use_amp: true

  loss:
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.85            # RAFT sequence loss decay
    huber_delta: 5.0
    conf_reg_weight: 0.01
    gamma_outer: 0.8

  outer_iters: 1           # start with 1, increase later
  val_outer_iters: 3       # fewer outer iters at val for speed

  noise_curriculum:
    enabled: true
    warmup_epochs: 40
    start_rot_deg: 2.0
    start_trans_m: 0.1
