# 隐式对应关系位姿估计训练配置文件 - exp019（使用初始位姿进行视锥裁切）
# 
# 关键改进：
#   1. 使用初始位姿（带噪声）进行视锥裁切，而不是GT位姿
#   2. 扩大视锥边界，允许更多点进入训练
#   3. 添加负样本（视锥外的点），让模型学会区分
#   4. 使用迭代精化模型，多阶段修正
#
# 这样更符合实际推理场景：模型只能看到初始位姿可见的区域

# 随机种子
seed: 42

# 输出目录
output_dir: "/home/yons/Projects/ICLPose/output/exp019"

# SplatLoc预训练模型配置
splatloc:
  gaussians_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  decoder_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/train_feat/ckpt.pth"
  config_path: "/home/yons/Projects/SplatLoc/configs/replica_nerf/base_config.yaml"
  freeze_decoder: true

# 场景配置
scene:
  bound: [[-1.0, 7.0], [-1.3, 3.7], [-1.7, 1.4]]
  voxel_sdf: 0.06

# 特征解码器配置
decoder:
  enc: 'HashGrid'
  num_layers: 4
  hidden_dim: 128
  final_dim: 256

# ICPoseNet模型配置 - 使用迭代精化模型
model:
  model_type: 'iterative'
  
  feature_dim: 256
  num_queries: 128        # 增加query数量
  fusion_layers: 4
  num_heads: 8
  dropout: 0.1
  
  # 迭代精化配置
  num_stages: 3           # 3阶段精化
  
# 数据集配置
dataset:
  data_root: "/home/yons/Projects/ICLPose/dataset/room_0"
  train_scene: "Sequence_1"
  val_scene: "Sequence_2"
  train_step: 1
  val_step: 1
  image_size: [640, 480]
  max_train_samples: null
  max_val_samples: null
  gaussian_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  use_depth: false
  
  # 位姿噪声 - 模拟粗略初始定位
  pose_noise_rot_deg: 5.0     # 5度旋转噪声
  pose_noise_trans_m: 0.3     # 0.3米平移噪声
  
  # 🆕 视锥裁切配置 - 关键改进！
  use_init_pose_for_culling: true   # 使用初始位姿（带噪声）进行裁切
  frustum_margin: 50.0              # 扩大视锥边界50像素
  negative_ratio: 0.0               # 不使用负样本（重投影损失已有类似效果）
  
  # 相机内参
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

# 损失函数配置
loss:
  use_relative_pose: true
  normalize_translation: false
  
  # Kendall's Loss配置
  use_kendall: true
  init_log_var_rotation: 0.0      # 平衡的初始权重
  init_log_var_translation: -1.0  # 稍微偏重平移
  
  rotation_loss: 'geodesic'
  translation_loss: 'l2'
  rotation_weight: 1.0
  translation_weight: 1.0
  
  # Diversity Loss配置（鼓励query分散）
  diversity_weight: 0.05
  diversity_margin_2d: 16.0
  diversity_margin_3d: 0.16
  
  # Reprojection Loss配置
  reprojection_weight: 0.1

# 训练配置
training:
  num_epochs: 300
  batch_size: 24            # 稍微减小batch size（更多query）
  val_batch_size: 24
  num_workers: 8
  
  optimizer: 'adamw'
  learning_rate: 1.0e-4
  decoder_lr: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 5.0
  
  scheduler: 'cosine'
  min_lr: 1.0e-6
  
  val_interval: 2
  save_interval: 10
  log_interval: 10

# 可视化配置
visualization:
  enable: true
  vis_interval: 10
  num_samples: 3
  vis_types:
    pose_prediction: true
    feature_similarity: true
    correspondence: true
    query_evolution: false
