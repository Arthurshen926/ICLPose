# ============================================================
#  exp085_stairs_maxbatch.yaml
#  Stairs: Maximum GPU utilization (oi=10, bs=12, fi=12)
#  Target: fill 24GB GPU. Warmstart from exp083 best (1.28°)
#  Key: higher oi than exp083 (5→10) for more iterative refinement
# ============================================================

exp_name: exp085_stairs_maxbatch
output_dir: output/exp085_stairs_maxbatch

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 12
  mid_iters: 3
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [35, 46]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 3

renderer:
  ply_path: output/2dgs_models/stairs/v5_minN/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/stairs_v3/per_scale/coarse.pth
    mid:       output/feature_3dgs/stairs_v3/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/stairs_v3/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/stairs_v3/per_scale/fine_dino.pth
  img_height: 480
  img_width: 640
  fx: 525.0
  fy: 525.0
  cx: 319.5
  cy: 239.5

data:
  train_feature_dir: output/features_multiscale_compressed/stairs_seq02
  train_traj_path: dataset/stairs/seq-02/traj_w_c.txt
  train_depth_dir: output/depth_links/stairs_seq02

  val_feature_dir: null
  val_split_ratio: 0.1

  noise_rot_deg: 8.0
  noise_trans_m: 0.15
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.15

  batch_size: 24
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 120
  phase1_epochs: 3
  lr: 0.0001
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 10
  val_outer_iters: 10

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: false

  pose_warmup:
    enabled: true
    warmup_epochs: 3
    min_weight: 0.1
