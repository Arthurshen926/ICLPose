# ============================================================
#  exp052_oldhospital_curriculum95.yaml
#  OldHospital: curriculum + gamma=0.95 + oi=5 + batch_size=8
#  
#  Key insight: OldHospital NEEDS curriculum (exp040/049 failed
#  with constant noise at gamma=0.95). But curriculum + gamma=0.8
#  also struggles (exp035 plateau at 3.27°). This config tries
#  the best of both: curriculum for stable initial learning,
#  gamma=0.95 + oi=5 for iterative refinement.
#  
#  Changes vs exp049 (failed):
#    - curriculum noise: 5° → 15° over 30 epochs
#    - batch_size 2 → 8 (fill VRAM)
#    - lr scaled up for larger batch
# ============================================================

exp_name: exp052_oldhospital_curriculum95
output_dir: output/exp052_oldhospital_curriculum95

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 26]
  mid_hw: [30, 53]
  fine_hw: [35, 61]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64

renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/oldhospital_v1/per_scale/coarse.pth
    mid:       output/feature_3dgs/oldhospital_v1/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/oldhospital_v1/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/oldhospital_v1/per_scale/fine_dino.pth
  img_height: 1080
  img_width: 1920
  fx: 1673.5
  fy: 1673.5
  cx: 960.0
  cy: 540.0

data:
  train_feature_dir: output/features_multiscale_compressed/OldHospital_indexed
  train_traj_path: output/features_multiscale_compressed/OldHospital_indexed/traj_w_c.txt

  val_feature_dir: null
  val_traj_path: null
  val_netvlad_poses: null
  val_split_ratio: 0.1

  noise_rot_deg: 15.0
  noise_trans_m: 1.5
  val_noise_rot_deg: 10.0
  val_noise_trans_m: 1.0

  batch_size: 8
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 120
  phase1_epochs: 5
  lr: 0.0003
  min_lr: 0.000005
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 5
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: true
    start_noise_rot: 5.0
    end_noise_rot: 15.0
    start_noise_trans: 0.3
    end_noise_trans: 1.5
    warmup_epochs: 3
    ramp_epochs: 30

  pose_warmup:
    enabled: true
    warmup_epochs: 8
    min_weight: 0.1
