# exp114 — stairs low-noise fine-tune from exp110 best (1.26° median)
# Low noise (2°/0.05m) + lower lr + longer training
# Same recipe that gave 3× improvement for room_0 (0.36° → 0.12°)
exp_name: exp114_stairs_lownoise
output_dir: output/exp114_stairs_lownoise

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [69, 91]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 3

renderer:
  ply_path: output/2dgs_models/stairs/v5_minN/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/stairs_v5_stride7_fx525/per_scale/coarse.pth
    mid:       output/feature_3dgs/stairs_v5_stride7_fx525/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/stairs_v5_stride7_fx525/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/stairs_v5_stride7_fx525/per_scale/fine_dino.pth
  fx: 525.505
  fy: 525.505
  cx: 320.0
  cy: 240.0

data:
  train_traj_path: dataset/stairs/seq-02/traj_w_c.txt
  train_feature_dir: output/features_multiscale_stride7_compressed/stairs_seq02
  val_split_ratio: 0.1
  batch_size: 8
  val_batch_size: 2
  num_workers: 4
  # LOW NOISE — key change for fine-tuning
  noise_rot_deg: 2.0
  noise_trans_m: 0.05

training:
  epochs: 100
  lr: 0.00005
  min_lr: 1.0e-07
  weight_decay: 0.0001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 10
  val_outer_iters: 15
  phase1_epochs: 0

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    use_huber: true
    huber_delta: 0.5
    conf_reg_weight: 0.01
    conf_coverage_range: [0.05, 0.95]

  scheduler:
    type: cosine
    warmup_epochs: 3
    T_max: 100
