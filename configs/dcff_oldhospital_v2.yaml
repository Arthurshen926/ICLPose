# DCFF v2: Use pretrained geometry from reference 2DGS model
# Key changes from v1:
#   - Initialize from pretrained PLY (50K Gaussians, good geometry)
#   - Freeze geometry, only train latent + decoder + hash grid
#   - Reduced feature loss weights (avoid geometry destabilization)
#   - No densification/pruning needed (geometry is frozen)
#   - Increased latent_dim to 32 (reduce compression bottleneck)

exp_name: dcff_oldhospital_v2
output_dir: output

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_radio_dual/OldHospital

model:
  sh_degree: 3
  white_background: false
  latent_dim: 32        # Increased from 16 → 32 to reduce bottleneck
  feature_dim: 64       # Target feature dimension (matches RADIO PCA output)

hash_grid:
  n_levels: 16
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  max_resolution: 2048
  sh_degree: 3
  mlp_hidden: 128
  mlp_layers: 2

training:
  iterations: 30000
  freeze_geometry: true   # Freeze xyz, rotation, scaling, opacity, SH

  # Phase schedule (faster, since geometry is ready)
  fine_start_iter: 0      # Start fine features immediately (no geometry warmup needed)
  coarse_start_iter: 5000 # Start coarse features after fine stabilizes

  # Geometry LR (unused when frozen, but kept for compatibility)
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001

  # Latent + DCFF module LR
  latent_lr: 0.001        # Higher LR since it's the main trainable param
  lr_hash_grid: 0.001
  lr_fine_decoder: 0.001  # Increased from 0.0001 → 0.001

  # Densification (disabled for frozen geometry)
  percent_dense: 0.01
  densify_from_iter: 999999
  densify_until_iter: 0
  densify_every: 100
  densify_grad_threshold: 0.0002
  min_opacity: 0.005
  max_num_gaussians: 500000
  opacity_reset_every: 999999  # Never reset

  # Image processing
  longest_edge: 960

  # Logging / checkpoint
  log_every: 100
  save_every: 5000
  sh_degree_up_every: 1000

  # Loss weights — reduced feature loss to avoid overwhelming latent training
  loss:
    lambda_dssim: 0.2
    lambda_fine_cos: 0.5     # Reduced from 1.0
    lambda_fine_l1: 0.2      # Reduced from 0.5
    lambda_coarse_cos: 0.5   # Reduced from 1.0
    lambda_coarse_l1: 0.2    # Reduced from 0.5
    lambda_tv: 0.01
    lambda_normal: 0.0       # No normal loss (geometry frozen)
    lambda_dist: 0.0         # No distortion loss (geometry frozen)
