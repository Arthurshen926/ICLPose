# Joint 2DGS Geometry + RADIO Feature — OldHospital  v8-RADIO
# =============================================================
# 植被 scale clamping 版: 修复v7中的两个关键问题
#
# v7 问题诊断 (iter 6000 首次修剪):
#   - veg_prune_opacity=0.15 仅修剪5个 (大部分植被opacity>0.15)
#   - veg_prune_scale_percentile=95 仅修剪3个 (全局百分位→很少命中植被)
#
# v8 关键改进:
#   1. scale_percentile 现在基于植被Gaussian本身(不再是全局)
#   2. 新增 veg_max_scale=0.05: 硬上限植被scale≤0.05*extent(≈1.74)
#   3. 植被局部 p80 修剪: 移除最大20%的植被Gaussian
#   4. 保持 veg_prune_opacity=0.15 (opacity修剪仍有效)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=4 python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v8_radio.yaml

exp_name: joint_oh_v8_radio

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_radio/OldHospital_indexed
  feature_scales:
    - fine_radio

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 40000
  longest_edge: 0
  eval_interval: 1000
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # Learning rates — same as v5 baseline
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision — exclude vegetation
  mono_depth_dir: output/oh_depth_local/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000
  depth_exclude_vegetation: true

  # Densification
  densify_from_iter: 500
  densify_until_iter: 25000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 5000         # 更频繁 (v7=6000) → 更多修剪+clamp机会
  opacity_reset_value: 0.01
  size_threshold: null
  max_gaussians: 0

  # Sky / object masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork
  use_appearance: true
  appearance_embed_dim: 32
  appearance_lr: 0.001
  appearance_reg: 0.0
  appearance_mean_reg: 0.01

  # Transient mask
  use_transient: true
  transient_lr: 0.001
  transient_reg: 0.01

  # Semantic-guided vegetation control — v8 CORE CHANGES
  semantic_mask_dir: dataset/OldHospital/semantic_masks
  vegetation_reg_scale: 0.3
  vegetation_scale_boost: 3.0
  veg_prune_opacity: 0.15              # 同v7: 修剪低opacity植被
  veg_prune_scale_percentile: 80       # p80 植被局部 → 修剪最大20%植被Gaussian
  veg_max_scale: 0.05                  # NEW: 硬上限 = 0.05*34.88 ≈ 1.74 scene units

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
