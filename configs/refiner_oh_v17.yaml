# ============================================================
#  refiner_oh_v17.yaml
#  PoseRefiner V17: Pose-loss supervised model at 68×120
#
#  KEY CHANGE: Add direct pose supervision (pose_weight > 0)
#  from the start (phase1_epochs=0) to teach the model to
#  minimize actual pose error, not just match flow patterns.
#
#  Hypothesis: Flow loss teaches the model to predict flow that 
#  looks like GT flow, but doesn't penalize flow noise when the
#  displacement is small. Pose loss directly penalizes the 
#  resulting pose error, encouraging the model to output small/zero
#  flow when the pose is already close.
#
#  Config: 68×120, r=8, noise 4° (within ±4.41° capture range)
#  Warmstart from V8c best.
#
#  Training:
#    CUDA_VISIBLE_DEVICES=0 nohup python -u scripts/train_refiner.py \
#        --config configs/refiner_oh_v17.yaml \
#        --warmstart output/refiner_oh_v8c/checkpoints/best.pth \
#        > output/refiner_oh_v17_train.log 2>&1 &
# ============================================================

exp_name: refiner_oh_v17
output_dir: output/refiner_oh_v17

model:
  in_dim: 64
  match_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 8
  fine_iters: 8
  damping: 0.001
  coarse_hw: [17, 30]
  fine_hw: [68, 120]
  solver_hw: [68, 120]
  solver_upsample: 4
  depth_normalize: false
  sequential_solve: true
  detach_conf: true
  conf_floor: 0.1
  solver_trans_scale: 0.0
  use_trans_head: false
  trans_head_mode: replace

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  feat_hw: [68, 120]
  img_hw: [1080, 1920]
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  noise_rot_deg: 4.0
  noise_trans_m: 0.12
  val_noise_rot_deg: 4.0
  val_noise_trans_m: 0.12
  batch_size: 2
  val_batch_size: 2
  num_workers: 4

training:
  epochs: 200
  phase1_epochs: 0       # Pose loss from the start!
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  outer_iters: 1
  val_outer_iters: 5
  grad_accum_steps: 4
  loss:
    flow_weight: 5.0
    pose_weight: 1.0     # Direct pose supervision
    rot_weight: 1.0
    trans_weight: 0.0     # No translation (solver_trans_scale=0)
    gamma: 0.8
    conf_reg_weight: 0.3
    contrast_weight: 0.5
    xi_weight: 0.0
  noise_curriculum:
    enabled: false
