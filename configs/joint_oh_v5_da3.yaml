# Joint 2DGS Geometry + DA3 fine Feature — OldHospital  v5-DA3
# ============================================================
# v5 改进点 (相比v4):
#   1. 重新启用深度监督 (depth maps 已复制到本地, 无NFS挂起风险)
#      → 期望: N从~115k增至400k-900k, PSNR从15.3dB提升至~16dB
#   2. 恢复densify_grad_threshold=0.0002 (有深度梯度时无需如此低的阈值)
#   3. 延长densify_until_iter: 20000→25000 (多5k迭代恢复opacity reset后的数量)
#   4. 延长总迭代: 30000→40000 (更充分的几何细化)
#   5. opacity_reset_interval保持6000 (有深度后重置恢复更快)
#   6. 修复: alpha可视化 bug已修复 (rend_alpha key)
#
# Feature: DA3 fine (64d @ 69×121), 1077 frames
# GPU: 2 (19 GB free)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=2 python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v5_da3.yaml

exp_name: joint_oh_v5_da3

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_da3/OldHospital_indexed
  feature_scales:
    - fine          # DA3 DPT output_conv1: 64d @ 69×121

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 40000
  longest_edge: 0           # Full resolution 1920×1080
  eval_interval: 1000       # 频繁可视化
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # Learning rates
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision — v5: ENABLED (local copy, no NFS hang)
  mono_depth_dir: output/oh_depth_local/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000

  # Densification — v5: restored grad_threshold + extended densify_until_iter
  densify_from_iter: 500
  densify_until_iter: 25000         # was 20000; +5k to recover after last reset
  densification_interval: 100
  densify_grad_threshold: 0.0002   # was 0.0001; restored (depth grads are stronger)
  opacity_reset_interval: 6000    # same as v4; 40k total → resets at 6k/12k/18k/24k
  opacity_reset_value: 0.01
  size_threshold: null             # no screen-space pruning

  # Sky / object masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork
  use_appearance: true
  appearance_embed_dim: 32
  appearance_lr: 0.001
  appearance_reg: 0.0
  appearance_mean_reg: 0.01

  # Transient mask
  use_transient: true
  transient_lr: 0.001
  transient_reg: 0.01

  # Semantic-guided regularization
  semantic_mask_dir: dataset/OldHospital/semantic_masks
  vegetation_reg_scale: 0.1
  veg_prune_opacity: 0.0

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
