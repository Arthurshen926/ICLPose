# ============================================================
#  exp161_oh_flowfeat_v2.yaml
#  OldHospital: FlowFeat DPT FINAL output + PCA + Per-Gaussian
#
#  Bug fix from exp160: uses FINAL DPT output (full refinenet
#  chain + output_conv + LayerNorm) instead of intermediates.
#  128d FINAL → PCA → 32/64/64d matching baseline dims.
#
#  FlowFeat view consistency: 0.80-0.85 (vs baseline 0.94-0.97)
#  Render cosine: ~0.45 (vs baseline ~0.95) — lower quality
#
#  3 scales (instead of 4): coarse/mid/fine
#  Baseline resolutions: 15×26 / 30×53 / 35×61
# ============================================================

exp_name: exp161_oh_flowfeat_v2
output_dir: output/exp161_oh_flowfeat_v2

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 6
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [15, 26]
  mid_hw: [30, 53]
  fine_hw: [35, 61]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_in_dim: 64
  flowfeat_mode: true

renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse: output/feature_3dgs/oldhospital_flowfeat_v2_pca_lr/per_scale/coarse.pth
    mid: output/feature_3dgs/oldhospital_flowfeat_v2_pca_lr/per_scale/mid.pth
    fine: output/feature_3dgs/oldhospital_flowfeat_v2_pca_lr/per_scale/fine.pth
  scale_resolutions:
    coarse: [15, 26]
    mid: [30, 53]
    fine: [35, 61]
  img_height: 1080
  img_width: 1920
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  train_feature_dir: output/features_flowfeat_v2_pca_lr/OldHospital
  train_traj_path: output/features_flowfeat_v2_pca_lr/OldHospital/traj_w_c.txt
  scale_names: [coarse, mid, fine]

  val_feature_dir: null
  val_traj_path: null
  val_netvlad_poses: null
  val_split_ratio: 0.1

  noise_rot_deg: 10.0
  noise_trans_m: 0.5
  val_noise_rot_deg: 10.0
  val_noise_trans_m: 0.5

  batch_size: 4
  val_batch_size: 2
  num_workers: 4

training:
  epochs: 150
  phase1_epochs: 10
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  use_depth_warp: false

  outer_iters: 3
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.3
      mid: 0.5
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: true
    noise_rot_min: 2.0
    noise_trans_min: 0.05
    warmup_epochs: 40
