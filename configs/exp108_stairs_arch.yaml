# exp108 — stairs with untested architectural features at stride-7
# Key changes from exp107:
#   1. cross_scale_context: true — passes coarse-scale context to finer stages
#   2. deep_flow_head: true — 3 residual blocks in flow refinement head
#   3. corr_dilations: [1, 2] — wider correlation receptive field
#   4. fine_iters: 12 — same as exp107
#   5. geometry_upsample: 2 — same as exp107
# These 3 features were tested at stride-14 but NEVER at stride-7.
# Warmstart from exp101 (strict=False handles new params)

exp_name: exp108_stairs_arch
output_dir: output/exp108_stairs_arch

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 4
  damping: 0.001
  fine_iters: 12
  mid_iters: 2
  coarse_hw: [15, 20]
  mid_hw: [30, 40]
  fine_hw: [69, 91]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_sd_in_dim: 64
  fine_dino_in_dim: 64
  irls_iters: 3
  geometry_upsample: 2
  cross_scale_context: true
  cross_scale_dim: 32
  deep_flow_head: true
  corr_dilations: [1, 2]

renderer:
  ply_path: output/2dgs_models/stairs/v5_minN/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    coarse:    output/feature_3dgs/stairs_v4_stride7/per_scale/coarse.pth
    mid:       output/feature_3dgs/stairs_v4_stride7/per_scale/mid.pth
    fine_sd:   output/feature_3dgs/stairs_v4_stride7/per_scale/fine_sd.pth
    fine_dino: output/feature_3dgs/stairs_v4_stride7/per_scale/fine_dino.pth

data:
  train_traj_path: dataset/stairs/seq-02/traj_w_c.txt
  train_feature_dir: output/features_multiscale_stride7_compressed/stairs_seq02
  val_split_ratio: 0.1
  batch_size: 4
  val_batch_size: 2
  num_workers: 4
  noise_rot_deg: 8.0
  noise_trans_m: 0.25

training:
  epochs: 120
  lr: 0.0002
  min_lr: 1.0e-06
  weight_decay: 0.0001
  grad_clip: 1.0
  use_amp: true

  outer_iters: 10
  val_outer_iters: 10
  phase1_epochs: 5

  loss:
    flow_weights:
      coarse: 0.1
      mid: 0.3
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    use_huber: true
    huber_delta: 0.5
    conf_reg_weight: 0.05
    conf_coverage_range: [0.05, 0.95]

  scheduler:
    type: cosine
    warmup_epochs: 5
    T_max: 120
