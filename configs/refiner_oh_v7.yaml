# ============================================================
#  refiner_oh_v7.yaml
#  PoseRefiner V7: Small-noise precision specialist (high-res)
#
#  Based on V5 but with max_noise=4° instead of 8°.
#  At 4°, the signal-to-noise ratio is better for learning
#  sub-degree precision. Intended as a "second-stage" model:
#  after V5 brings error from 8°→~3°, V7 refines ~3°→lower.
#
#  Key differences from V5:
#    - max_rot_deg: 4.0 (half of V5)
#    - max_trans_m: 0.12 (proportional)
#    - data noise: 4°/0.12m (train+val)
#    - warmup_epochs: 10 (faster ramp for smaller range)
#
#  Training:
#    CUDA_VISIBLE_DEVICES=2 python scripts/train_refiner.py \
#        --config configs/refiner_oh_v7.yaml \
#        --warmstart output/refiner_oh_v1/checkpoints/latest.pth
# ============================================================

exp_name: refiner_oh_v7
output_dir: output/refiner_oh_v7

model:
  in_dim: 64
  match_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 4
  fine_iters: 8
  damping: 0.001
  coarse_hw: [17, 30]
  fine_hw: [68, 120]
  solver_hw: [68, 120]
  solver_upsample: 4
  depth_normalize: false
  sequential_solve: true
  detach_conf: true
  conf_floor: 0.1
  solver_trans_scale: 0.0
  use_trans_head: false
  trans_head_mode: replace

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  feat_hw: [68, 120]
  img_hw: [1080, 1920]
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  noise_rot_deg: 4.0
  noise_trans_m: 0.12
  val_noise_rot_deg: 4.0
  val_noise_trans_m: 0.12
  batch_size: 8
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 200
  phase1_epochs: 200
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  outer_iters: 1
  val_outer_iters: 5
  loss:
    flow_weight: 5.0
    pose_weight: 0.0
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.8
    conf_reg_weight: 0.3
    contrast_weight: 0.5
    xi_weight: 0.0
  noise_curriculum:
    enabled: true
    warmup_epochs: 10
    base_rot_deg: 1.0
    base_trans_m: 0.02
    max_rot_deg: 4.0
    max_trans_m: 0.12
