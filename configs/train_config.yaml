# 隐式对应关系位姿估计训练配置文件
# 使用方法: python train.py --config configs/train_config.yaml

# 随机种子
seed: 42

# 输出目录
output_dir: "/home/yons/Projects/implicit_correspondence/output/exp014"

# SplatLoc预训练模型配置
splatloc:
  # Gaussian模型路径（.ply文件）
  gaussians_path: "/home/yons/Projects/data/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  
  # 特征解码器路径（.pth文件）
  decoder_path: "/home/yons/Projects/data/room_0/splatloc-test/data/room_0/train_feat/ckpt.pth"
  
  # SplatLoc配置文件路径（可选，用于正确加载FeatureDecoder）
  # 如果不提供，将使用下面decoder和scene配置
  config_path: "/home/yons/Projects/SplatLoc/configs/replica_nerf/base_config.yaml"
  
  # 是否冻结解码器参数（True: 冻结，False: 可训练）
  freeze_decoder: true

# 场景配置（需与训练FeatureDecoder时使用的一致！）
scene:
  # 场景边界 [[x_min, x_max], [y_min, y_max], [z_min, z_max]]
  # 注意：这必须与训练decoder时使用的边界完全一致，否则HashGrid大小会不匹配
  # 从SplatLoc训练配置获取的真实边界
  bound: [[-1.0, 7.0], [-1.3, 3.7], [-1.7, 1.4]]
  # SDF体素大小（从训练配置获取）
  voxel_sdf: 0.06

# 特征解码器配置（需与训练时一致）
decoder:
  enc: 'HashGrid'  # HashGrid, identity, freq
  num_layers: 4
  hidden_dim: 128
  final_dim: 256

# ICPoseNet模型配置
model:
  # 特征维度（应与decoder的final_dim一致）
  feature_dim: 256
  
  # 可学习query的数量（降低以加速训练和收敛）
  num_queries: 64
  
  # 跨模态融合层数（🆕 对齐ICL-I2PReg：固定为2层 = 1个img block + 1个pcd block）
  fusion_layers: 2
  
  # 注意力头数
  num_heads: 8
  
  # Dropout概率
  dropout: 0.1

# 数据集配置
dataset:
  # 数据根目录
  data_root: "/home/yons/Projects/data/room_0"
  
  # 训练场景名称
  train_scene: "Sequence_1"
  
  # 验证场景名称（使用不同序列避免数据泄露）
  val_scene: "Sequence_2"
  
  # 训练集采样间隔（参考SplatLoc: 每5帧取1帧，900帧→180帧）
  # train_step=5: 每5帧采样，train_step=1: 使用全部帧
  train_step: 1
  
  # 验证集采样间隔（通常设为1，使用全部帧进行评估）
  val_step: 1
  
  # 图像尺寸 [width, height]
  image_size: [640, 480]
  
  # 最大训练样本数（null表示使用全部采样后的数据）
  # 注意：采样后再限制，例如train_step=5时，900帧→180帧，若max_train_samples=100则取前100帧
  max_train_samples: null
  
  # 最大验证样本数（null表示使用全部）
  max_val_samples: null
  
  # Gaussian点云路径（用于视锥裁剪生成2D-3D对应）
  gaussian_path: "/home/yons/Projects/data/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  
  # 是否使用深度图（可选，仅用于验证）
  use_depth: false
  
  # 初始位姿噪声配置（仅当loss.use_relative_pose=true时生效）
  # 用于模拟实际定位场景中的初始位姿误差
  # 建议：从小噪声开始训练，逐步增大（课程学习）
  pose_noise_rot_deg: 5.0    # 旋转噪声标准差（度）- 降低以便网络先学习基础修正
  pose_noise_trans_m: 0.5    # 平移噪声标准差（米）- 室内场景应该很小
  
  # 相机内参
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

# 损失函数配置
loss:
 
  # 是否使用相对位姿
  # true: 学习相对于初始位姿的增量变换（更稳定，适合SLAM/tracking场景）
  # false: 学习绝对位姿（适合全局定位场景）
  # 注意：启用时需要在数据集中提供initial_pose
  use_relative_pose: true
  
  # 是否归一化平移（平衡旋转和平移的梯度）
  # 先关闭，保持与之前训练一致
  normalize_translation: false
  
  # 是否使用Kendall's Loss（自动学习权重）
  # 现已修复位置编码破坏归一化的问题，启用Kendall Loss
  use_kendall: true
  # Kendall's Loss初始log_var（仅当use_kendall=true时有效）
  # 给旋转loss更高的初始权重（因为旋转更关键）
  # log_var_rotation=-1.0 -> 初始权重=exp(1)=2.72
  # log_var_translation=0.0 -> 初始权重=exp(0)=1.0
  init_log_var_rotation: -1.0
  init_log_var_translation: 0.0
  
  # 旋转损失类型（use_kendall=false时生效）: geodesic, l2, cosine, quaternion
  rotation_loss: 'geodesic'
  
  # 平移损失类型（use_kendall=false时生效）: l1, l2, smooth_l1
  translation_loss: 'l2'
  
  # 旋转损失权重（use_kendall=false时生效）
  # 保持与之前训练一致
  rotation_weight: 1.0
  
  # 平移损失权重（use_kendall=false时生效）
  translation_weight: 1.0
  
  # 🆕 Diversity Loss配置（对齐ICL-I2PReg）
  # 防止所有keypoints坍缩到同一位置，确保检测到的关键点分散分布
  diversity_weight: 0.01          # diversity loss权重
  diversity_margin_2d: 10.0       # 2D keypoint最小距离阈值（像素）
  diversity_margin_3d: 0.1        # 3D keypoint最小距离阈值（米）

# 训练配置
training:
  # 总epoch数
  num_epochs: 500
  
  # 批次大小（每GPU）
  # 使用较小batch size提高训练稳定性
  batch_size: 32
  
  # 验证批次大小（每GPU）
  val_batch_size: 32
  
  # DataLoader工作线程数（增大以加速数据加载）
  # 多GPU训练时增大到8可以更好地喂饱GPU
  num_workers: 24
  
  # 优化器类型: adam, adamw
  optimizer: 'adamw'
  
  # 学习率（提高以加速收敛，从小噪声开始可以用更大学习率）
  learning_rate: 1.0e-4
  
  # 解码器学习率（如果freeze_decoder=false）
  decoder_lr: 1.0e-5
  
  # 权重衰减
  weight_decay: 1.0e-4
  
  # 梯度裁剪阈值（提高到5.0以更好地控制梯度爆炸）
  grad_clip: 5.0
  
  # 学习率调度器类型: cosine, step, exponential, none
  scheduler: 'cosine'
  
  # 最小学习率（用于cosine scheduler）
  min_lr: 1.0e-6
  
  # 学习率衰减步长（用于step scheduler）
  lr_decay_step: 10
  
  # 学习率衰减系数（用于step/exponential scheduler）
  lr_decay_gamma: 0.5
  
  # 验证间隔（每N个epoch验证一次）
  val_interval: 2
  
  # checkpoint保存间隔（每N个epoch保存一次）
  save_interval: 10
  
  # TensorBoard日志记录间隔（每N步记录一次）
  log_interval: 10

# 可视化配置
visualization:
  # 是否启用可视化
  enable: true
  
  # 可视化间隔（每N个epoch保存一次可视化结果）
  vis_interval: 5
  
  # 每次可视化保存多少个样本
  num_samples: 3
  
  # 可视化类型（可以选择性启用以节省时间）
  vis_types:
    pose_prediction: true      # 位姿预测结果对比
    feature_similarity: true   # 2D-3D特征相似度矩阵
    correspondence: true       # 2D-3D对应关系
    query_evolution: false     # Query特征演化（较慢）
