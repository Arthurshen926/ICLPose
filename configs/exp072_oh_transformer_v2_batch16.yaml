# ============================================================
#  exp072_oh_transformer_v2_batch16.yaml
#  TransformerPoseNetV2 on OldHospital - 原模型 + 高吞吐
#
#  策略: 保持 exp070 的 3M params 模型 (已验证能收敛)
#        只提升训练吞吐量 (batch=16, feature cache, persistent workers)
#  
#  vs exp070: batch_size 2→16 (8× 吞吐), feature cache, 更多 epochs
#  vs exp071: 回退到 d_model=128 (3M params vs 14.7M), outer_iters=1
# ============================================================

exp_name: exp072_oh_transformer_v2_batch16
output_dir: output/exp072_oh_transformer_v2_batch16

# ── Model (same as exp070, proven to converge) ──
model:
  type: transformer_v2
  d_model: 128                # same as exp070
  feat_in_dim: 64
  n_heads: 4                  # same as exp070
  n_layers: 6                 # same as exp070
  ffn_dim: 256                # same as exp070
  dropout: 0.0
  attn_hw: [35, 61]
  fine_hw: [69, 121]
  damping: 0.001
  irls_iters: 3
  irls_huber_k: 1.345
  robust_kernel: huber
  pixel_stride: 1

# ── Renderer ──
renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  scale_model_paths:
    fine: output/feature_3dgs/oldhospital_da3_perscale_v2/fine/best_model.pth
  scale_resolutions:
    fine: [69, 121]
  img_height: 1080
  img_width: 1920
  fx: 1673.5
  fy: 1673.5
  cx: 960.0
  cy: 540.0

# ── Data ──
data:
  train_feature_dir: output/features_da3_unified/OldHospital
  train_traj_path: output/features_da3_unified/OldHospital/traj_w_c.txt

  val_feature_dir: null
  val_traj_path: null
  val_netvlad_poses: null
  val_split_ratio: 0.1

  noise_rot_deg: 4.0
  noise_trans_m: 0.2
  val_noise_rot_deg: 4.0
  val_noise_trans_m: 0.2

  batch_size: 16
  val_batch_size: 8
  num_workers: 8
  cache_features: true

# ── Training ──
training:
  lr: 2e-4                    # same as exp070
  weight_decay: 1e-4
  min_lr: 1e-6
  warmup_epochs: 5            # same as exp070
  epochs: 300                 # more epochs (each epoch is fast with cached features)
  phase1_epochs: 0
  grad_clip: 1.0
  use_amp: true
  gradient_accumulation_steps: 1
  vis_epoch_interval: 10      # 每10个epoch生成特征可视化

  loss:
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.85
    huber_delta: 5.0
    conf_reg_weight: 0.01
    gamma_outer: 0.8

  outer_iters: 1              # same as exp070 (stable)
  val_outer_iters: 3

  noise_curriculum:
    enabled: false
