# ============================================================
#  exp160_oh_flowfeat.yaml
#  OldHospital: FlowFeat DPT + Tri-Plane Feature Model
#
#  Major architectural changes from exp155:
#    1) FlowFeat DINOv2 ViT-B/14 DPT replaces SD+DINO (3 scales instead of 4)
#    2) Tri-Plane + MLP decoder replaces per-Gaussian feature vectors
#    3) Higher fine resolution: 76×136 vs 35×61 (~4× more pixels)
#
#  FlowFeat DPT intermediate shapes (128d @ 0.5× OH, 560×980 padded input):
#    coarse: layer_4_rn  128d → PCA 32d @ 20×35
#    mid:    path_4       128d → PCA 64d @ 40×70
#    fine:   path_3       128d → PCA 64d @ 80×140
# ============================================================

exp_name: exp160_oh_flowfeat
output_dir: output/exp160_oh_flowfeat

model:
  hidden_dim: 128
  decode_dim: 64
  local_radius: 6
  damping: 0.001
  fine_iters: 8
  mid_iters: 1
  coarse_hw: [20, 35]
  mid_hw: [40, 70]
  fine_hw: [80, 140]
  coarse_in_dim: 32
  mid_in_dim: 64
  fine_in_dim: 64
  flowfeat_mode: true

renderer:
  ply_path: output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  triplane_model_path: output/feature_3dgs/oldhospital_triplane_v2/best_model.pth
  scale_resolutions:
    coarse: [20, 35]
    mid: [40, 70]
    fine: [80, 140]
  img_height: 1080
  img_width: 1920
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  train_feature_dir: output/features_flowfeat_pca/OldHospital
  train_traj_path: output/features_flowfeat_pca/OldHospital/traj_w_c.txt
  scale_names: [coarse, mid, fine]

  val_feature_dir: null
  val_traj_path: null
  val_netvlad_poses: null
  val_split_ratio: 0.1

  noise_rot_deg: 10.0
  noise_trans_m: 0.5
  val_noise_rot_deg: 10.0
  val_noise_trans_m: 0.5

  batch_size: 4
  val_batch_size: 2
  num_workers: 4

training:
  epochs: 150
  phase1_epochs: 10
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true

  use_depth_warp: false

  outer_iters: 3
  val_outer_iters: 5

  loss:
    flow_weights:
      coarse: 0.3
      mid: 0.5
      fine: 1.0
    pose_weight: 1.0
    rot_weight: 1.0
    trans_weight: 10.0
    rot_loss_type: cosine
    gamma: 0.95
    gamma_outer: 0.95
    conf_coverage_range: [0.05, 0.95]

  noise_curriculum:
    enabled: true
    noise_rot_min: 2.0
    noise_trans_min: 0.05
    warmup_epochs: 40
