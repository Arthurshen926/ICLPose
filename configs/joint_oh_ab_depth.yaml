# Ablation: v1 baseline + depth supervision ONLY
# Tests: Pearson correlation monocular depth loss
# All other params identical to joint_oh_v1.yaml
#
# CUDA_VISIBLE_DEVICES=1 python -m feature_3dgs.train_2dgs_joint_v2 \
#   --config configs/joint_oh_ab_depth.yaml

exp_name: joint_oh_ab_depth

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_da3/OldHospital_indexed
  feature_scales:
    - fine

model:
  sh_degree: 3
  white_background: false

training:
  iterations: 30000
  longest_edge: 0
  eval_interval: 2500
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # LR (same as v1)
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding (same as v1)
  feature_embedding_lr: 0.01
  feature_weight: 0.1
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization (same as v1)
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # >>> ABLATION VARIABLE: Monocular depth supervision <<<
  mono_depth_dir: dataset/OldHospital/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000

  # Densification (same as v1)
  densify_from_iter: 500
  densify_until_iter: 20000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01

output_dir: output/2dgs_joint
