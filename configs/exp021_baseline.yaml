# exp021 基准配置 - 渐进式验证
# 目的：关闭所有高级特性，验证基础训练能够收敛
# 创建时间: 2026-02-03
# 
# 验证顺序:
#   1. [当前] 基准配置 - 关闭Kendall/RelativePose/Normalization
#   2. 验证通过后 -> 启用 use_relative_pose
#   3. 验证通过后 -> 启用 use_kendall

# 随机种子
seed: 42

# 输出目录
output_dir: "/home/yons/Projects/ICLPose/output/exp021_baseline"

# SplatLoc预训练模型配置
splatloc:
  gaussians_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  decoder_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/train_feat/ckpt.pth"
  config_path: "/home/yons/Projects/SplatLoc/configs/replica_nerf/base_config.yaml"
  freeze_decoder: true

# 场景配置
scene:
  bound: [[-1.0, 7.0], [-1.3, 3.7], [-1.7, 1.4]]
  voxel_sdf: 0.06

# 特征解码器配置
decoder:
  enc: 'HashGrid'
  num_layers: 4
  hidden_dim: 128
  final_dim: 256

# ICPoseNet模型配置
model:
  feature_dim: 256
  num_queries: 64
  fusion_layers: 2
  num_heads: 8
  dropout: 0.1

# 数据集配置
dataset:
  data_root: "/home/yons/Projects/ICLPose/dataset/room_0"
  train_scene: "Sequence_1"
  val_scene: "Sequence_2"
  train_step: 1
  val_step: 1
  image_size: [640, 480]
  max_train_samples: null
  max_val_samples: null
  gaussian_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  use_depth: false
  # 降低初始噪声，便于验证
  pose_noise_rot_deg: 3.0
  pose_noise_trans_m: 0.15
  # 相机内参
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

# ========================================
# 损失函数配置 - 基准设置
# ========================================
loss:
  # ❌ 关闭相对位姿 - 使用绝对位姿
  use_relative_pose: false
  
  # ❌ 关闭平移归一化
  normalize_translation: false
  
  # ❌ 关闭Kendall's Loss - 使用固定权重
  use_kendall: false
  
  # 使用geodesic loss保持正确的量级（0-180度）
  rotation_loss: 'geodesic'
  translation_loss: 'l2'
  
  # 固定权重
  rotation_weight: 1.0
  translation_weight: 1.0
  
  # 暂时关闭辅助loss，只验证基础位姿回归
  diversity_weight: 0.0
  reprojection_weight: 0.0

# 训练配置
training:
  num_epochs: 100          # 减少epoch数，快速验证
  batch_size: 32
  val_batch_size: 32
  num_workers: 8
  optimizer: 'adamw'
  learning_rate: 1.0e-4
  decoder_lr: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 5.0
  scheduler: 'cosine'
  min_lr: 1.0e-6
  val_interval: 2
  save_interval: 10
  log_interval: 10

# 可视化配置
visualization:
  enable: true
  vis_interval: 10
  num_samples: 3
  vis_types:
    pose_prediction: true
    feature_similarity: false
    correspondence: false
    query_evolution: false
