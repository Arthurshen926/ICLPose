# 隐式对应关系位姿估计训练配置文件 - exp017（迭代精化版本）
# 使用方法: python train.py --config configs/train_config_exp017.yaml

# 随机种子
seed: 42

# 输出目录
output_dir: "/home/yons/Projects/ICLPose/output/exp017"

# SplatLoc预训练模型配置
splatloc:
  # Gaussian模型路径（.ply文件）
  gaussians_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  
  # 特征解码器路径（.pth文件）
  decoder_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/train_feat/ckpt.pth"
  
  # SplatLoc配置文件路径
  config_path: "/home/yons/Projects/SplatLoc/configs/replica_nerf/base_config.yaml"
  
  # 是否冻结解码器参数
  freeze_decoder: true

# 场景配置
scene:
  bound: [[-1.0, 7.0], [-1.3, 3.7], [-1.7, 1.4]]
  voxel_sdf: 0.06

# 特征解码器配置
decoder:
  enc: 'HashGrid'
  num_layers: 4
  hidden_dim: 128
  final_dim: 256

# ICPoseNet模型配置 - 🆕 迭代精化版本
model:
  # 模型类型: standard（单阶段）, iterative（多阶段独立参数）, iterative_lite（多阶段共享参数）
  model_type: 'iterative'
  
  # 特征维度
  feature_dim: 256
  
  # Query数量（增加以提高精度）
  num_queries: 128
  
  # 🆕 迭代精化阶段数（iterative/iterative_lite模型使用）
  # 更多阶段 = 更精细的位姿修正
  num_stages: 3
  
  # 🆕 隐藏层维度（增大以提高模型容量）
  hidden_dim: 512
  
  # 融合层数（standard模型使用）
  fusion_layers: 2
  
  # 注意力头数
  num_heads: 8
  
  # Dropout概率
  dropout: 0.1

# 数据集配置
dataset:
  data_root: "/home/yons/Projects/ICLPose/dataset/room_0"
  train_scene: "Sequence_1"
  val_scene: "Sequence_2"
  train_step: 1
  val_step: 1
  image_size: [640, 480]
  max_train_samples: null
  max_val_samples: null
  gaussian_path: "/home/yons/Projects/ICLPose/dataset/room_0/splatloc-test/data/room_0/point_cloud/final/point_cloud.ply"
  use_depth: false
  
  # 🆕 初始位姿噪声配置 - 适度增大以覆盖更大范围
  pose_noise_rot_deg: 5.0    # 旋转噪声标准差（度）
  pose_noise_trans_m: 0.3    # 平移噪声标准差（米）
  
  # 相机内参
  fx: 320.0
  fy: 320.0
  cx: 319.5
  cy: 239.5

# 损失函数配置
loss:
  # 必须启用相对位姿（迭代模型需要）
  use_relative_pose: true
  normalize_translation: false
  
  # Kendall's Loss配置
  use_kendall: true
  init_log_var_rotation: 0.0
  init_log_var_translation: -1.0
  
  rotation_loss: 'geodesic'
  translation_loss: 'l2'
  rotation_weight: 1.0
  translation_weight: 1.0
  
  # Diversity Loss配置
  diversity_weight: 0.05
  diversity_margin_2d: 16.0
  diversity_margin_3d: 0.16
  
  # Reprojection Loss配置
  reprojection_weight: 0.1

# 训练配置
training:
  # 🆕 增加训练轮数（迭代模型需要更长时间收敛）
  num_epochs: 800
  
  batch_size: 32
  val_batch_size: 32
  num_workers: 8
  
  optimizer: 'adamw'
  learning_rate: 1.0e-4
  decoder_lr: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 5.0
  
  scheduler: 'cosine'
  min_lr: 1.0e-6
  lr_decay_step: 10
  lr_decay_gamma: 0.5
  
  val_interval: 2
  save_interval: 10
  log_interval: 10

# 可视化配置
visualization:
  enable: true
  vis_interval: 10
  num_samples: 3
  vis_types:
    pose_prediction: true
    feature_similarity: true
    correspondence: true
    query_evolution: false
