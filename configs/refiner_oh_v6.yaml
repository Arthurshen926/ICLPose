# ============================================================
#  refiner_oh_v6.yaml
#  PoseRefiner V6: High-res fine + multi-iter training
#
#  Same as V5 (fine_hw=68×120) but keeps outer_iters=3 in training.
#  Compares: does single-step vs multi-step training matter at high res?
#
#  Also reduces noise curriculum max to 6° — focuses the model on the
#  more achievable correction range (8° → 5° should succeed in 1 step).
#
#  Training:
#    CUDA_VISIBLE_DEVICES=4 python scripts/train_refiner.py \
#        --config configs/refiner_oh_v6.yaml \
#        --warmstart output/refiner_oh_v1/checkpoints/latest.pth
# ============================================================

exp_name: refiner_oh_v6
output_dir: output/refiner_oh_v6

model:
  in_dim: 64
  match_dim: 64
  hidden_dim: 128
  n_heads: 4
  n_attn_layers: 2
  ffn_dim: 128
  local_radius: 4
  fine_iters: 8
  damping: 0.001
  coarse_hw: [17, 30]
  fine_hw: [68, 120]
  solver_hw: [68, 120]
  solver_upsample: 4
  depth_normalize: false
  sequential_solve: true
  detach_conf: true
  conf_floor: 0.1
  solver_trans_scale: 0.0
  use_trans_head: false
  trans_head_mode: replace

renderer:
  ply_path: output/2dgs_joint/joint_oh_v7_radio/point_cloud/best/point_cloud.ply
  feature_model_path: output/2dgs_joint/joint_oh_v7_radio/features_best/fine_radio/best_model.pth
  feat_hw: [68, 120]
  img_hw: [1080, 1920]
  fx: 1663.12
  fy: 1663.12
  cx: 960.0
  cy: 540.0

data:
  feature_dir: output/features_radio/OldHospital_indexed
  traj_path: output/features_radio/OldHospital_indexed/traj_w_c.txt
  noise_rot_deg: 8.0
  noise_trans_m: 0.25
  val_noise_rot_deg: 8.0
  val_noise_trans_m: 0.25
  batch_size: 4
  val_batch_size: 4
  num_workers: 4

training:
  epochs: 200
  phase1_epochs: 200
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.00001
  grad_clip: 1.0
  use_amp: true
  outer_iters: 3                 # multi-iter training (same as V1)
  val_outer_iters: 5
  loss:
    flow_weight: 5.0
    pose_weight: 0.0
    rot_weight: 1.0
    trans_weight: 10.0
    gamma: 0.8
    conf_reg_weight: 0.3
    contrast_weight: 0.5
    xi_weight: 0.0
  noise_curriculum:
    enabled: true
    warmup_epochs: 20
    base_rot_deg: 2.0
    base_trans_m: 0.05
    max_rot_deg: 6.0             # lower max noise — focus on achievable range
    max_trans_m: 0.18
