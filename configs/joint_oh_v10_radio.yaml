# Joint 2DGS Geometry + RADIO Feature — OldHospital  v10-RADIO
# =============================================================
# 完全修复的植被管理实验
#
# 修复历史:
#   v6-v8: 投影bug(.T), 植被识别只有5-15个 (应有879+)
#   v9: 投影修复但仍在代码运行前, 实际未生效
#   v9b: 投影修复生效! 879个植被识别. 但opacity reset在pruning前 
#        → 所有植被opacity=0.01 < 0.15 → 879个全删!
#   v10: 植被修剪在opacity reset之前, veg_max_scale从0.005下调到0.003
#
# v10 核心改进:
#   1. 修剪在opacity reset之前 → 检查真实opacity
#   2. veg_max_scale: 0.003 * 34.88 = 0.105 (比med=0.3更严格)
#   3. veg_prune_opacity: 0.05 (降低, 只移除真正透明的)
#   4. veg_prune_scale_percentile: 70 (移除最大30%植被Gaussian)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=3 python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v10_radio.yaml

exp_name: joint_oh_v10_radio

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_radio/OldHospital_indexed
  feature_scales:
    - fine_radio

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 40000
  longest_edge: 0
  eval_interval: 1000
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # Learning rates — same as v5 baseline
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision — exclude vegetation
  mono_depth_dir: output/oh_depth_local/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000
  depth_exclude_vegetation: true

  # Densification
  densify_from_iter: 500
  densify_until_iter: 25000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 5000
  opacity_reset_value: 0.01
  size_threshold: null
  max_gaussians: 0

  # Sky / object masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork
  use_appearance: true
  appearance_embed_dim: 32
  appearance_lr: 0.001
  appearance_reg: 0.0
  appearance_mean_reg: 0.01

  # Transient mask
  use_transient: true
  transient_lr: 0.001
  transient_reg: 0.01

  # Semantic-guided vegetation control (ALL BUGS FIXED)
  semantic_mask_dir: dataset/OldHospital/semantic_masks
  vegetation_reg_scale: 0.3
  vegetation_scale_boost: 3.0
  veg_prune_opacity: 0.05              # 仅移除真正透明的植被 (pre-reset)
  veg_prune_scale_percentile: 70       # p70 植被局部 → 移除最大30%植被Gaussian
  veg_max_scale: 0.003                 # 硬上限 = 0.003*34.88 = 0.105 scene units
  veg_sample_cams: 50
  veg_vote_threshold: 0.3

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
