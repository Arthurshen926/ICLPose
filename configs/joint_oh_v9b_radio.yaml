# Joint 2DGS Geometry + RADIO Feature — OldHospital  v9b-RADIO
# =============================================================
# 修复投影bug后的首次正确植被管理实验
#
# 关键bug修复 (影响所有v6-v9):
#   w2c = cam.get_world_view_transform().T  ← 错误! 不应转置!
#   get_world_view_transform()已返回标准w2c矩阵, .T导致投影完全错误
#   → 所有之前的植被识别都是废的(只识别了5-15个, 应该有数千个)
#
# v9b = v9配置 + 修正后的投影代码:
#   - veg_sample_cams: 50 (充分采样)
#   - veg_vote_threshold: 0.3 (宽松阈值)
#   - veg_max_scale: 0.005 (= 0.174 scene units)
#   - veg_prune_scale_percentile: 80 (植被局部p80)
#   - opacity_reset_interval: 4000 (频繁修剪+clamp)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=4 python -m feature_3dgs.train_2dgs_joint_v3 \
#     --config configs/joint_oh_v9b_radio.yaml

exp_name: joint_oh_v9b_radio

dataset:
  type: cambridge
  source_dir: dataset/OldHospital
  images: ''
  feature_dir: output/features_radio/OldHospital_indexed
  feature_scales:
    - fine_radio

model:
  sh_degree: 3
  white_background: false
  random_background: false

training:
  iterations: 40000
  longest_edge: 0
  eval_interval: 1000
  save_interval: 5000
  vis_frames: [0, 200, 500, 800]

  # Learning rates — same as v5 baseline
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01

  # Feature embedding
  feature_embedding_lr: 0.01
  feature_weight: 0.5
  feature_cos_weight: 0.5
  feature_start_iter: 500
  detach_feat_geometry: false

  # RGB loss
  lambda_dssim: 0.2

  # 2DGS geometry regularization
  lambda_normal: 0.05
  lambda_dist: 0.01
  lambda_scale: 0.001
  scale_reg_threshold: 0.3
  reg_start_iter: 500

  # Monocular depth supervision — exclude vegetation
  mono_depth_dir: output/oh_depth_local/mono_depth
  lambda_depth: 0.05
  depth_start_iter: 3000
  depth_warmup_iters: 2000
  depth_exclude_vegetation: true

  # Densification
  densify_from_iter: 500
  densify_until_iter: 25000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 4000
  opacity_reset_value: 0.01
  size_threshold: null
  max_gaussians: 0

  # Sky / object masking
  use_mask: true
  mask_path: dataset/OldHospital/masks.pkl

  # AppearanceNetwork
  use_appearance: true
  appearance_embed_dim: 32
  appearance_lr: 0.001
  appearance_reg: 0.0
  appearance_mean_reg: 0.01

  # Transient mask
  use_transient: true
  transient_lr: 0.001
  transient_reg: 0.01

  # Semantic-guided vegetation control (PROJECTION BUG FIXED in v9b!)
  semantic_mask_dir: dataset/OldHospital/semantic_masks
  vegetation_reg_scale: 0.3
  vegetation_scale_boost: 3.0
  veg_prune_opacity: 0.15
  veg_prune_scale_percentile: 80
  veg_max_scale: 0.005                 # 0.005 * 34.88 = 0.174 scene units
  veg_sample_cams: 50
  veg_vote_threshold: 0.3

  # Gradient accumulation
  grad_accum_steps: 4

output_dir: output/2dgs_joint
