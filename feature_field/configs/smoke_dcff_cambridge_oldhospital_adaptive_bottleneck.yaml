exp_name: smoke_dcff_cambridge_oldhospital_adaptive_bottleneck
output_dir: /root/ICLPose/result/feature_field

dataset:
  type: cambridge
  source_dir: /hy-tmp/Cambridge_stdloc/OldHospital
  images: processed
  feature_dir: /root/ICLPose/result/feature_extract/features_radio_dual/cambridge_oldhospital_processed

teacher:
  mode: online_bottleneck
  input_longest_edge: 320
  pca_init_dir: /root/ICLPose/result/feature_extract/features_radio_dual/cambridge_oldhospital_processed/pca_params
  lr_projection: 0.0003
  compress:
    hidden_dim: 64
    sample_pixels: 64
    recon_cos_weight: 0.5
    recon_l1_weight: 0.1
    loss_weight: 0.05
    normalize_output: true

model:
  sh_degree: 3
  white_background: false
  latent_dim: 24
  fine_latent_dim: 16
  coarse_latent_dim: 8
  feature_dim: 96
  fine_feature_dim: 96
  coarse_feature_dim: 32
  coarse_smoothing_kernel: 3

fine_decoder:
  type: spatial
  hidden_dim: 64
  use_viewdirs: false

coarse_decoder:
  mode: carrier_residual
  carrier_hidden_dim: 32
  gate_hidden_dim: 32

refiner:
  type: depth_guided
  hidden_dim: 64

hash_grid:
  input_mode: implicit_scale
  scale_dim: 2
  scale_pe_freqs: 2
  include_raw_scale: true
  n_levels: 4
  n_features_per_level: 2
  log2_hashmap_size: 16
  base_resolution: 16
  max_resolution: 256
  mlp_hidden: 64
  mlp_layers: 2

training:
  init_ply: /root/ICLPose/result/feature_gaussian/joint_rgb_geometry_cambridge_oldhospital_processed_rebuild_v4_4gpu_1280_safe_rgbft_5k/point_cloud/best/point_cloud.ply
  iterations: 2
  seed: 12345
  freeze_geometry: true
  batch_size: 1

  fine_start_iter: 0
  coarse_start_iter: 1
  warmup_iters: 1
  grad_clip: 0.75
  coarse_downsample: true

  position_lr_init: 0.000005
  position_lr_final: 0.00000005
  feature_lr: 0.0005
  opacity_lr: 0.002
  scaling_lr: 0.0002
  rotation_lr: 0.0001

  latent_lr: 0.0004
  lr_hash_grid: 0.0003
  lr_fine_decoder: 0.0007
  lr_coarse_fusion: 0.0007
  lr_refiner: 0.0007

  percent_dense: 0.01
  longest_edge: 320

  log_every: 1
  save_every: 999999
  val_every: 0
  sh_degree_up_every: 1000
  use_amp: true

  loss:
    lambda_dssim: 0.2
    lambda_fine_cos: 1.0
    lambda_fine_l1: 1.0
    lambda_coarse_cos: 1.0
    lambda_coarse_l1: 1.0
    lambda_fine_nce: 0.02
    lambda_coarse_nce: 0.02
    nce_temperature: 0.07
    nce_samples: 32
    lambda_tv: 0.01
    lambda_coarse_screen_tv: 0.05
    lambda_normal: 0.0
    lambda_dist: 0.0
    lambda_channel_std: 0.05
