# Reconstruction visualization config for DCFF v10b coarse fix
# Usage:
#   python -m feature_field.visualize_reconstruction \
#     --config feature_field/configs/reconstruction_oldhospital_v10b_coarse_fix.yaml \
#     --num_samples 8

dataset:
  source_dir: dataset/OldHospital
  colmap_dir: dataset/OldHospital/sparse/0
  train_split: dataset/OldHospital/dataset_train.txt
  test_split: dataset/OldHospital/dataset_test.txt

dcff:
  checkpoint: feature_field/output/dcff_oldhospital_v10b_coarse_fix/checkpoints/best.pth
  ply_path: feature_gaussian/output/2dgs_models/OldHospital/v7_depth/point_cloud/iteration_30000/point_cloud.ply
  feature_dim: 64
  latent_dim: 32
