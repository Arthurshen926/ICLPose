exp_name: dcff_cambridge_oldhospital_processed_cached64_v3_legacy_fullres_4gpu
output_dir: /root/ICLPose/result/feature_field

dataset:
  type: cambridge
  source_dir: /hy-tmp/Cambridge_stdloc/OldHospital
  images: processed
  feature_dir: /root/ICLPose/result/feature_extract/features_radio_dual/cambridge_oldhospital_processed

teacher:
  mode: cached

model:
  sh_degree: 3
  white_background: false
  latent_dim: 64
  fine_latent_dim: 40
  coarse_latent_dim: 24
  feature_dim: 64
  fine_feature_dim: 64
  coarse_feature_dim: 64
  coarse_smoothing_kernel: 1

fine_decoder:
  type: spatial
  hidden_dim: 192
  use_viewdirs: false

coarse_decoder:
  mode: carrier_residual
  carrier_hidden_dim: 128
  gate_hidden_dim: 96

refiner:
  type: none

hash_grid:
  input_mode: legacy
  n_levels: 16
  n_features_per_level: 2
  log2_hashmap_size: 20
  base_resolution: 16
  max_resolution: 4096
  sh_degree: 3
  mlp_hidden: 256
  mlp_layers: 3

training:
  init_ply: /root/ICLPose/result/feature_gaussian/joint_rgb_geometry_cambridge_oldhospital_processed_rebuild_v4_4gpu_1280_safe_rgbft_5k/point_cloud/best/point_cloud.ply
  iterations: 5000
  seed: 12345
  freeze_geometry: true
  batch_size: 16
  cache_resized_images: true
  image_cache_dtype: float16

  fine_start_iter: 0
  coarse_start_iter: 100
  warmup_iters: 200
  grad_clip: 0.75
  coarse_downsample: false

  position_lr_init: 0.000005
  position_lr_final: 0.00000005
  feature_lr: 0.0005
  opacity_lr: 0.002
  scaling_lr: 0.0002
  rotation_lr: 0.0001

  latent_lr: 0.00045
  lr_hash_grid: 0.00035
  lr_fine_decoder: 0.0007
  lr_coarse_fusion: 0.0007
  lr_refiner: 0.0000

  percent_dense: 0.01
  longest_edge: 640

  log_every: 50
  best_save_every: 250
  save_every: 1000
  val_every: 1000
  sh_degree_up_every: 1000
  use_amp: true

  loss:
    lambda_dssim: 0.2
    lambda_fine_cos: 1.0
    lambda_fine_l1: 1.0
    lambda_coarse_cos: 1.0
    lambda_coarse_l1: 1.0
    lambda_fine_nce: 0.03
    lambda_coarse_nce: 0.03
    nce_temperature: 0.07
    nce_samples: 256
    lambda_tv: 0.01
    lambda_coarse_screen_tv: 0.02
    lambda_normal: 0.0
    lambda_dist: 0.0
    lambda_channel_std: 0.05
